<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações da Empresa - ERP</title>
    
    <style>
        /* ================= DESIGN SYSTEM & THEMES ================= */
        :root {
            --bg-color: #0b1320; --card-bg: #151f2b; --text-main: #ffffff;
            --text-muted: #8b9eb3; --accent-neon: #a4e320; --accent-hover: #8cc21a;
            --purple-pill: #8273f6; --border-color: #2a3645;
            --danger-color: #ff4d4d; --info-color: #17a2b8; --success-color: #28a745;
        }

        .light-theme {
            --bg-color: #f4f7f6; --card-bg: #ffffff; --text-main: #1a1a1a;
            --text-muted: #6c757d; --accent-neon: #28a745; --accent-hover: #218838;
            --purple-pill: #6f42c1; --border-color: #e0e0e0; --danger-color: #dc3545;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--bg-color); color: var(--text-main); transition: background-color 0.3s, color 0.3s; padding-bottom: 50px;}
        
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .card { background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 1px solid var(--border-color); margin-bottom: 20px;}
        
        .secao-titulo { font-size: 1.3em; color: var(--text-main); margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; text-align: center;}
        
        label { font-weight: bold; color: var(--text-muted); font-size: 0.9em; display: block; margin-bottom: 5px;}
        input[type="text"], input[type="email"] { width: 100%; padding: 12px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-color); color: var(--text-main); font-size: 1em; outline: none; transition: border-color 0.2s;}
        input:focus { border-color: var(--accent-neon); }

        .linha-form { display: flex; gap: 15px; flex-wrap: wrap; }
        .coluna-form { flex: 1; min-width: 250px; }

        .btn-neon { background: var(--accent-neon); color: #000; width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: transform 0.1s; margin-top: 20px;}
        .btn-neon:active { transform: scale(0.98); }
        .btn-neon:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ================= ÁREA DA LOGO ================= */
        .area-logo-preview { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 25px; padding: 20px; background: rgba(0,0,0,0.1); border-radius: 12px; border: 1px dashed var(--border-color);}
        .img-preview { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--purple-pill); background-color: var(--bg-color); box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 15px;}
        
        .botoes-imagem { display: flex; gap: 10px; width: 100%; flex-wrap: wrap;}
        .btn-acao-img { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: white;}
        .btn-camera { background-color: var(--info-color); }
        .btn-galeria { background-color: var(--border-color); color: var(--text-main); }
    </style>
</head>
<!-- [FIM: BLOCO 1 - HEAD E CSS] -->


    <body>
    <!-- O nosso navbar.js irá injetar o cabeçalho seguro aqui automaticamente -->

    <div class="container">
        <!-- [INÍCIO: PAINEL DE CONFIGURAÇÃO] -->
        <div id="app" class="card">
            <h2 class="secao-titulo">Dados do Emissor / Empresa</h2>
            
            <form id="form-perfil">
                <!-- Área de Exibição e Seleção da Logo/Avatar -->
                <div class="area-logo-preview">
                    <img id="img-atual" class="img-preview" src="https://via.placeholder.com/150?text=Sem+Foto" alt="Avatar">
                    
                    <div class="botoes-imagem">
                        <button type="button" class="btn-acao-img btn-camera" onclick="document.getElementById('input-camera').click()">📷 Tirar Foto</button>
                        <button type="button" class="btn-acao-img btn-galeria" onclick="document.getElementById('input-galeria').click()">📁 Galeria</button>
                    </div>

                    <input type="file" id="input-camera" accept="image/*" capture="environment" style="display: none;" onchange="processarImagemSelecionada(event)">
                    <input type="file" id="input-galeria" accept="image/*" style="display: none;" onchange="processarImagemSelecionada(event)">
                    <p id="status-img" style="color: var(--accent-neon); font-size: 0.85em; display: none; margin-top: 10px;"></p>
                </div>

                <!-- Campos de Edição Atualizados para Pessoa Física/Jurídica -->
                <label for="input-nome">Nome (Razão Social ou Nome Completo):</label>
                <input type="text" id="input-nome" placeholder="Ex: Bebidas Express LTDA / João Silva" required>
                
                <div class="linha-form">
                    <div class="coluna-form">
                        <label for="input-documento">CNPJ ou CPF:</label>
                        <input type="text" id="input-documento" placeholder="00.000.000/0000-00">
                    </div>
                    <div class="coluna-form">
                        <label for="input-ie">Inscrição Estadual (ou RG):</label>
                        <input type="text" id="input-ie" placeholder="Isento / Número">
                    </div>
                </div>

                <div class="linha-form">
                    <div class="coluna-form">
                        <label for="input-telefone">Telefone / WhatsApp:</label>
                        <input type="text" id="input-telefone" placeholder="(91) 90000-0000">
                    </div>
                    <div class="coluna-form">
                        <label for="input-email-contato">E-mail de Contato Público:</label>
                        <input type="email" id="input-email-contato" placeholder="contato@empresa.com">
                    </div>
                </div>

                <label for="input-endereco">Endereço Completo da Loja:</label>
                <input type="text" id="input-endereco" placeholder="Ex: Av. Principal, 123, Bairro, Belém - PA">

                <button type="submit" id="btn-salvar" class="btn-neon">💾 Salvar Dados da Empresa</button>
            </form>
        </div>
        <!-- [FIM: PAINEL DE CONFIGURAÇÃO] -->
    </div>
<!-- [FIM: BLOCO 2 - HTML BODY] -->

    <!-- [INÍCIO: MOTOR DE SEGURANÇA E SCRIPTS] -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase_config.js"></script>
    
    <!-- O nosso Guarda de Trânsito Global (Navbar) que limpa e monta o cabeçalho -->
    <script src="navbar.js"></script>

    <script>
        /* ================= VARIÁVEIS GLOBAIS ================= */
        let sessaoAtual = null;
        let urlFotoAntiga = null;
        let arquivoFotoProntoParaUpload = null;

        /* ================= O MOTOR DE COMPRESSÃO (CANVAS) ================= */
        async function comprimirImagemParaUpload(arquivoOriginal) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(arquivoOriginal);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800; const MAX_HEIGHT = 800;
                        let width = img.width; let height = img.height;
                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            const nomeLimpo = "foto_" + Date.now() + ".jpg";
                            resolve(new File([blob], nomeLimpo, { type: 'image/jpeg', lastModified: Date.now() }));
                        }, 'image/jpeg', 0.8);
                    };
                    img.onerror = (erro) => reject(erro);
                };
                reader.onerror = (erro) => reject(erro);
            });
        }

        async function processarImagemSelecionada(event) {
            const arquivoBruto = event.target.files[0];
            if (!arquivoBruto) return;
            try {
                const statusTxt = document.getElementById('status-img');
                statusTxt.style.display = "block";
                statusTxt.textContent = "⏳ A otimizar a imagem, aguarde...";
                
                arquivoFotoProntoParaUpload = await comprimirImagemParaUpload(arquivoBruto);
                document.getElementById('img-atual').src = URL.createObjectURL(arquivoFotoProntoParaUpload);
                statusTxt.style.display = "none";
            } catch (error) {
                alert("Erro ao processar a imagem da câmara.");
            }
        }

        async function apagarFotoNoStorage(urlDaFoto) {
            try {
                const nomeLimpo = urlDaFoto.split('/').slice(-2).join('/'); 
                const nomeDoArquivo = decodeURIComponent(nomeLimpo.split('?')[0]);
                await clienteSupabase.storage.from('foto_avatar').remove([nomeDoArquivo]);
            } catch (err) { console.log("Aviso: Foto antiga não encontrada para apagar."); }
        }

        /* ================= CARREGAMENTO DE DADOS (READ) ================= */
        // Como o navbar.js já gere a segurança e cabeçalho, aqui apenas preenchemos o formulário
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data: { session } } = await clienteSupabase.auth.getSession();
                if (!session) return; // O navbar.js já vai expulsar o usuário, apenas paramos a execução aqui
                sessaoAtual = session;

                // Busca todos os campos recém-criados no Supabase
                const { data: perfil } = await clienteSupabase
                    .from('profiles')
                    .select('nome, foto_avatar, documento, endereco, telefone, email_contato, inscricao_estadual')
                    .eq('id', session.user.id)
                    .single();

                if (perfil) {
                    if (perfil.nome) document.getElementById('input-nome').value = perfil.nome;
                    if (perfil.documento) document.getElementById('input-documento').value = perfil.documento;
                    if (perfil.endereco) document.getElementById('input-endereco').value = perfil.endereco;
                    if (perfil.telefone) document.getElementById('input-telefone').value = perfil.telefone;
                    if (perfil.email_contato) document.getElementById('input-email-contato').value = perfil.email_contato;
                    if (perfil.inscricao_estadual) document.getElementById('input-ie').value = perfil.inscricao_estadual;
                    
                    if (perfil.foto_avatar) {
                        document.getElementById('img-atual').src = perfil.foto_avatar;
                        urlFotoAntiga = perfil.foto_avatar;
                    }
                }
            } catch (error) {
                console.error("Erro ao carregar dados do perfil:", error);
            }
        });

        /* ================= GRAVAÇÃO DE DADOS (WRITE) ================= */
        document.getElementById('form-perfil').addEventListener('submit', async (evento) => {
            evento.preventDefault(); 
            
            const btnSubmit = document.getElementById('btn-salvar');
            btnSubmit.textContent = "⏳ A gravar configurações...";
            btnSubmit.disabled = true;

            try {
                let urlFinalDaFoto = urlFotoAntiga; 
                
                if (arquivoFotoProntoParaUpload) {
                    if (urlFotoAntiga != null) await apagarFotoNoStorage(urlFotoAntiga);
                    const nomeParaServidor = `${sessaoAtual.user.id}/${arquivoFotoProntoParaUpload.name}`;
                    const { error: uploadError } = await clienteSupabase.storage
                        .from('foto_avatar').upload(nomeParaServidor, arquivoFotoProntoParaUpload);
                    if (uploadError) throw uploadError;
                    
                    const { data: urlData } = clienteSupabase.storage.from('foto_avatar').getPublicUrl(nomeParaServidor);
                    urlFinalDaFoto = urlData.publicUrl; 
                }

                // Salva todos os campos na tabela 'profiles' de forma segura
                const payload = { 
                    nome: document.getElementById('input-nome').value.trim(), 
                    foto_avatar: urlFinalDaFoto,
                    documento: document.getElementById('input-documento').value.trim(),
                    endereco: document.getElementById('input-endereco').value.trim(),
                    telefone: document.getElementById('input-telefone').value.trim(),
                    email_contato: document.getElementById('input-email-contato').value.trim(),
                    inscricao_estadual: document.getElementById('input-ie').value.trim()
                };

                const { error: updateError } = await clienteSupabase
                    .from('profiles')
                    .update(payload)
                    .eq('id', sessaoAtual.user.id);

                if (updateError) throw updateError;

                alert("✅ Dados salvos com sucesso!");
                urlFotoAntiga = urlFinalDaFoto; 
                arquivoFotoProntoParaUpload = null; 
                
                // Recarrega a página levemente para o navbar.js atualizar a foto no topo
                window.location.reload();

            } catch (erro) {
                console.error(erro);
                alert("❌ Erro ao guardar.");
            } finally {
                btnSubmit.textContent = "💾 Salvar Dados da Empresa";
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>
</html>
