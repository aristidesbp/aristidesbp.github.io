<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - Estoque BevDistro</title>
    
    <style>
        /* ================= DESIGN SYSTEM & THEMES ================= */
        :root {
            --bg-color: #0b1320; 
            --card-bg: #151f2b;  
            --text-main: #ffffff;
            --text-muted: #8b9eb3;
            --accent-neon: #a4e320; 
            --accent-hover: #8cc21a;
            --purple-pill: #8273f6; 
            --header-bg: #0b1320;
            --border-color: #2a3645;
            --danger-color: #ff4d4d;
            --warning-color: #ffc107;
            --info-color: #17a2b8;
        }

        .light-theme {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #6c757d;
            --accent-neon: #28a745;
            --accent-hover: #218838;
            --purple-pill: #6f42c1;
            --header-bg: #ffffff;
            --border-color: #e0e0e0;
            --danger-color: #dc3545;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--bg-color); color: var(--text-main); transition: background-color 0.3s, color 0.3s; padding-bottom: 50px;}
        
        /* ================= HEADER ================= */
        header { background-color: var(--header-bg); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-color); transition: background-color 0.3s;}
        .logo-area { display: flex; align-items: center; gap: 10px; font-size: 1.2em; font-weight: bold; }
        .logo-icon { color: var(--accent-neon); }
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .icon-btn { background: none; border: none; color: var(--text-main); font-size: 1.5em; cursor: pointer; padding: 0; }
        
        /* ================= CONTROLES E BUSCA ================= */
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        
        .grupo-botoes-topo { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;}
        .btn { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9em; font-weight: bold; color: #000; transition: opacity 0.2s;}
        .btn:hover { opacity: 0.8; }
        .btn-neon { background: var(--accent-neon); }
        .btn-secundario { background: var(--border-color); color: var(--text-main); }
        .btn-danger { background: var(--danger-color); color: white; }
        .btn-warning { background: var(--warning-color); color: #000; }
        
        .search-box { flex-grow: 1; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; display: flex; align-items: center; padding: 5px 15px; margin-bottom: 15px;}
        .search-box input { background: transparent; border: none; color: var(--text-main); width: 100%; padding: 10px; outline: none; font-size: 1em;}
        .search-box input::placeholder { color: var(--text-muted); }
        .search-box button { background: none; border: none; color: var(--text-main); font-size: 1.2em; cursor: pointer; border-left: 1px solid var(--border-color); padding-left: 15px;}

        /* ================= LISTA DE PRODUTOS ================= */
        .barra-acoes-lote { background-color: rgba(255, 193, 7, 0.1); padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; display: none; align-items: center; justify-content: space-between; border: 1px solid var(--warning-color);}
        .area-selecionar-todos { padding: 10px 15px; background: var(--card-bg); border-radius: 8px; margin-bottom: 15px; display: none; align-items: center; border: 1px solid var(--border-color); }
        
        .item-lista { background: var(--card-bg); padding: 15px; border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 10px; display: flex; flex-direction: row; gap: 15px; align-items: center;}
        .chk-item { transform: scale(1.3); cursor: pointer; accent-color: var(--accent-neon); }
        
        .conteudo-item { display: flex; flex-direction: column; gap: 5px; flex-grow: 1; }
        .item-titulo { font-size: 1.1em; font-weight: bold; color: var(--text-main);}
        .badge-estoque { background: var(--purple-pill); color: white; padding: 3px 8px; border-radius: 12px; font-size: 0.75em; margin-left: 10px;}
        .badge-lixeira { background: var(--danger-color); color: white; padding: 3px 8px; border-radius: 12px; font-size: 0.75em; margin-left: 10px;}
        
        .item-preco { color: var(--accent-neon); font-weight: bold; font-size: 1.1em;}
        .item-categoria { font-size: 0.85em; color: var(--text-muted); }
        .img-preview { max-width: 80px; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 5px;}
        
        .botoes-acao { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;}
        
        /* ================= UTILITÁRIOS ================= */
        .info { background-color: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; font-weight: bold;}
        .paginacao { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; }
        .paginacao button:disabled { opacity: 0.3; cursor: not-allowed; }
        
        #scanner-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        #reader-admin { width: 100%; max-width: 500px; background: white; border-radius: 12px; overflow: hidden; }

        #toast-container { position: fixed; top: 80px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 15px 20px; border-radius: 8px; color: #fff; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); opacity: 0; transform: translateX(100%); transition: all 0.3s ease; }
        .toast.mostrar { opacity: 1; transform: translateX(0); }
        .toast-sucesso { background-color: var(--accent-neon); color: #000;}
        .toast-erro { background-color: var(--danger-color); }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>
    <div id="toast-container"></div>

    <!--cabecalho_painel-->
    <header>
        <div class="logo-area">
            <span class="logo-icon">⚡</span> Gestão de Estoque
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="window.location.href='menu.html'" title="Ir para o Menu Principal">🏠</button>
            
            <button class="icon-btn" onclick="toggleTheme()" title="Alterar Tema">🌓</button>
            <button id="btn-sair" class="icon-btn" style="color: var(--danger-color); display: none;" title="Sair">🚪</button>
        </div>
    </header>
    <!--/cabecalho_painel-->

    <div class="container">
        <div id="status" class="info" style="margin-bottom: 20px; text-align: center;">Autenticando sessão...</div>

        <div id="app" style="display: none;">
            
            <!--controles_superiores-->
            <div class="grupo-botoes-topo">
                <button id="btn-novo" class="btn btn-neon">➕ Novo Produto</button>
                <button id="btn-exportar-csv" class="btn btn-secundario">📥 Exportar Total</button>
                <button id="btn-ver-lixeira" class="btn btn-secundario">👁️ Ver Lixeira</button>
                <button id="btn-limpar-lixeira" class="btn btn-danger" style="display: none;">🧹 Esvaziar Lixeira</button>
            </div>
            <!--/controles_superiores-->

            <!--barra_de_busca-->
            <div class="search-box">
                <span style="color: var(--text-muted);">🔍</span>
                <input type="text" id="input-busca" placeholder="Buscar por Nome, EAN ou Código...">
                <button type="button" onclick="abrirScanner()" title="Ler Código de Barras">📷</button>
            </div>
            <!--/barra_de_busca-->
            
            <div id="barra-acoes-lote" class="barra-acoes-lote">
                <strong style="color: var(--warning-color);" id="texto-contagem-lote">0 itens selecionados</strong>
                <button id="btn-ocultar-lote" class="btn btn-danger">🗑️ Ocultar Selecionados</button>
            </div>

            <div id="area-selecionar-todos" class="area-selecionar-todos">
                <input type="checkbox" id="chk-selecionar-todos" class="chk-item" style="margin-right: 15px;">
                <label for="chk-selecionar-todos" style="cursor: pointer; font-weight: bold; user-select: none;">Selecionar todos desta página</label>
            </div>

            <!--lista_dinamica-->
            <div id="lista-equipamentos">
                <p style="color: var(--text-muted); text-align: center;">⏳ Carregando sistema...</p>
            </div>
            <!--/lista_dinamica-->
            
            <div class="paginacao" id="area-paginacao" style="display: none;">
                <button id="btn-ant" class="btn btn-secundario">⬅️ Anterior</button>
                <strong id="texto-paginacao">Página 1</strong>
                <button id="btn-prox" class="btn btn-secundario">Próxima ➡️</button>
            </div>
        </div> 
    </div>

    <!-- Modal do Scanner -->
    <div id="scanner-modal">
        <h3 style="color: white; margin-bottom: 15px;">Aponte para o Código de Barras</h3>
        <div id="reader-admin"></div>
        <button class="btn btn-danger" style="margin-top: 20px; padding: 15px 30px;" onclick="fecharScanner()">Cancelar</button>
    </div>
    <!-- 1. IMPORTAÇÃO CENTRALIZADA DO BANCO DE DADOS -->
    <script src="supabase_config.js"></script>

    <script>
        /* ================= VARIÁVEIS GLOBAIS DE CONTROLO ================= */
        let html5QrCode = null; 
        let exibindoLixeira = false; 
        let paginaAtual = 0; 
        const ITENS_POR_PAGINA = 5;
        let timerBusca = null; 

        /* ================= ALTERNADOR DE TEMA ================= */
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            localStorage.setItem('temaBevDistro', isLight ? 'light' : 'dark');
        }

        /* ================= FUNÇÕES UTILITÁRIAS ================= */
        function mostrarToast(mensagem, tipo = 'sucesso') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${tipo}`;
            toast.textContent = mensagem;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('mostrar'), 10);
            setTimeout(() => {
                toast.classList.remove('mostrar');
                setTimeout(() => toast.remove(), 300); 
            }, 3000);
        }

        /* ================= LÓGICA DE BUSCA NO SERVIDOR ================= */
        async function buscarEquipamentos() {
            const textoBusca = document.getElementById('input-busca').value.trim();
            const indiceInicio = paginaAtual * ITENS_POR_PAGINA;
            const indiceFim = indiceInicio + ITENS_POR_PAGINA - 1;

            document.getElementById('lista-equipamentos').innerHTML = "<p style='text-align:center; color: var(--text-muted);'>⏳ Buscando dados no servidor...</p>";
            
            try {
                let query = clienteSupabase
                    .from('produtos')
                    .select('*', { count: 'exact' })
                    .eq('esta_ativo', true) 
                    .order('criado_em', { ascending: false })
                    .range(indiceInicio, indiceFim); 

                if (textoBusca) {
                    const termoLimpo = textoBusca.replace(/"/g, ''); 
                    query = query.or(`nome.ilike.%${termoLimpo}%,ean.ilike.%${termoLimpo}%,codigo_produto.ilike.%${termoLimpo}%`);
                }

                const { data, count, error } = await query;
                if (error) throw error;
                
                atualizarBotoesPaginacaoBanco(count);
                renderizarLista(data, false); 
            } catch (erro) {
                mostrarToast("Erro ao buscar dados do banco.", "erro");
                console.error(erro);
            }
        }

        async function buscarLixeira() {
            const textoBusca = document.getElementById('input-busca').value.trim();
            const indiceInicio = paginaAtual * ITENS_POR_PAGINA;
            const indiceFim = indiceInicio + ITENS_POR_PAGINA - 1;

            document.getElementById('lista-equipamentos').innerHTML = "<p style='text-align:center; color: var(--text-muted);'>⏳ Buscando lixeira no servidor...</p>";
            
            try {
                let query = clienteSupabase
                    .rpc('listar_lixeira_produtos_seguro', {}, { count: 'exact' })
                    .range(indiceInicio, indiceFim);

                if (textoBusca) { query = query.ilike('nome', `%${textoBusca}%`); }

                const { data, count, error } = await query;
                if (error) throw error;
                
                atualizarBotoesPaginacaoBanco(count);
                renderizarLista(data, true);
            } catch (erro) {
                mostrarToast("Erro ao buscar a lixeira.", "erro");
                console.error(erro);
            }
        }

        function atualizarBotoesPaginacaoBanco(totalItens) {
            const totalPaginas = Math.ceil(totalItens / ITENS_POR_PAGINA) || 1;
            document.getElementById('texto-paginacao').textContent = `Página ${paginaAtual + 1} de ${totalPaginas}`;
            document.getElementById('btn-ant').disabled = paginaAtual === 0;
            document.getElementById('btn-prox').disabled = (paginaAtual + 1) >= totalPaginas;
            document.getElementById('area-paginacao').style.display = totalItens > 0 ? "flex" : "none";
        }

        /* ================= LEITOR DE CÓDIGOS DE BARRAS ================= */
        function abrirScanner() {
            const modalScanner = document.getElementById('scanner-modal');
            modalScanner.style.display = 'flex';
            html5QrCode = new Html5Qrcode("reader-admin");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 100 } }, (codigo) => {
                document.getElementById('input-busca').value = codigo;
                fecharScanner();
                paginaAtual = 0; 
                exibindoLixeira ? buscarLixeira() : buscarEquipamentos();
            }).catch(err => {
                alert("Erro ao aceder à câmara."); fecharScanner();
            });
        }
        function fecharScanner() {
            if (html5QrCode) html5QrCode.stop().then(() => { document.getElementById('scanner-modal').style.display = 'none'; });
            else document.getElementById('scanner-modal').style.display = 'none';
        }

        /* ================= RENDERIZAÇÃO DA LISTA ================= */
        function renderizarLista(equipamentos, isLixeira) {
            const divLista = document.getElementById('lista-equipamentos');
            divLista.innerHTML = ""; 
            
            document.getElementById('barra-acoes-lote').style.display = 'none';
            document.getElementById('btn-limpar-lixeira').style.display = (isLixeira && equipamentos.length > 0) ? "inline-block" : "none";
            document.getElementById('area-selecionar-todos').style.display = (!isLixeira && equipamentos.length > 0) ? "flex" : "none";
            document.getElementById('chk-selecionar-todos').checked = false;

            if (!equipamentos || equipamentos.length === 0) {
                divLista.innerHTML = isLixeira ? "<p style='text-align:center; color: var(--text-muted);'>A lixeira está vazia.</p>" : "<p style='text-align:center; color: var(--text-muted);'>Nenhum resultado encontrado.</p>";
                return;
            }

            equipamentos.forEach((eq) => {
                const divItem = document.createElement('div');
                divItem.className = 'item-lista';

                if (!isLixeira) {
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox'; checkbox.className = 'chk-item'; checkbox.value = eq.id;
                    checkbox.addEventListener('change', atualizarBarraAcoesLote);
                    divItem.appendChild(checkbox);
                }

                const divConteudo = document.createElement('div');
                divConteudo.className = 'conteudo-item';

                const divTitulo = document.createElement('div');
                const titulo = document.createElement('span');
                titulo.className = 'item-titulo';
                titulo.textContent = eq.nome; 
                divTitulo.appendChild(titulo);

                if (eq.quantidade !== undefined && eq.quantidade !== null) {
                    const badgeEstoque = document.createElement('span');
                    badgeEstoque.className = 'badge-estoque';
                    badgeEstoque.textContent = `Qtd: ${eq.quantidade}`;
                    divTitulo.appendChild(badgeEstoque);
                }

                if (isLixeira) {
                    const badge = document.createElement('span');
                    badge.className = 'badge-lixeira'; badge.textContent = 'Na Lixeira';
                    divTitulo.appendChild(badge);
                }

                const precoText = document.createElement('span');
                precoText.className = 'item-preco';
                precoText.textContent = "R$ " + parseFloat(eq.preco || 0).toFixed(2).replace('.',',');
                divConteudo.appendChild(divTitulo);
                divConteudo.appendChild(precoText);
                
                if (eq.categoria !== undefined) {
                    const catText = document.createElement('span');
                    catText.className = 'item-categoria';
                    catText.textContent = eq.categoria || "Sem categoria";
                    divConteudo.appendChild(catText);
                }

                if (eq.foto_url) {
                    const img = document.createElement('img');
                    img.src = eq.foto_url; img.className = 'img-preview';
                    divConteudo.appendChild(img);
                }

                const divBotoes = document.createElement('div');
                divBotoes.className = 'botoes-acao';
                
                if (isLixeira) {
                    const btnRestaurar = document.createElement('button');
                    btnRestaurar.innerHTML = "♻️ Restaurar"; btnRestaurar.className = "btn btn-secundario";
                    btnRestaurar.onclick = () => restaurarEquipamento(eq.id);
                    divBotoes.appendChild(btnRestaurar);
                } else {
                    const btnEditar = document.createElement('button');
                    btnEditar.textContent = "✏️ Editar"; btnEditar.className = "btn btn-warning";
                    btnEditar.onclick = () => { window.location.href = 'cadastra.html?id=' + eq.id; }; 
                    
                    const btnExcluir = document.createElement('button');
                    btnExcluir.textContent = "🗑️ Ocultar"; btnExcluir.className = "btn btn-danger";
                    btnExcluir.onclick = () => excluirEquipamento(eq.id); 
                    
                    divBotoes.appendChild(btnEditar); divBotoes.appendChild(btnExcluir);
                }

                divConteudo.appendChild(divBotoes);
                divItem.appendChild(divConteudo);
                divLista.appendChild(divItem);
            });
        }

        /* ================= AÇÕES COM O BANCO DE DADOS ================= */
        document.getElementById('btn-ocultar-lote').addEventListener('click', async () => {
            const chks = document.querySelectorAll('.chk-item:checked');
            const ids = Array.from(chks).map(chk => chk.value);
            if (ids.length === 0 || !confirm(`Deseja ocultar ${ids.length} itens?`)) return;

            try {
                const { error } = await clienteSupabase.rpc('ocultar_multiplos_produtos_seguro', { p_ids: ids });
                if (error) throw error;
                mostrarToast("Produtos ocultados em lote com sucesso!");
                document.getElementById('chk-selecionar-todos').checked = false;
                buscarEquipamentos(); 
            } catch (erro) { mostrarToast("Erro ao ocultar em lote.", "erro"); }
        });

        async function excluirEquipamento(id) {
            if (!confirm("Deseja enviar este produto para a lixeira?")) return; 
            try {
                const { error } = await clienteSupabase.rpc('desativar_produto_seguro', { p_id: id });
                if (error) throw error;
                mostrarToast("Produto ocultado."); buscarEquipamentos(); 
            } catch (erro) { mostrarToast("Erro ao ocultar.", "erro"); }
        }

        async function restaurarEquipamento(id) {
            if (!confirm("Deseja restaurar este produto?")) return; 
            try {
                const { error } = await clienteSupabase.rpc('restaurar_produto_seguro', { p_id: id });
                if (error) throw error;
                mostrarToast("Produto restaurado!"); buscarLixeira(); 
            } catch (erro) { mostrarToast("Erro ao restaurar.", "erro"); }
        }

        async function esvaziarLixeira() {
            if (!confirm("Isso apagará permanentemente arquivos e dados do banco. Continuar?")) return;
            try {
                const { data: fotosApagadas, error: erroBanco } = await clienteSupabase.rpc('limpar_lixeira_produtos_seguro');
                if (erroBanco) throw erroBanco;
                
                if (fotosApagadas && fotosApagadas.length > 0) {
                    for (const item of fotosApagadas) {
                        if (item.url_da_foto) {
                            const nome = decodeURIComponent(item.url_da_foto.split('/').pop().split('?')[0]);
                            await clienteSupabase.storage.from('equipamentos_fotos').remove([nome]);
                        }
                    }
                }
                mostrarToast("Lixeira limpa definitivamente.");
                exibindoLixeira ? buscarLixeira() : buscarEquipamentos(); 
            } catch (erro) { mostrarToast("Erro ao limpar lixeira.", "erro"); }
        }

        /* ================= EVENTOS DE INTERFACE E EXPORTAÇÃO ================= */
        document.getElementById('btn-ant').addEventListener('click', () => { if (paginaAtual > 0) { paginaAtual--; exibindoLixeira ? buscarLixeira() : buscarEquipamentos(); } });
        document.getElementById('btn-prox').addEventListener('click', () => { paginaAtual++; exibindoLixeira ? buscarLixeira() : buscarEquipamentos(); });
        document.getElementById('input-busca').addEventListener('input', () => { clearTimeout(timerBusca); timerBusca = setTimeout(() => { paginaAtual = 0; exibindoLixeira ? buscarLixeira() : buscarEquipamentos(); }, 500); });
        
        document.getElementById('chk-selecionar-todos').addEventListener('change', (e) => {
            document.querySelectorAll('.chk-item').forEach(chk => chk.checked = e.target.checked);
            atualizarBarraAcoesLote();
        });

        function atualizarBarraAcoesLote() {
            const checkboxes = document.querySelectorAll('.chk-item:checked');
            const barraAcoes = document.getElementById('barra-acoes-lote');
            if (checkboxes.length > 0 && !exibindoLixeira) {
                barraAcoes.style.display = 'flex';
                document.getElementById('texto-contagem-lote').textContent = `${checkboxes.length} item(ns) selecionado(s)`;
            } else { barraAcoes.style.display = 'none'; }
        }

        document.getElementById('btn-novo').addEventListener('click', () => window.location.href = 'cadastra.html');
        document.getElementById('btn-limpar-lixeira').addEventListener('click', esvaziarLixeira);
        
        document.getElementById('btn-ver-lixeira').addEventListener('click', () => {
            exibindoLixeira = !exibindoLixeira;
            document.getElementById('input-busca').value = ""; paginaAtual = 0; 
            
            const btn = document.getElementById('btn-ver-lixeira');
            const titulo = document.getElementById('titulo-painel');
            const btnNovo = document.getElementById('btn-novo');
            const btnScan = document.querySelector('.search-box button'); 

            if(exibindoLixeira) {
                btn.textContent = "📦 Ver Ativos"; btn.classList.replace('btn-secundario', 'btn-neon');
                titulo.textContent = "Lixeira de Produtos 🗑️";
                btnNovo.style.display = "none"; btnScan.style.display = "none"; 
                buscarLixeira();
            } else {
                btn.textContent = "👁️ Ver Lixeira"; btn.classList.replace('btn-neon', 'btn-secundario');
                titulo.textContent = "Lista de Produtos 📦";
                btnNovo.style.display = "inline-block"; btnScan.style.display = "block";
                buscarEquipamentos();
            }
        });

        document.getElementById('btn-exportar-csv').addEventListener('click', async () => {
            mostrarToast("Preparando exportação total, aguarde...", "sucesso");
            try {
                let dadosExportacao = [];
                if (exibindoLixeira) {
                    const { data, error } = await clienteSupabase.rpc('listar_lixeira_produtos_seguro');
                    if (error) throw error; dadosExportacao = data;
                } else {
                    const { data, error } = await clienteSupabase.from('produtos').select('*').eq('esta_ativo', true);
                    if (error) throw error; dadosExportacao = data;
                }

                if (!dadosExportacao || dadosExportacao.length === 0) { mostrarToast("Não há dados para exportar.", "erro"); return; }
                
                let csv = "ID,Nome,Preço Venda,Estoque,Categoria,Status,Data de Registro\n";
                const statusLabel = exibindoLixeira ? "Inativo (Lixeira)" : "Ativo";
                
                dadosExportacao.forEach(eq => {
                    const nomeLimpo = (eq.nome || "Sem Nome").replace(/"/g, '""'); 
                    const preco = parseFloat(eq.preco || 0).toFixed(2);
                    const estoque = eq.quantidade || 0;
                    const categoria = eq.categoria || 'Geral';
                    csv += `"${eq.id}","${nomeLimpo}",${preco},${estoque},"${categoria}","${statusLabel}","${eq.criado_em}"\n`;
                });

                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.setAttribute("href", URL.createObjectURL(blob));
                link.setAttribute("download", `relatorio_${Date.now()}.csv`);
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
                mostrarToast("Download concluído!");
            } catch (erro) { mostrarToast("Erro ao gerar o CSV.", "erro"); }
        });

        document.getElementById('btn-sair').addEventListener('click', async () => {
            if (typeof clienteSupabase !== 'undefined') await clienteSupabase.auth.signOut();
            window.location.href = 'login.html';
        });

        /* ================= INICIALIZAÇÃO DA PÁGINA ================= */
        document.addEventListener('DOMContentLoaded', async () => {
            if(localStorage.getItem('temaBevDistro') === 'light') document.body.classList.add('light-theme');

            const statusDiv = document.getElementById('status');
            const appDiv = document.getElementById('app');
            
            if (typeof clienteSupabase === 'undefined') {
                statusDiv.textContent = "❌ Erro: supabase_config.js não encontrado.";
                statusDiv.className = "info erro"; return;
            }

            try {
                const { data: { session }, error } = await clienteSupabase.auth.getSession();
                if (error || !session) return window.location.href = 'login.html';
                
                statusDiv.style.display = "none";
                appDiv.style.display = "block";
                document.getElementById('btn-sair').style.display = "block";
                
                buscarEquipamentos();
            } catch (error) {
                mostrarToast("Erro ao validar sessão.", "erro");
                setTimeout(() => window.location.href = 'login.html', 2000);
            }
        });
    </script>
</body>
</html>
