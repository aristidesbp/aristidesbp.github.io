<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - Lista de Produtos</title>
    
    <!-- 1º CARREGA A BIBLIOTECA DO SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 2º CARREGA AS SUAS CHAVES -->
    <script src="supabase_config.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; margin: 0; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; max-width: 1200px; margin: 0 auto;}
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em; font-weight: bold;}
        button:hover { opacity: 0.8; }
        
        .btn-sucesso { background: #28a745; }
        .btn-perigo { background: #dc3545; }
        .btn-editar { background: #ffc107; color: #212529; }
        .btn-alerta { background: #fd7e14; }
        .btn-secundario { background: #6c757d; }
        .btn-restaurar { background: #20c997; }
        
        .input-busca { width: 100%; padding: 12px; margin-top: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 1em; }
        .barra-acoes-lote { background-color: #fff3cd; padding: 10px; border-radius: 5px; margin-top: 15px; display: none; align-items: center; justify-content: space-between; border: 1px solid #ffeeba;}
        .chk-item { transform: scale(1.5); margin-right: 15px; cursor: pointer; }
        
        .item-lista { padding: 15px; border-bottom: 1px solid #eee; display: flex; flex-direction: row; gap: 15px; align-items: center;}
        .conteudo-item { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .img-preview { max-width: 120px; border-radius: 8px; margin-top: 5px; border: 1px solid #ccc; }
        .cabecalho-painel { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
        .grupo-botoes-topo { display: flex; gap: 10px; flex-wrap: wrap;}
        .badge-lixeira { background: #dc3545; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.8em;}
        .badge-estoque { background: #17a2b8; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.8em; margin-left: 10px;}
        
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 15px 20px; border-radius: 5px; color: white; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.2); opacity: 0; transform: translateX(100%); transition: all 0.3s ease; }
        .toast.mostrar { opacity: 1; transform: translateX(0); }
        .toast-sucesso { background-color: #28a745; }
        .toast-erro { background-color: #dc3545; }

        .paginacao { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; }
        .paginacao button:disabled { background: #ccc; cursor: not-allowed; }
        
        .area-selecionar-todos { padding: 10px 15px; background: #e9ecef; border-radius: 5px; margin-bottom: 15px; display: none; align-items: center; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div id="toast-container"></div>

    <div style="display: flex; gap: 10px; margin-bottom: 20px; max-width: 1200px; margin-left: auto; margin-right: auto; padding-top: 20px;">
        <div id="status" class="info" style="flex-grow: 1; padding: 10px; border-radius: 5px; font-weight: bold; margin-bottom: 0;">Autenticando sessão ERP...</div>
        <button id="btn-sair" class="btn-perigo" style="display: none;">Sair do Sistema</button>
    </div>

    <div id="app" class="card" style="display: none;">
        <div class="cabecalho-painel">
            <h2 id="titulo-painel">Lista de Produtos 📦</h2>
            
            <div class="grupo-botoes-topo">
                <button id="btn-exportar-csv" class="btn-secundario" style="background-color: #17a2b8;">📥 Exportar CSV</button>
                <button id="btn-ver-lixeira" class="btn-secundario">👁️ Ver Lixeira</button>
                <button id="btn-limpar-lixeira" class="btn-alerta" style="display: none;">🧹 Esvaziar Lixeira</button>
                <button id="btn-novo" class="btn-sucesso">➕ Novo Produto</button>
            </div>
        </div>

        <input type="text" id="input-busca" class="input-busca" placeholder="🔍 Buscar produto pelo nome...">
        
        <div id="barra-acoes-lote" class="barra-acoes-lote">
            <strong style="color: #856404;" id="texto-contagem-lote">0 itens selecionados</strong>
            <button id="btn-ocultar-lote" class="btn-perigo">🗑️ Ocultar Selecionados</button>
        </div>

        <hr />
        
        <div id="area-selecionar-todos" class="area-selecionar-todos">
            <input type="checkbox" id="chk-selecionar-todos" style="transform: scale(1.5); margin-right: 15px; cursor: pointer;">
            <label for="chk-selecionar-todos" style="cursor: pointer; font-weight: bold; color: #333; user-select: none;">Selecionar todos os itens desta página</label>
        </div>

        <div id="lista-equipamentos">
            <p>⏳ Carregando sistema...</p>
        </div>
        
        <div class="paginacao" id="area-paginacao" style="display: none;">
            <button id="btn-ant">⬅️ Anterior</button>
            <strong id="texto-paginacao">Página 1</strong>
            <button id="btn-prox">Próxima ➡️</button>
        </div>
    </div> 

    <script>
        let exibindoLixeira = false; 
        let dadosGlobaisNaMemoria = []; 
        let paginaAtual = 1;
        const ITENS_POR_PAGINA = 5;

        function mostrarToast(mensagem, tipo = 'sucesso') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${tipo}`;
            toast.textContent = mensagem;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('mostrar'), 10);
            setTimeout(() => {
                toast.classList.remove('mostrar');
                setTimeout(() => toast.remove(), 300); 
            }, 3000);
        }

        async function buscarEquipamentos() {
            document.getElementById('lista-equipamentos').textContent = "Buscando dados no Supabase...";
            try {
                const { data, error } = await clienteSupabase
                    .from('produtos')
                    .select('*')
                    .eq('esta_ativo', true) 
                    .order('criado_em', { ascending: false });

                if (error) throw error;
                dadosGlobaisNaMemoria = data; 
                paginaAtual = 1; 
                atualizarTela(); 
            } catch (erro) {
                mostrarToast("Erro ao buscar dados do banco.", "erro");
                console.error(erro);
            }
        }

        async function buscarLixeira() {
            document.getElementById('lista-equipamentos').textContent = "Buscando itens na lixeira...";
            try {
                const { data, error } = await clienteSupabase.rpc('listar_lixeira_produtos_seguro');
                if (error) throw error;
                dadosGlobaisNaMemoria = data; 
                paginaAtual = 1;
                atualizarTela();
            } catch (erro) {
                mostrarToast("Erro ao buscar a lixeira.", "erro");
                console.error(erro);
            }
        }

        document.getElementById('input-busca').addEventListener('input', () => {
            paginaAtual = 1; 
            atualizarTela();
        });

        function atualizarTela() {
            const textoBusca = document.getElementById('input-busca').value.toLowerCase();
            const listaFiltrada = dadosGlobaisNaMemoria.filter((eq) => {
                return eq.nome.toLowerCase().includes(textoBusca);
            });

            const totalPaginas = Math.ceil(listaFiltrada.length / ITENS_POR_PAGINA) || 1;
            document.getElementById('texto-paginacao').textContent = `Página ${paginaAtual} de ${totalPaginas}`;
            document.getElementById('btn-ant').disabled = paginaAtual === 1;
            document.getElementById('btn-prox').disabled = paginaAtual === totalPaginas;
            document.getElementById('area-paginacao').style.display = listaFiltrada.length > 0 ? "flex" : "none";

            const indiceInicio = (paginaAtual - 1) * ITENS_POR_PAGINA;
            const indiceFim = indiceInicio + ITENS_POR_PAGINA;
            const dadosPaginados = listaFiltrada.slice(indiceInicio, indiceFim);

            renderizarLista(dadosPaginados, exibindoLixeira);
        }

        document.getElementById('btn-ant').addEventListener('click', () => {
            if (paginaAtual > 1) { paginaAtual--; atualizarTela(); }
        });
        
        document.getElementById('btn-prox').addEventListener('click', () => {
            paginaAtual++; atualizarTela();
        });

        document.getElementById('chk-selecionar-todos').addEventListener('change', (e) => {
            const checkboxes = document.querySelectorAll('.chk-item');
            checkboxes.forEach(chk => chk.checked = e.target.checked);
            atualizarBarraAcoesLote();
        });

        document.getElementById('btn-exportar-csv').addEventListener('click', () => {
            if (dadosGlobaisNaMemoria.length === 0) {
                mostrarToast("Não há dados para exportar.", "erro");
                return;
            }
            let csv = "ID,Nome,Preço Venda,Estoque,Categoria,Status,Data de Registro\n";
            const statusLabel = exibindoLixeira ? "Inativo (Lixeira)" : "Ativo";
            dadosGlobaisNaMemoria.forEach(eq => {
                const nomeLimpo = eq.nome.replace(/"/g, '""'); 
                const precoFormatado = parseFloat(eq.preco || 0).toFixed(2);
                const estoque = eq.quantidade || 0;
                const categoria = eq.categoria || 'Geral';
                csv += `"${eq.id}","${nomeLimpo}",${precoFormatado},${estoque},"${categoria}","${statusLabel}","${eq.criado_em}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `relatorio_produtos_${Date.now()}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            mostrarToast("Download do relatório concluído!");
        });

        function atualizarBarraAcoesLote() {
            const checkboxes = document.querySelectorAll('.chk-item:checked');
            const barraAcoes = document.getElementById('barra-acoes-lote');
            if (checkboxes.length > 0 && !exibindoLixeira) {
                barraAcoes.style.display = 'flex';
                document.getElementById('texto-contagem-lote').textContent = `${checkboxes.length} item(ns) selecionado(s)`;
            } else {
                barraAcoes.style.display = 'none';
            }
        }

        function renderizarLista(equipamentos, isLixeira) {
            const divLista = document.getElementById('lista-equipamentos');
            divLista.innerHTML = ""; 
            
            document.getElementById('barra-acoes-lote').style.display = 'none';
            document.getElementById('btn-limpar-lixeira').style.display = (isLixeira && equipamentos.length > 0) ? "inline-block" : "none";
            document.getElementById('area-selecionar-todos').style.display = (!isLixeira && equipamentos.length > 0) ? "flex" : "none";
            document.getElementById('chk-selecionar-todos').checked = false;

            if (equipamentos.length === 0) {
                divLista.textContent = isLixeira ? "A lixeira está vazia." : "Nenhum resultado encontrado.";
                return;
            }

            equipamentos.forEach((eq) => {
                const divItem = document.createElement('div');
                divItem.className = 'item-lista';

                if (!isLixeira) {
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'chk-item';
                    checkbox.value = eq.id;
                    checkbox.addEventListener('change', atualizarBarraAcoesLote);
                    divItem.appendChild(checkbox);
                }

                const divConteudo = document.createElement('div');
                divConteudo.className = 'conteudo-item';

                const divTitulo = document.createElement('div');
                const titulo = document.createElement('strong');
                titulo.textContent = eq.nome; 
                divTitulo.appendChild(titulo);

                if(eq.quantidade !== undefined) {
                    const badgeEstoque = document.createElement('span');
                    badgeEstoque.className = 'badge-estoque';
                    badgeEstoque.textContent = `Estoque: ${eq.quantidade}`;
                    divTitulo.appendChild(badgeEstoque);
                }

                if (isLixeira) {
                    const badge = document.createElement('span');
                    badge.className = 'badge-lixeira';
                    badge.textContent = ' NA LIXEIRA';
                    badge.style.marginLeft = '10px';
                    divTitulo.appendChild(badge);
                }

                const precoText = document.createElement('span');
                precoText.textContent = "Preço de Venda: R$ " + parseFloat(eq.preco || 0).toFixed(2);
                
                const catText = document.createElement('span');
                catText.style.fontSize = "0.85em";
                catText.style.color = "#666";
                catText.textContent = "Categoria: " + (eq.categoria || "Não definida");

                divConteudo.appendChild(divTitulo);
                divConteudo.appendChild(precoText);
                divConteudo.appendChild(catText);

                if (eq.foto_url) {
                    const img = document.createElement('img');
                    img.src = eq.foto_url;
                    img.className = 'img-preview';
                    divConteudo.appendChild(img);
                }

                const divBotoes = document.createElement('div');
                divBotoes.style.display = 'flex';
                divBotoes.style.gap = '10px';
                
                if (isLixeira) {
                    const btnRestaurar = document.createElement('button');
                    btnRestaurar.innerHTML = "♻️ Restaurar";
                    btnRestaurar.className = "btn-restaurar";
                    btnRestaurar.onclick = () => restaurarEquipamento(eq.id);
                    divBotoes.appendChild(btnRestaurar);
                } else {
                    const btnEditar = document.createElement('button');
                    btnEditar.textContent = "✏️ Editar";
                    btnEditar.className = "btn-editar";
                    btnEditar.onclick = () => { window.location.href = 'cadastra.html?id=' + eq.id; }; 
                    
                    const btnExcluir = document.createElement('button');
                    btnExcluir.textContent = "🗑️ Ocultar";
                    btnExcluir.className = "btn-perigo";
                    btnExcluir.onclick = () => excluirEquipamento(eq.id); 
                    
                    divBotoes.appendChild(btnEditar);
                    divBotoes.appendChild(btnExcluir);
                }

                divConteudo.appendChild(divBotoes);
                divItem.appendChild(divConteudo);
                divLista.appendChild(divItem);
            });
        }

        document.getElementById('btn-ocultar-lote').addEventListener('click', async () => {
            const chks = document.querySelectorAll('.chk-item:checked');
            const ids = Array.from(chks).map(chk => chk.value);
            if (ids.length === 0 || !confirm(`Deseja ocultar ${ids.length} itens?`)) return;

            try {
                const { error } = await clienteSupabase.rpc('ocultar_multiplos_produtos_seguro', { p_ids: ids });
                if (error) throw error;
                mostrarToast("Produtos ocultados em lote com sucesso!");
                document.getElementById('input-busca').value = ""; 
                buscarEquipamentos(); 
            } catch (erro) {
                mostrarToast("Erro ao ocultar em lote.", "erro");
            }
        });

        async function excluirEquipamento(id) {
            if (!confirm("Deseja enviar este produto para a lixeira?")) return; 
            try {
                const { error } = await clienteSupabase.rpc('desativar_produto_seguro', { p_id: id });
                if (error) throw error;
                mostrarToast("Produto ocultado.");
                buscarEquipamentos(); 
            } catch (erro) {
                mostrarToast("Erro ao ocultar.", "erro");
            }
        }

        async function restaurarEquipamento(id) {
            if (!confirm("Deseja restaurar este produto?")) return; 
            try {
                const { error } = await clienteSupabase.rpc('restaurar_produto_seguro', { p_id: id });
                if (error) throw error;
                mostrarToast("Produto restaurado!");
                buscarLixeira(); 
            } catch (erro) {
                mostrarToast("Erro ao restaurar.", "erro");
            }
        }

        async function esvaziarLixeira() {
            if (!confirm("Isso apagará permanentemente arquivos e dados do banco. Continuar?")) return;
            try {
                const { data: fotosApagadas, error: erroBanco } = await clienteSupabase.rpc('limpar_lixeira_produtos_seguro');
                if (erroBanco) throw erroBanco;
                if (fotosApagadas && fotosApagadas.length > 0) {
                    for (const item of fotosApagadas) {
                        if (item.url_da_foto) {
                            const nome = decodeURIComponent(item.url_da_foto.split('/').pop().split('?')[0]);
                            await clienteSupabase.storage.from('equipamentos_fotos').remove([nome]);
                        }
                    }
                }
                mostrarToast("Lixeira limpa definitivamente.");
                exibindoLixeira ? buscarLixeira() : buscarEquipamentos(); 
            } catch (erro) {
                mostrarToast("Erro ao limpar lixeira.", "erro");
            }
        }

        document.getElementById('btn-novo').addEventListener('click', () => window.location.href = 'cadastra.html');
        document.getElementById('btn-limpar-lixeira').addEventListener('click', esvaziarLixeira);
        
        document.getElementById('btn-ver-lixeira').addEventListener('click', () => {
            exibindoLixeira = !exibindoLixeira;
            document.getElementById('input-busca').value = ""; 
            const btn = document.getElementById('btn-ver-lixeira');
            const titulo = document.getElementById('titulo-painel');
            const btnNovo = document.getElementById('btn-novo');

            if(exibindoLixeira) {
                btn.textContent = "📦 Ver Ativos";
                btn.style.backgroundColor = "#007bff";
                btn.style.color = "white";
                titulo.textContent = "Lixeira de Produtos 🗑️";
                btnNovo.style.display = "none";
                buscarLixeira();
            } else {
                btn.textContent = "👁️ Ver Lixeira";
                btn.style.backgroundColor = "#6c757d";
                titulo.textContent = "Lista de Produtos 📦";
                btnNovo.style.display = "inline-block";
                buscarEquipamentos();
            }
        });

        document.getElementById('btn-sair').addEventListener('click', async () => {
            await clienteSupabase.auth.signOut();
            window.location.href = 'login.html';
        });

        window.onload = async () => {
            const statusDiv = document.getElementById('status');
            const appDiv = document.getElementById('app');
            try {
                // VERIFICAÇÃO DE SESSÃO DIRETA (Sem IndexedDB)
                const { data: { session } } = await clienteSupabase.auth.getSession();
                
                if (!session) {
                    alert("Acesso Negado: Faça login no ERP para continuar.");
                    return window.location.href = 'login.html';
                }
                
                statusDiv.textContent = `Logado de forma segura como: ${session.user.email}`;
                statusDiv.style.backgroundColor = "transparent";
                statusDiv.style.color = "#666";
                appDiv.style.display = "block";
                document.getElementById('btn-sair').style.display = "block";
                
                buscarEquipamentos();
            } catch (error) {
                mostrarToast("Erro de segurança no login.", "erro");
            }
        };
    </script>
</body>
</html>
