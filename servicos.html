            last = Date.now(); inp.value = ""; bolha(t, "u"); hist.push({ role: "user", content: t }); busy = true;
            var w = bolha("…", "a");
            fetch(CFG.iaEndpoint, { method: "POST", headers: hdr({ "Content-Type": "application/json" }), body: JSON.stringify({ sessao: ses, mensagens: hist.slice(-12) }) })
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    var tx = String(d.texto || "Não consegui responder agora.").slice(0, 800);
                    w.textContent = tx; hist.push({ role: "assistant", content: tx });
                    if (d.pedido_fechado) {
                        var ped = d.pedido_fechado;
                        var it = (ped.itens || []).map(function (i) { return i.id + "x" + i.qtd; }).join(";");
                        var h = hashPedido(ped.id + "|" + it, "");
                        var msg = "*🛒 PEDIDO (IA) - " + (CFG.nomeLoja || "LOJA").toUpperCase() + "*\n*CÓDIGO:* #" + ped.id + "\n*Total: R$ " + Number(ped.total).toFixed(2).replace(".", ",") + "*\n\n🔐 *PED-IA:* " + ped.id + "|" + it + "|" + h;
                        var num = String(CFG.whatsapp || "").replace(/\D/g, "");
                        var a = document.createElement("button");
                        a.textContent = "✅ Confirmar e enviar no WhatsApp";
                        a.style.cssText = "margin-top:4px;align-self:flex-start;background:#25d366;color:#fff;border:0;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;cursor:pointer";
                        a.onclick = function () { if (!num) return alert("WhatsApp da loja não configurado."); window.open("https://wa.me/" + num + "?text=" + encodeURIComponent(msg), "_blank", "noopener,noreferrer"); };
                        document.getElementById("eia-m").appendChild(a);
                    }
                })
                .catch(function () { w.textContent = "Assistente indisponível agora. Fale com a gente pelo WhatsApp 😊"; })
                .then(function () { busy = false; });
        }
        document.getElementById("eia-s").onclick = enviar;
        document.getElementById("eia-in").onkeydown = function (e) { if (e.key === "Enter") enviar(); };
    })();</script>
