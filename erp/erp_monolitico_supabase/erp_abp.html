<style id="custom-styles">
    .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; display:inline-block; vertical-align:middle; }
    .status-ativo { background:#ecfdf5; color:#059669; padding:4px 12px; border-radius:9999px; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; border:1px solid #d1fae5; }
    .dark .status-ativo { background:rgba(16,185,129,.1); color:#34d399; border-color:rgba(16,185,129,.2); }
    .status-inativo { background:#fef2f2; color:#dc2626; padding:4px 12px; border-radius:9999px; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; border:1px solid #fee2e2; }
    .dark .status-inativo { background:rgba(239,68,68,.1); color:#f87171; border-color:rgba(239,68,68,.2); }
    .drop-zone { border:2px dashed #E5E7EB; border-radius:12px; padding:32px; text-align:center; cursor:pointer; transition:all .3s cubic-bezier(.4,0,.2,1); background-color:#f9fafb; }
    .dark .drop-zone { background-color:#1e293b; border-color:#334155; }
    .drop-zone:hover { background-color:#f3f4f6; border-color:#006c45; }
    .dark .drop-zone:hover { background-color:#334155; border-color:#3ecf8e; }
    .drop-zone.dragover { border-color:#006c45; background-color:#ecfdf5; transform:scale(1.02); }
    .dark .drop-zone.dragover { border-color:#3ecf8e; background-color:rgba(62,207,142,.1); }
    .no-scrollbar::-webkit-scrollbar { display:none; }
    .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
    /* ── Financeiro ────────────────────────────── */
    .card { background:white; padding:20px; border-radius:12px; box-shadow:0 4px 6px rgba(0,0,0,.05); }
    .dark .card { background:#1e293b; }
    .status-pago      { background:#d1fae5; color:#065f46; padding:4px 8px; border-radius:6px; font-weight:bold; font-size:12px; }
    .status-pendente  { background:#fef3c7; color:#92400e; padding:4px 8px; border-radius:6px; font-weight:bold; font-size:12px; }
    .status-atrasado  { background:#fee2e2; color:#991b1b; padding:4px 8px; border-radius:6px; font-weight:bold; font-size:12px; animation:pulse 2s infinite; }
    .highlight-parcelas { border:2px solid #3b82f6 !important; background-color:#eff6ff !important; box-shadow:0 0 10px rgba(59,130,246,.2); }
    .highlight-label    { color:#1d4ed8; font-weight:900; }
    /* ── PDV ───────────────────────────────────── */
    .status-receita { background:#d1fae5; color:#065f46; padding:4px 8px; border-radius:6px; font-weight:bold; font-size:12px; }
    .status-despesa { background:#fee2e2; color:#991b1b; padding:4px 8px; border-radius:6px; font-weight:bold; font-size:12px; }
    /* Inputs internos aos módulos fin/pdv (scoped para não sobrescrever o resto) */
    #aba-financeiro input[type="text"],#aba-financeiro input[type="number"],
    #aba-financeiro input[type="date"],#aba-financeiro select,
    #aba-pdv input[type="text"],#aba-pdv input[type="number"],
    #aba-pdv input[type="date"],#aba-pdv select,#aba-pdv textarea {
        width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; font-size:14px;
    }
    #aba-financeiro input[type="checkbox"],#aba-pdv input[type="checkbox"] { width:auto; transform:scale(1.2); cursor:pointer; }
    .dark #aba-financeiro input, .dark #aba-financeiro select,
    .dark #aba-pdv input, .dark #aba-pdv select { background:#1e293b; border-color:#334155; color:#e2e8f0; }
    .fade-in { animation:fadeIn .4s cubic-bezier(.4,0,.2,1) forwards; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .glass-card { background:rgba(255,255,255,.8); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.3); }
    .dark .glass-card { background:rgba(30,41,59,.8); border-color:rgba(255,255,255,.1); }
    #mobile-overlay { transition:opacity .3s ease; }
    aside { transition:transform .3s ease-in-out; }
</style>
