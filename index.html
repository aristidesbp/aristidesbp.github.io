/**
 * Recebe um ficheiro de imagem, redimensiona-o e converte para WebP de alta eficiência.
 * @param {File} file - O ficheiro de imagem original.
 * @param {number} maxWidthHeight - A medida máxima permitida (Padrão: 800px).
 * @returns {Promise<File>} - Uma Promise que devolve o ficheiro comprimido.
 */
function comprimirParaWebP(file, maxWidthHeight = 800) {
    return new Promise((resolve, reject) => {
        if (!file) {
            reject(new Error("Nenhum ficheiro fornecido para compressão."));
            return;
        }

        // 1. Lemos o ficheiro original
        const reader = new FileReader();
        reader.readAsDataURL(file);
        
        reader.onload = (event) => {
            // 2. Criamos uma imagem virtual para ler as dimensões reais
            const img = new Image();
            img.src = event.target.result;
            
            img.onload = () => {
                // 3. Lógica para recalcular as proporções sem distorcer a foto
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > maxWidthHeight) {
                        height = Math.round(height * (maxWidthHeight / width));
                        width = maxWidthHeight;
                    }
                } else {
                    if (height > maxWidthHeight) {
                        width = Math.round(width * (maxWidthHeight / height));
                        height = maxWidthHeight;
                    }
                }

                // 4. Utilizamos o Canvas HTML5 para redesenhar a imagem menor
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                // 5. Convertemos a tela para o formato final (.webp a 80%)
                canvas.toBlob((blob) => {
                    if (blob) {
                        // Limpamos a extensão antiga e forçamos a extensão .webp
                        const novoNome = file.name.replace(/\.[^/.]+$/, ".webp");
                        const ficheiroComprimido = new File([blob], novoNome, { type: 'image/webp' });
                        resolve(ficheiroComprimido);
                    } else {
                        reject(new Error("Falha técnica ao converter a imagem."));
                    }
                }, 'image/webp', 0.8);
            };
            
            img.onerror = () => reject(new Error("Ficheiro corrompido ou formato não suportado."));
        };
        
        reader.onerror = () => reject(new Error("Ocorreu um erro na leitura do dispositivo."));
    });
}

/**
 * Função de apoio: Cria nomes padronizados para enviar para o Supabase (remove acentos e espaços).
 */
function gerarNomeSeguroArquivo(prefixo) {
    let nomeLimpo = prefixo.normalize('NFD').replace(/[\u0300-\u036f]/g, "").toLowerCase();
    nomeLimpo = nomeLimpo.replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
    return `${nomeLimpo}-${Date.now()}.webp`;
}

/**
 * Liga a câmara do dispositivo, exibe o modal e aguarda a leitura.
 * @param {Function} callback - Função que será executada recebendo o código lido como parâmetro.
 */
function abrirScannerGlobal(callback) {
    scannerCallbackDestino = callback; // Guardamos a instrução do que fazer após a leitura
    const modal = document.getElementById('modal-scanner-global');
    modal.style.display = 'flex';

    // Cria a instância do scanner apenas se ela não existir
    if (!scannerGlobalInstancia) {
        scannerGlobalInstancia = new Html5Qrcode("leitor-scanner-global");
    }

    // Inicia o fluxo de vídeo forçando a câmara traseira ("environment")
    scannerGlobalInstancia.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 100 } },
        (codigoLido) => {
            // SUCESSO: Desliga a câmara primeiro, depois envia o dado para o módulo que o pediu
            fecharScannerGlobal(); 
            if (scannerCallbackDestino) {
                scannerCallbackDestino(codigoLido); 
            }
        },
        (erroDeOcultacao) => {
            // Ignoramos frames não lidos para não poluir a consola do Termux
        }
    ).catch((err) => {
        alert("Falha de Hardware: Verifique se permitiu o uso da câmara no navegador.");
        fecharScannerGlobal();
    });
}

/**
 * Interrompe o processo de leitura, limpa a memória da câmara e oculta a janela.
 */
function fecharScannerGlobal() {
    const modal = document.getElementById('modal-scanner-global');
    if (scannerGlobalInstancia) {
        scannerGlobalInstancia.stop().then(() => {
            modal.style.display = 'none';
        }).catch(() => {
            modal.style.display = 'none'; // Oculta mesmo se a paragem atirar um erro (fallback)
        });
    } else {
        modal.style.display = 'none';
    }
}

                <p style="text-align:center; color: var(--text-muted);">⏳ A carregar registos...</p>
            </div>
            
            <div id="ent-paginacao" style="display: none; justify-content: center; align-items: center; gap: 15px; margin-top: 20px;">
                <button id="btn-ent-ant" class="btn-secundario" style="width: auto;">⬅️ Anterior</button>
                <strong id="texto-ent-paginacao" style="color: var(--text-main);">Página 1</strong>
                <button id="btn-ent-prox" class="btn-secundario" style="width: auto;">Próxima ➡️</button>
            </div>
        </div>
    `;

    document.getElementById('btn-nova-entidade').addEventListener('click', () => desenharModuloEntidadesCadastro());

    let timerBusca;
    const dispararBusca = () => {
        clearTimeout(timerBusca);
        paginaAtualEnt = 0; 
        timerBusca = setTimeout(() => carregarListaEntidades(), 400);
    };

    document.getElementById('ent-busca').addEventListener('input', dispararBusca);
    document.getElementById('ent-filtro-tipo').addEventListener('change', dispararBusca);
    document.getElementById('ent-itens-por-pagina').addEventListener('change', dispararBusca);

    document.getElementById('btn-ent-ant').addEventListener('click', () => { if (paginaAtualEnt > 0) { paginaAtualEnt--; carregarListaEntidades(); } });
    document.getElementById('btn-ent-prox').addEventListener('click', () => { paginaAtualEnt++; carregarListaEntidades(); });

    document.getElementById('ent-chk-todos').addEventListener('change', (e) => {
        document.querySelectorAll('.chk-ent-item:not(#ent-chk-todos)').forEach(chk => chk.checked = e.target.checked);
        atualizarBarraLoteEntidades();
    });

    document.getElementById('btn-excluir-lote-ent').addEventListener('click', excluirEntidadesEmLote);

    carregarListaEntidades();
}

async function carregarListaEntidades() {
    const container = document.getElementById('ent-lista-container');
    if (!container) return;

    const termoBusca = document.getElementById('ent-busca').value.trim();
    const tipoFiltro = document.getElementById('ent-filtro-tipo').value;
    const limitePagina = parseInt(document.getElementById('ent-itens-por-pagina').value) || 20;

    container.innerHTML = "<p style='text-align:center; color: var(--text-muted);'>⏳ A processar no Supabase...</p>";
    
    const indiceInicio = paginaAtualEnt * limitePagina;
    const indiceFim = indiceInicio + limitePagina - 1;

    try {
        let query = clienteSupabase
            .from('entidades')
            .select('id, nome_completo, tipo, numero_documento, telefone, email, foto_url', { count: 'exact' })
            .order('nome_completo', { ascending: true }) 
            .range(indiceInicio, indiceFim);

        if (tipoFiltro) query = query.eq('tipo', tipoFiltro);
        if (termoBusca) {
            const termoLimpo = termoBusca.replace(/"/g, '');
            query = query.or(`nome_completo.ilike.%${termoLimpo}%,numero_documento.ilike.%${termoLimpo}%`);
        }

        const { data, count, error } = await query;
        if (error) throw error;

        atualizarPaginacaoEntidades(count, limitePagina);
        document.getElementById('ent-barra-lote').style.display = 'none';
        document.getElementById('ent-chk-todos').checked = false;
        container.innerHTML = "";

        if (!data || data.length === 0) {
            document.getElementById('ent-area-selecionar-todos').style.display = 'none';
            container.innerHTML = "<p style='text-align:center; color: var(--text-muted);'>Nenhuma entidade encontrada.</p>";
            return;
        }

        document.getElementById('ent-area-selecionar-todos').style.display = 'flex';

        data.forEach(ent => {
            const cardItem = document.createElement('div');
            cardItem.style.cssText = `background: var(--input-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; display:flex; align-items:center; gap: 15px; flex-wrap: wrap;`;
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'chk-ent-item';
            checkbox.value = ent.id;
            checkbox.style.cssText = "transform: scale(1.5); margin-right: 5px; cursor: pointer;";
            checkbox.addEventListener('change', atualizarBarraLoteEntidades);
            
            const img = document.createElement('img');
            img.src = ent.foto_url || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';
            img.style.cssText = "width: 50px; height: 50px; object-fit: cover; border-radius: 25px; border: 1px solid var(--border-color); background: #333;";
            
            const infoDiv = document.createElement('div');
            infoDiv.style.flexGrow = '1';
            infoDiv.style.minWidth = '200px';
            const tipoFormatado = ent.tipo ? ent.tipo.toUpperCase() : 'N/A';
            infoDiv.innerHTML = `
                <strong style="color: var(--text-main); font-size: 1.1em;">${ent.nome_completo}</strong><br>
                <span style="background: var(--info-color); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.7em;">${tipoFormatado}</span>
                <span style="color: var(--text-muted); font-size: 0.85em; margin-left: 5px;">Doc: ${ent.numero_documento || 'S/N'}</span>
            `;

            const acoesDiv = document.createElement('div');
            acoesDiv.style.display = 'flex';
            acoesDiv.style.gap = '8px';
            acoesDiv.style.flexWrap = 'wrap';

            if (ent.telefone) {
                let foneLimpo = ent.telefone.replace(/\D/g, ''); 
                if (foneLimpo.length >= 10 && !foneLimpo.startsWith('55')) foneLimpo = '55' + foneLimpo;
                const btnWpp = document.createElement('a');
                btnWpp.href = `https://wa.me/${foneLimpo}`;
                btnWpp.target = "_blank";
                btnWpp.innerHTML = "💬 WPP";
                btnWpp.style.cssText = "background: #25D366; color: white; padding: 8px 10px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 0.85em; display: flex; align-items: center;";
                acoesDiv.appendChild(btnWpp);
            }

            if (ent.email) {
                const btnEmail = document.createElement('a');
                btnEmail.href = `mailto:${ent.email}`;
                btnEmail.innerHTML = "📧 Mail";
                btnEmail.style.cssText = "background: #17a2b8; color: white; padding: 8px 10px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 0.85em; display: flex; align-items: center;";
                acoesDiv.appendChild(btnEmail);
            }

            const btnCartao = document.createElement('button');
            btnCartao.innerHTML = "🪪 Imprimir";
            btnCartao.className = "btn-secundario";
            btnCartao.style.cssText = "width: auto; padding: 8px; font-size: 0.85em;";
            btnCartao.onclick = () => imprimirCarteirinha(ent);

            const btnEditar = document.createElement('button');
            btnEditar.textContent = "✏️ Editar";
            btnEditar.className = "btn-secundario";
            btnEditar.style.cssText = "width: auto; padding: 8px; font-size: 0.85em;";
            btnEditar.onclick = () => desenharModuloEntidadesCadastro(ent.id);

            const btnExcluir = document.createElement('button');
            btnExcluir.textContent = "🗑️ Excluir";
            btnExcluir.className = "btn-perigo";
            btnExcluir.style.cssText = "width: auto; padding: 8px; font-size: 0.85em;";
            // NOTA: Passamos a foto_url para a função poder apagar o ficheiro
            btnExcluir.onclick = () => excluirEntidadeIndividual(ent.id, ent.nome_completo, ent.foto_url);

            acoesDiv.appendChild(btnCartao);
            acoesDiv.appendChild(btnEditar);
            acoesDiv.appendChild(btnExcluir);

            cardItem.appendChild(checkbox);
            cardItem.appendChild(img);
            cardItem.appendChild(infoDiv);
            cardItem.appendChild(acoesDiv);
            container.appendChild(cardItem);
        });

    } catch (erro) {
        console.error("Erro Listagem Entidades:", erro);
        container.innerHTML = "<p style='text-align:center; color: var(--danger-color);'>❌ Erro ao comunicar com o servidor.</p>";
    }
}

function atualizarPaginacaoEntidades(totalItens, limitePagina) {
    const totalPaginas = Math.ceil(totalItens / limitePagina) || 1;
    document.getElementById('texto-ent-paginacao').textContent = `Página ${paginaAtualEnt + 1} de ${totalPaginas}`;
    document.getElementById('btn-ent-ant').disabled = paginaAtualEnt === 0;
    document.getElementById('btn-ent-prox').disabled = (paginaAtualEnt + 1) >= totalPaginas;
    document.getElementById('ent-paginacao').style.display = totalItens > 0 ? "flex" : "none";
}

function atualizarBarraLoteEntidades() {
    const checkboxes = document.querySelectorAll('.chk-ent-item:not(#ent-chk-todos):checked');
    const barraAcoes = document.getElementById('ent-barra-lote');
    if (checkboxes.length > 0) {
        barraAcoes.style.display = 'flex';
        document.getElementById('ent-texto-lote').textContent = `${checkboxes.length} selecionados`;
    } else {
        barraAcoes.style.display = 'none';
    }
}

// FUNÇÕES DE EXCLUSÃO (LIMPEZA TOTAL DE BD E STORAGE)
// =========================================================
async function excluirEntidadeIndividual(id, nome, fotoUrl) {
    if (!confirm(`Atenção: Tem certeza que deseja apagar ${nome} definitivamente? (Isto falhará se existirem produtos associados a este fornecedor).`)) return;
    try {
        // 1. Apaga a linha da base de dados
        const { error } = await clienteSupabase.from('entidades').delete().eq('id', id);
        if (error) throw error;

        // 2. Apaga a foto do Storage (O Conceito reaproveitado do código antigo)
        if (fotoUrl) {
            const nomeArquivo = decodeURIComponent(fotoUrl.split('/').pop().split('?')[0]);
            await clienteSupabase.storage.from('foto_entidades').remove([nomeArquivo]);
            console.log("Ficheiro limpo do storage:", nomeArquivo);
        }

        alert("✅ Entidade e fotografia apagadas com sucesso!");
        carregarListaEntidades();
    } catch (erro) {
        console.error(erro);
        alert("❌ Erro ao apagar. Pode existir uma restrição no sistema (ex: produtos ligados a este fornecedor).");
    }
}

async function excluirEntidadesEmLote() {
    const chks = document.querySelectorAll('.chk-ent-item:not(#ent-chk-todos):checked');
    const ids = Array.from(chks).map(chk => chk.value);
    if (ids.length === 0 || !confirm(`Aviso: Confirma a eliminação definitiva de ${ids.length} registos e as suas fotos?`)) return;

    try {
        // 1. Resgatar as URLs das fotos ANTES de apagar os dados da tabela
        const { data: entidadesParaApagar } = await clienteSupabase
            .from('entidades')
            .select('foto_url')
            .in('id', ids);

        // 2. Apagar da Base de Dados
        const { error } = await clienteSupabase.from('entidades').delete().in('id', ids);
        if (error) throw error;

        // 3. Limpar o Storage em Lote
        if (entidadesParaApagar && entidadesParaApagar.length > 0) {
            const arquivosParaApagar = entidadesParaApagar
                .filter(ent => ent.foto_url)
                .map(ent => decodeURIComponent(ent.foto_url.split('/').pop().split('?')[0]));
            
            if (arquivosParaApagar.length > 0) {
                await clienteSupabase.storage.from('foto_entidades').remove(arquivosParaApagar);
                console.log("Ficheiros em lote limpos do storage.");
            }
        }

        alert("✅ Registos e fotos apagados em lote com sucesso.");
        document.getElementById('ent-chk-todos').checked = false;
        carregarListaEntidades();
    } catch (erro) {
        console.error(erro);
        alert("❌ Falha técnica ao apagar em lote.");
    }
}

                    <img id="ent-img-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23666'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" style="width: 120px; height: 120px; object-fit: cover; border-radius: 60px; border: 2px solid var(--accent-neon); background: var(--input-bg);">
                    <div style="display: flex; gap: 10px;">

                        <label for="ent-foto-camera" style="background: var(--warning-color); color: #000; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin: 0; font-weight: bold;">📸 Tirar Foto</label>

                    </div>

                 <label>Nome Completo *</label>
                <input type="text" id="ent-nome" required placeholder="Ex: João da Silva / Distribuidora X">

                <div style="display: flex; gap: 10px;">
                    <div style="flex: 1;">

                        <input type="text" id="ent-documento" placeholder="000.000.000-00">
                    </div>
                </div>

                <div style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label>Telefone</label>
                        <input type="text" id="ent-telefone" placeholder="(91) 90000-0000">
                    </div>
                    <div style="flex: 1;">
                        <label>Email</label>

        const file = evento.target.files[0];
        if (file) {
            ficheiroAProcessar = file;
            const leitor = new FileReader();
            leitor.onload = e => document.getElementById('ent-img-preview').src = e.target.result;
            leitor.readAsDataURL(file);
        }
    };
    document.getElementById('ent-foto-arquivo').addEventListener('change', processarInputMidia);
    document.getElementById('ent-foto-camera').addEventListener('change', processarInputMidia);

    if (idEdicao) {
        document.getElementById('btn-salvar-entidade').textContent = "⏳ A ler dados...";
        const { data, error } = await clienteSupabase.from('entidades').select('*').eq('id', idEdicao).single();
        if (data && !error) {
            document.getElementById('ent-tipo').value = data.tipo || 'cliente';
            document.getElementById('ent-nome').value = data.nome_completo || '';
            document.getElementById('ent-tipo-doc').value = data.tipo_documento || '';
            document.getElementById('ent-documento').value = data.numero_documento || '';
            document.getElementById('ent-telefone').value = data.telefone || '';
            document.getElementById('ent-email').value = data.email || '';
            document.getElementById('ent-endereco').value = data.endereco_completo || '';
            
            if (data.foto_url) {
                urlFotoAntiga = data.foto_url;
                document.getElementById('ent-img-preview').src = data.foto_url;
            }
        }
        document.getElementById('btn-salvar-entidade').textContent = "💾 Atualizar Entidade";

    document.getElementById('form-entidade').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btnSalvar = document.getElementById('btn-salvar-entidade');
        btnSalvar.textContent = "⏳ A gravar...";
        btnSalvar.disabled = true;

        let urlFinalDaFoto = urlFotoAntiga;
        let nomeFicheiroRecemCarregado = null;

        try {
            if (ficheiroAProcessar) {
                const imagemComprimida = await comprimirParaWebP(ficheiroAProcessar);
                const nomeUnicoSeguro = gerarNomeSeguroArquivo(document.getElementById('ent-nome').value);
                
                const { error: uploadError } = await clienteSupabase.storage
                    .from('foto_entidades')
                    .upload(nomeUnicoSeguro, imagemComprimida);

                if (uploadError) throw uploadError;
                nomeFicheiroRecemCarregado = nomeUnicoSeguro;

                const { data: urlData } = clienteSupabase.storage
                    .from('foto_entidades').getPublicUrl(nomeUnicoSeguro);
                urlFinalDaFoto = urlData.publicUrl;
            }

            const payload = {
                tipo: document.getElementById('ent-tipo').value,
                nome_completo: document.getElementById('ent-nome').value,
                tipo_documento: document.getElementById('ent-tipo-doc').value,
                numero_documento: document.getElementById('ent-documento').value,
                telefone: document.getElementById('ent-telefone').value,
                email: document.getElementById('ent-email').value,
                endereco_completo: document.getElementById('ent-endereco').value,
                foto_url: urlFinalDaFoto
            };

            if (idEdicao) {
                const { error } = await clienteSupabase.from('entidades').update(payload).eq('id', idEdicao);
                if (error) throw error;
                if (urlFotoAntiga && nomeFicheiroRecemCarregado) {
                    const nomeVelho = decodeURIComponent(urlFotoAntiga.split('/').pop().split('?')[0]);
                    await clienteSupabase.storage.from('foto_entidades').remove([nomeVelho]);
                }
            } else {
                const { error } = await clienteSupabase.from('entidades').insert([payload]);
                if (error) throw error;
            }

            alert("✅ Entidade gravada com sucesso!");
            desenharModuloClientes();

        } catch (erro) {
            console.error(erro);
            if (nomeFicheiroRecemCarregado) {
                await clienteSupabase.storage.from('foto_entidades').remove([nomeFicheiroRecemCarregado]);
            }
            alert("❌ Ocorreu um erro ao gravar a entidade.");
        } finally {
            btnSalvar.textContent = "💾 Salvar Entidade";
            btnSalvar.disabled = false;
        }
    });
}

async function carregarListaProdutos(termoBusca, limiteStr = 20) {
    const container = document.getElementById('prod-lista-container');
    if (!container) return;

    const limitePagina = parseInt(limiteStr) || 20;
    container.innerHTML = "<p style='text-align:center; color: var(--text-muted);'>⏳ A processar no Supabase...</p>";
    const indiceInicio = paginaAtualProd * limitePagina;
    const indiceFim = indiceInicio + limitePagina - 1;

    try {
        let query = clienteSupabase
            .from('produtos')
            .select('id, nome, preco_venda, estoque_atual, categoria, foto_url', { count: 'exact' })
            .eq('esta_ativo', true)
            .order('nome', { ascending: true }) // Ordenação Alfabética
            .range(indiceInicio, indiceFim); 

        if (termoBusca) {
            const termoLimpo = termoBusca.replace(/"/g, '');
            query = query.or(`nome.ilike.%${termoLimpo}%,codigo_barras.ilike.%${termoLimpo}%,sku.ilike.%${termoLimpo}%`);
        }

        const { data, count, error } = await query;
        if (error) throw error;

        // Paginação e Reset de Lote
        const totalPaginas = Math.ceil(count / limitePagina) || 1;
        document.getElementById('texto-prod-paginacao').textContent = `Página ${paginaAtualProd + 1} de ${totalPaginas}`;
        document.getElementById('btn-prod-ant').disabled = paginaAtualProd === 0;
        document.getElementById('btn-prod-prox').disabled = (paginaAtualProd + 1) >= totalPaginas;
        document.getElementById('prod-paginacao').style.display = count > 0 ? "flex" : "none";

        document.getElementById('prod-barra-lote').style.display = 'none';
        document.getElementById('prod-chk-todos').checked = false;
        container.innerHTML = ""; 

        if (!data || data.length === 0) {
            document.getElementById('prod-area-selecionar-todos').style.display = 'none';
            container.innerHTML = "<p style='text-align:center; color: var(--text-muted);'>Nenhum artigo encontrado.</p>";
            return;
        }

        document.getElementById('prod-area-selecionar-todos').style.display = 'flex';

        data.forEach(eq => {
            const precoFormat = parseFloat(eq.preco_venda || 0).toFixed(2);
            const cardItem = document.createElement('div');
            cardItem.style.cssText = `background: var(--input-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; display:flex; align-items:center; gap: 15px; flex-wrap:wrap;`;
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'chk-prod-item';
            checkbox.value = eq.id;
            checkbox.style.cssText = "transform: scale(1.5); margin-right: 5px; cursor: pointer;";
            checkbox.addEventListener('change', atualizarBarraLoteProdutos);

            const img = document.createElement('img');
            img.src = eq.foto_url || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>';
            img.style.cssText = "width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-color);";
            
            const infoDiv = document.createElement('div');
            infoDiv.style.flexGrow = '1';
            infoDiv.style.minWidth = '200px';
            infoDiv.innerHTML = `
                <strong style="color: var(--text-main); font-size: 1.1em;">${eq.nome}</strong><br>
                <span style="background: var(--success-color); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; font-weight:bold;">R$ ${precoFormat}</span>
                <span style="background: var(--info-color); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; font-weight:bold; margin-left: 5px;">Qtd: ${eq.estoque_atual || 0}</span><br>
                <span style="color: var(--text-muted); font-size: 0.85em; display:inline-block; margin-top:5px;">Cat: ${eq.categoria || "N/A"}</span>
            `;

            const acoesDiv = document.createElement('div');
            acoesDiv.style.display = 'flex';
            acoesDiv.style.gap = '8px';
            acoesDiv.style.flexWrap = 'wrap';

            const btnEditar = document.createElement('button');
            btnEditar.textContent = "✏️ Editar";
            btnEditar.className = "btn-secundario";
            btnEditar.style.cssText = "width: auto; padding: 8px; font-size: 0.85em;";
            btnEditar.onclick = () => desenharModuloCadastrarProduto(eq.id);

            const btnExcluir = document.createElement('button');
            btnExcluir.textContent = "🗑️ Ocultar";
            btnExcluir.className = "btn-perigo";
            btnExcluir.style.cssText = "width: auto; padding: 8px; font-size: 0.85em;";
            btnExcluir.onclick = () => ocultarProdutoIndividual(eq.id, eq.nome);

            acoesDiv.appendChild(btnEditar);
            acoesDiv.appendChild(btnExcluir);

            cardItem.appendChild(checkbox);
            cardItem.appendChild(img);
            cardItem.appendChild(infoDiv);
            cardItem.appendChild(acoesDiv);
            container.appendChild(cardItem);
        });

    } catch (erro) {
        console.error("Erro Listagem SPA:", erro);
        container.innerHTML = "<p style='text-align:center; color: var(--danger-color);'>❌ Erro ao conectar.</p>";
    }
}

function atualizarBarraLoteProdutos() {
    const checkboxes = document.querySelectorAll('.chk-prod-item:not(#prod-chk-todos):checked');
    const barraAcoes = document.getElementById('prod-barra-lote');
    if (checkboxes.length > 0) {
        barraAcoes.style.display = 'flex';
        document.getElementById('prod-texto-lote').textContent = `${checkboxes.length} selecionados`;
    } else {
        barraAcoes.style.display = 'none';
    }
}

// Lógica Segura de Ocultação (Soft Delete) para proteger histórico de vendas
async function ocultarProdutoIndividual(id, nome) {
    if (!confirm(`Deseja enviar o produto '${nome}' para a lixeira? (O histórico de vendas não será afetado).`)) return;
    try {
        const { error } = await clienteSupabase.rpc('desativar_produto_seguro', { p_id: id });
        if (error) throw error;
        alert("✅ Produto ocultado com sucesso!");
        carregarListaProdutos(document.getElementById('prod-busca').value, document.getElementById('prod-itens-por-pagina').value);
    } catch (erro) {
        console.error(erro);
        alert("❌ Erro ao ocultar produto.");
    }
}

async function ocultarProdutosEmLote() {
    const chks = document.querySelectorAll('.chk-prod-item:not(#prod-chk-todos):checked');
    const ids = Array.from(chks).map(chk => chk.value);
    if (ids.length === 0 || !confirm(`Confirma a ocultação de ${ids.length} produtos?`)) return;

    try {
        const { error } = await clienteSupabase.rpc('ocultar_multiplos_produtos_seguro', { p_ids: ids });
        if (error) throw error;
        alert("✅ Produtos ocultados em lote.");
        document.getElementById('prod-chk-todos').checked = false;
        carregarListaProdutos(document.getElementById('prod-busca').value, document.getElementById('prod-itens-por-pagina').value);
    } catch (erro) {
        console.error(erro);
        alert("❌ Falha técnica ao ocultar em lote.");
    }
}

    });

    // D. CARREGAR DADOS SE FOR EDIÇÃO
    if (idEdicao) {
        document.getElementById('btn-salvar-produto').textContent = "⏳ A ler dados...";
        const { data, error } = await clienteSupabase.from('produtos').select('*').eq('id', idEdicao).single();
        if (data && !error) {
            document.getElementById('prod-nome').value = data.nome || '';
            document.getElementById('prod-categoria').value = data.categoria || '';
            
            const selectOrigem = document.getElementById('prod-origem');
            const origemStr = data.origem_mercadoria !== null ? data.origem_mercadoria.toString() : '';
            Array.from(selectOrigem.options).forEach(opt => {
                if (opt.value.startsWith(origemStr)) selectOrigem.value = opt.value;
            });

            document.getElementById('prod-fornecedor').value = data.fornecedor_id || '';
            document.getElementById('prod-preco-custo').value = data.preco_custo || '';
            document.getElementById('prod-preco-venda').value = data.preco_venda || '';
            document.getElementById('prod-total').value = data.valor_total || ''; // Custom field se gerido pela app
            document.getElementById('prod-estoque').value = data.estoque_atual || 0;
            document.getElementById('prod-estoque-minimo').value = data.estoque_minimo || 0;
            
            document.getElementById('prod-local-estoque').value = data.local_estoque || '';
            document.getElementById('prod-local-loja').value = data.local_loja || '';
            document.getElementById('prod-tipo-embalagem').value = data.tipo_embalagem || '';
            document.getElementById('prod-peso').value = data.peso_liquido || '';
            document.getElementById('prod-dimensoes').value = data.dimensoes || '';

            document.getElementById('prod-sku').value = data.sku || '';
            document.getElementById('prod-ean').value = data.codigo_barras || '';
            document.getElementById('prod-unid').value = data.unidade_comercial || 'UN';
            document.getElementById('prod-ncm').value = data.ncm || '';
            document.getElementById('prod-cest').value = data.cest || '';
            document.getElementById('prod-cfop').value = data.cfop_padrao || '';
            
            document.getElementById('prod-data-compra').value = data.data_compra || '';
            document.getElementById('prod-data-vencimento').value = data.data_vencimento || '';

            if (data.foto_url) {
                urlFotoAntiga = data.foto_url;
                document.getElementById('prod-img-preview').src = data.foto_url;
            }
        }
        document.getElementById('btn-salvar-produto').textContent = "💾 Atualizar Produto";
    }

    // E. GRAVAÇÃO FINAL E ROLLBACK
    document.getElementById('form-produto').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btnSalvar = document.getElementById('btn-salvar-produto');
        btnSalvar.textContent = "⏳ A gravar...";
        btnSalvar.disabled = true;

        let urlFinalDaFoto = urlFotoAntiga;
        let nomeFicheiroRecemCarregado = null;

        try {
            if (ficheiroAProcessar) {
                const imagemComprimida = await comprimirParaWebP(ficheiroAProcessar);
                const nomeUnicoSeguro = gerarNomeSeguroArquivo(document.getElementById('prod-nome').value);
                
                const { error: uploadError } = await clienteSupabase.storage
                    .from('foto_produtos')
                    .upload(nomeUnicoSeguro, imagemComprimida);

                if (uploadError) throw uploadError;
                nomeFicheiroRecemCarregado = nomeUnicoSeguro;

                const { data: urlData } = clienteSupabase.storage
                    .from('foto_produtos').getPublicUrl(nomeUnicoSeguro);
                urlFinalDaFoto = urlData.publicUrl;
            }

            // Mapeamento EXATO para os argumentos da função adicionar_produto_seguro
            const payload = {
                p_nome: document.getElementById('prod-nome').value.trim(),
                p_preco: parseFloat(document.getElementById('prod-preco-venda').value) || 0,
                p_foto_url: urlFinalDaFoto,
                p_codigo_produto: document.getElementById('prod-sku').value.trim(),
                p_ean: document.getElementById('prod-ean').value.trim(),
                p_ncm: document.getElementById('prod-ncm').value.trim() || null,
                p_cest: document.getElementById('prod-cest').value.trim() || null,
                p_cfop: document.getElementById('prod-cfop').value.trim() || null,
                p_unidade_comercial: document.getElementById('prod-unid').value.trim() || 'UN',
                p_quantidade: parseFloat(document.getElementById('prod-estoque').value) || 0,
                p_valor_total: parseFloat(document.getElementById('prod-total').value) || 0,
                p_fornecedor: document.getElementById('prod-fornecedor').value || null,
                p_preco_custo: parseFloat(document.getElementById('prod-preco-custo').value) || 0,
                p_estoque_minimo: parseFloat(document.getElementById('prod-estoque-minimo').value) || 0,
                p_origem: document.getElementById('prod-origem').value || null,
                p_local_estoque: document.getElementById('prod-local-estoque').value.trim() || null,
                p_local_loja: document.getElementById('prod-local-loja').value.trim() || null,
                p_tipo_embalagem: document.getElementById('prod-tipo-embalagem').value.trim() || null,
                p_categoria: document.getElementById('prod-categoria').value.trim() || null,
                p_peso_liquido: parseFloat(document.getElementById('prod-peso').value) || 0,
                p_dimensoes: document.getElementById('prod-dimensoes').value.trim() || null,
                p_data_compra: document.getElementById('prod-data-compra').value || null,
                p_data_vencimento: document.getElementById('prod-data-vencimento').value || null
            };

            if (idEdicao) {
                payload.p_id = idEdicao;
                const { error } = await clienteSupabase.rpc('atualizar_produto_seguro', payload);
                if (error) throw error;
                if (urlFotoAntiga && nomeFicheiroRecemCarregado) {
                    const nomeVelho = decodeURIComponent(urlFotoAntiga.split('/').pop().split('?')[0]);
                    await clienteSupabase.storage.from('foto_produtos').remove([nomeVelho]);
                }
            } else {
                const { error } = await clienteSupabase.rpc('adicionar_produto_seguro', payload);
                if (error) throw error;
            }

            alert("✅ Produto gravado com sucesso!");
            desenharModuloProdutos(); 

        } catch (erro) {
            console.error(erro);
            if (nomeFicheiroRecemCarregado) {
                await clienteSupabase.storage.from('foto_produtos').remove([nomeFicheiroRecemCarregado]);
            }
            alert("❌ Erro ao gravar: O servidor rejeitou os dados. Verifique os limites.");
        } finally {
            btnSalvar.textContent = "💾 Salvar Produto";
            btnSalvar.disabled = false;
        }
    });
}
