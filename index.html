<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depósito de Bebidas - Peça pelo WhatsApp</title>
    
    <!-- Estilos da Loja -->
    <style>
        :root {
            --cor-primaria: #f39c12; 
            --cor-fundo: #f8f9fa;
            --cor-texto: #333;
        }
        
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--cor-fundo); color: var(--cor-texto); }
        
        /* Cabeçalho Atualizado */
        header { background-color: #1a1a1a; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 10px;}
        header h1 { margin: 0; font-size: 1.5em; color: var(--cor-primaria); }
        
        .grupo-botoes-topo { display: flex; gap: 10px; align-items: center; }
        
        .btn-carrinho { background-color: var(--cor-primaria); color: #fff; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 1em;}
        .btn-carrinho:hover { opacity: 0.9; }
        
        .btn-login { background-color: #6c757d; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 0.9em;}
        .btn-login:hover { background-color: #5a6268; }

        /* Barra de Filtros e Busca */
        .barra-filtros { max-width: 1200px; margin: 20px auto 0 auto; padding: 0 20px; display: flex; gap: 15px; flex-wrap: wrap; }
        .input-group { display: flex; flex-grow: 1; min-width: 250px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px 0 0 4px; font-size: 1em; outline: none; }
        .btn-scan { background-color: #17a2b8; color: white; border: none; padding: 0 15px; border-radius: 0 4px 4px 0; cursor: pointer; font-size: 1.2em; }
        .select-categoria { padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 1em; min-width: 200px; outline: none; background: white; }

        /* Grelha de Produtos */
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .grid-produtos { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        
        .produto-card { background: white; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s;}
        .produto-card:hover { transform: translateY(-5px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        .produto-img { width: 100%; height: 200px; object-fit: contain; margin-bottom: 15px; border-radius: 5px; background: #fff;}
        .produto-nome { font-size: 1.1em; font-weight: bold; margin: 10px 0; }
        .produto-preco { color: #28a745; font-size: 1.4em; font-weight: bold; margin-bottom: 15px; }
        
        .btn-adicionar { background-color: #28a745; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1em;}
        .btn-adicionar:hover { background-color: #218838; }

        /* Modal do Carrinho */
        #modal-carrinho { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;}
        .carrinho-conteudo { background: white; width: 90%; max-width: 500px; border-radius: 8px; padding: 20px; max-height: 90vh; overflow-y: auto;}
        
        .carrinho-cabecalho { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;}
        .btn-fechar { background: none; border: none; font-size: 1.5em; cursor: pointer; color: #dc3545;}
        
        .item-carrinho { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 10px;}
        .item-info { flex-grow: 1; }
        .item-acoes { display: flex; align-items: center; gap: 10px; }
        .btn-qtd { background: #eee; border: 1px solid #ccc; padding: 5px 10px; cursor: pointer; border-radius: 4px;}
        
        .rodape-carrinho { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; }
        .total-carrinho { font-size: 1.5em; font-weight: bold; color: #28a745;}
        .btn-limpar { background-color: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-limpar:hover { opacity: 0.8; }
        
        /* Formulário de Entrega */
        .form-entrega { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 20px;}
        .form-entrega input, .form-entrega select { width: 100%; padding: 10px; margin: 5px 0 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        
        .btn-whatsapp { background-color: #25D366; color: white; border: none; padding: 15px; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1.1em;}
        .btn-whatsapp:hover { background-color: #1ebe57; }

        /* Leitor de Código de Barras */
        #scanner-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        #reader-loja { width: 100%; max-width: 500px; background: white; border-radius: 8px; overflow: hidden; }
    </style>

    <!-- Bibliotecas: Supabase e Leitor de QRCode/Barras -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <h1>🍻 Depósito de Bebidas</h1>
        <div class="grupo-botoes-topo">
            <button class="btn-login" onclick="window.location.href='credenciais.html'">🔐 Login</button>
            <button class="btn-carrinho" onclick="abrirCarrinho()">
                🛒 Carrinho (<span id="contador-carrinho">0</span>)
            </button>
        </div>
    </header>

    <!-- Barra de Busca, Leitor e Filtros -->
    <div class="barra-filtros">
        <div class="input-group">
            <input type="text" id="input-busca-loja" placeholder="Buscar produto ou código de barras..." oninput="filtrarProdutos()">
            <button type="button" class="btn-scan" onclick="abrirScanner()" title="Ler Código de Barras">📷</button>
        </div>
        <select id="select-categoria" class="select-categoria" onchange="filtrarProdutos()">
            <option value="">Todas as Categorias</option>
            <!-- Categorias serão injetadas aqui -->
        </select>
    </div>

    <!-- Grelha de Produtos -->
    <div class="container">
        <div id="status-loja">A carregar o catálogo de produtos...</div>
        <div id="grid-produtos" class="grid-produtos"></div>
    </div>

    <!-- Modal do Carrinho de Compras -->
    <div id="modal-carrinho">
        <div class="carrinho-conteudo">
            <div class="carrinho-cabecalho">
                <h2>Seu Pedido</h2>
                <button class="btn-fechar" onclick="fecharCarrinho()">✖</button>
            </div>
            
            <div id="lista-carrinho">
                <p style="text-align: center; color: #666;">O seu carrinho está vazio.</p>
            </div>
            
            <div class="rodape-carrinho">
                <button class="btn-limpar" onclick="limparCarrinho()" id="btn-limpar" style="display: none;">🗑️ Limpar Carrinho</button>
                <div class="total-carrinho" id="total-carrinho">Total: R$ 0,00</div>
            </div>

            <!-- Formulário para Entrega -->
            <div class="form-entrega" id="area-entrega" style="display: none;">
                <h3>📍 Dados de Entrega</h3>
                
                <label>Seu Nome:</label>
                <input type="text" id="cli-nome" placeholder="Ex: João Silva" required>
                
                <label>Endereço Completo:</label>
                <input type="text" id="cli-endereco" placeholder="Ex: Rua das Flores, 123 - Bairro Centro" required>
                
                <label>Forma de Pagamento:</label>
                <select id="cli-pagamento">
                    <option value="PIX">PIX</option>
                    <option value="Dinheiro (Precisa de troco)">Dinheiro</option>
                    <option value="Cartão de Crédito">Cartão de Crédito (Máquina)</option>
                    <option value="Cartão de Débito">Cartão de Débito (Máquina)</option>
                </select>

                <button class="btn-whatsapp" onclick="finalizarPedidoWhatsApp()">
                    📱 Enviar Pedido por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Modal do Scanner de Código de Barras -->
    <div id="scanner-modal">
        <h3 style="color: white; margin-bottom: 15px;">Aponte para o Código de Barras</h3>
        <div id="reader-loja"></div>
        <button class="btn-login" style="margin-top: 20px; background-color: #dc3545;" onclick="fecharScanner()">❌ Cancelar</button>
    </div>


<script src="supabase_config.js"></script>
    <script>
       
        
        const NUMERO_WHATSAPP = '5591992420981'; 

        let carrinho = [];
        let todosProdutos = []; // Mantém todos os produtos carregados na memória
        let html5QrCode = null;

        /* ================= CARREGAMENTO E FILTROS ================= */
        
        async function carregarProdutos() {
            const statusDiv = document.getElementById('status-loja');
            
            try {
                const { data: produtos, error } = await clienteSupabase
                    .from('produtos')
                    .select('*')
                    .eq('esta_ativo', true)
                    .gt('quantidade', 0) 
                    .order('nome', { ascending: true });

                if (error) throw error;

                if (produtos.length === 0) {
                    statusDiv.textContent = "Nenhum produto disponível no momento.";
                    return;
                }

                statusDiv.style.display = 'none';
                todosProdutos = produtos; // Armazena na variável global
                
                extrairCategorias(produtos); // Monta o select de categorias
                renderizarGrade(produtos);   // Desenha a grelha inicial

            } catch (erro) {
                console.error(erro);
                statusDiv.textContent = "Erro ao carregar o catálogo. Tente novamente.";
            }
        }

        // Extrai categorias únicas dinamicamente do banco de dados
        function extrairCategorias(produtos) {
            // Cria um array apenas com as categorias e remove duplicatas usando Set
            const categoriasUnicas = [...new Set(produtos.map(p => p.categoria).filter(c => c))];
            
            const select = document.getElementById('select-categoria');
            categoriasUnicas.sort().forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                select.appendChild(option);
            });
        }

        // Filtra os produtos armazenados na memória (Instantâneo)
        function filtrarProdutos() {
            const termoBusca = document.getElementById('input-busca-loja').value.toLowerCase().trim();
            const categoriaSelecionada = document.getElementById('select-categoria').value;

            const produtosFiltrados = todosProdutos.filter(prod => {
                // Verifica se o termo está no nome, no EAN ou no Código do Produto
                const matchTexto = 
                    (prod.nome && prod.nome.toLowerCase().includes(termoBusca)) ||
                    (prod.ean && prod.ean.toLowerCase().includes(termoBusca)) ||
                    (prod.codigo_produto && prod.codigo_produto.toLowerCase().includes(termoBusca));
                
                // Verifica se a categoria corresponde (ou se nenhuma categoria foi selecionada)
                const matchCategoria = categoriaSelecionada === "" || prod.categoria === categoriaSelecionada;
                
                return matchTexto && matchCategoria;
            });

            renderizarGrade(produtosFiltrados);
        }

        function renderizarGrade(listaProdutos) {
            const grid = document.getElementById('grid-produtos');
            grid.innerHTML = '';

            if (listaProdutos.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center;">Nenhum produto encontrado para esta busca.</p>';
                return;
            }

            listaProdutos.forEach(prod => {
                const fotoUrl = prod.foto_url || 'https://via.placeholder.com/250x200?text=Sem+Foto';
                const preco = parseFloat(prod.preco).toFixed(2).replace('.', ',');

                const card = document.createElement('div');
                card.className = 'produto-card';
                card.innerHTML = `
                    <img src="${fotoUrl}" class="produto-img" alt="${prod.nome}">
                    <div class="produto-nome">${prod.nome}</div>
                    <div class="produto-preco">R$ ${preco}</div>
                    <button class="btn-adicionar" onclick="adicionarAoCarrinho('${prod.id}', '${prod.nome}', ${prod.preco})">
                        Adicionar ao Carrinho
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        /* ================= LEITOR DE CÓDIGO DE BARRAS ================= */
        
        function abrirScanner() {
            const modalScanner = document.getElementById('scanner-modal');
            modalScanner.style.display = 'flex';
            
            html5QrCode = new Html5Qrcode("reader-loja");
            const config = { fps: 10, qrbox: { width: 250, height: 100 } };
            
            html5QrCode.start({ facingMode: "environment" }, config, (codigoDecodificado) => {
                // Quando lê o código, preenche a barra de busca e filtra automaticamente
                document.getElementById('input-busca-loja').value = codigoDecodificado;
                fecharScanner();
                filtrarProdutos();
            }).catch(err => {
                alert("Erro ao aceder à câmara. Verifique as permissões.");
                fecharScanner();
            });
        }

        function fecharScanner() {
            const modalScanner = document.getElementById('scanner-modal');
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    modalScanner.style.display = 'none';
                }).catch(() => {
                    modalScanner.style.display = 'none';
                });
            } else {
                modalScanner.style.display = 'none';
            }
        }

        /* ================= LÓGICA DO CARRINHO ================= */
        
        function adicionarAoCarrinho(id, nome, preco) {
            const itemExistente = carrinho.find(item => item.id === id);
            
            if (itemExistente) {
                itemExistente.quantidade++; 
            } else {
                carrinho.push({ id, nome, preco, quantidade: 1 }); 
            }
            
            atualizarInterfaceCarrinho();
            
            const btnCarrinho = document.querySelector('.btn-carrinho');
            btnCarrinho.style.backgroundColor = '#28a745';
            setTimeout(() => btnCarrinho.style.backgroundColor = 'var(--cor-primaria)', 300);
        }

        function alterarQuantidade(id, delta) {
            const item = carrinho.find(item => item.id === id);
            if (item) {
                item.quantidade += delta;
                if (item.quantidade <= 0) {
                    carrinho = carrinho.filter(i => i.id !== id);
                }
                atualizarInterfaceCarrinho();
            }
        }

        function limparCarrinho() {
            if(confirm("Tem certeza que deseja remover todos os itens do carrinho?")) {
                carrinho = [];
                atualizarInterfaceCarrinho();
            }
        }

        function atualizarInterfaceCarrinho() {
            const lista = document.getElementById('lista-carrinho');
            const totalDiv = document.getElementById('total-carrinho');
            const areaEntrega = document.getElementById('area-entrega');
            const contador = document.getElementById('contador-carrinho');
            const btnLimpar = document.getElementById('btn-limpar');
            
            lista.innerHTML = '';
            let total = 0;
            let totalItens = 0;

            if (carrinho.length === 0) {
                lista.innerHTML = '<p style="text-align: center; color: #666;">O seu carrinho está vazio.</p>';
                areaEntrega.style.display = 'none';
                btnLimpar.style.display = 'none';
                totalDiv.textContent = 'Total: R$ 0,00';
                contador.textContent = '0';
                return;
            }

            carrinho.forEach(item => {
                total += item.preco * item.quantidade;
                totalItens += item.quantidade;
                
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item-carrinho';
                itemDiv.innerHTML = `
                    <div class="item-info">
                        <strong>${item.nome}</strong><br>
                        <small>R$ ${item.preco.toFixed(2).replace('.', ',')} x ${item.quantidade}</small>
                    </div>
                    <div class="item-acoes">
                        <button class="btn-qtd" onclick="alterarQuantidade('${item.id}', -1)">-</button>
                        <span>${item.quantidade}</span>
                        <button class="btn-qtd" onclick="alterarQuantidade('${item.id}', 1)">+</button>
                    </div>
                `;
                lista.appendChild(itemDiv);
            });

            totalDiv.textContent = `Total: R$ ${total.toFixed(2).replace('.', ',')}`;
            contador.textContent = totalItens;
            areaEntrega.style.display = 'block'; 
            btnLimpar.style.display = 'block';
        }

        function abrirCarrinho() { document.getElementById('modal-carrinho').style.display = 'flex'; }
        function fecharCarrinho() { document.getElementById('modal-carrinho').style.display = 'none'; }

        /* ================= INTEGRAÇÃO COM WHATSAPP ================= */
        
        function finalizarPedidoWhatsApp() {
            const nome = document.getElementById('cli-nome').value.trim();
            const endereco = document.getElementById('cli-endereco').value.trim();
            const pagamento = document.getElementById('cli-pagamento').value;

            if (!nome || !endereco) {
                alert("Por favor, preencha o seu nome e endereço de entrega.");
                return;
            }

            let mensagem = `Olá! Gostaria de fazer um pedido.\n\n`;
            mensagem += `📦 *PRODUTOS:*\n`;
            
            let totalPedido = 0;
            carrinho.forEach(item => {
                const subtotal = item.quantidade * item.preco;
                totalPedido += subtotal;
                mensagem += `${item.quantidade}x ${item.nome} - R$ ${subtotal.toFixed(2).replace('.', ',')}\n`;
            });

            mensagem += `\n💰 *VALOR TOTAL: R$ ${totalPedido.toFixed(2).replace('.', ',')}*\n\n`;
            mensagem += `🚚 *DADOS DA ENTREGA:*\n`;
            mensagem += `Nome: ${nome}\n`;
            mensagem += `Endereço: ${endereco}\n`;
            mensagem += `Pagamento: ${pagamento}\n`;

            const mensagemCodificada = encodeURIComponent(mensagem);
            const linkWhatsapp = `https://wa.me/${NUMERO_WHATSAPP}?text=${mensagemCodificada}`;
            window.open(linkWhatsapp, '_blank');
        }

        // Executa ao carregar a página
        window.onload = carregarProdutos;
    </script>
</body>
</html>
