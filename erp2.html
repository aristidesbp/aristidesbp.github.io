<!DOCTYPE html>
<html class="light" lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Meu ERP - Monolítico</title>
    
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    
    <!-- Bibliotecas Externas -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        /*🟥🟥🟥🟥🟥🟥🟥🟥🟥 ESTILOS GERAIS E CUSTOMIZADOS 🟥🟥🟥🟥🟥🟥🟥🟥🟥*/
        .material-symbols-outlined { 
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; 
            display: inline-block; 
            vertical-align: middle; 
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(8px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .glass-card { 
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(8px); 
            border: 1px solid rgba(255, 255, 255, 0.3); 
        }
        .dark .glass-card { 
            background: rgba(30, 41, 59, 0.8); 
            border-color: rgba(255, 255, 255, 0.1); 
        }

        #mobile-overlay { transition: opacity 0.3s ease; }
        aside { transition: transform 0.3s ease-in-out; }
        /*🟥🟥🟥🟥🟥🟥🟥🟥🟥 FIM DOS ESTILOS 🟥🟥🟥🟥🟥🟥🟥🟥🟥*/
    </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-[#0f172a] text-slate-900 dark:text-slate-200 font-sans transition-colors duration-300 overflow-x-hidden">

    <!--🟥🟥🟥🟥🟥🟥🟥🟥 TELA DE LOGIN 🟥🟥🟥🟥🟥🟥🟥🟥-->
    <div id="tela-login" class="min-h-screen flex items-center justify-center relative overflow-hidden hidden">
        <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
            <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-emerald-700/5 rounded-full blur-3xl"></div>
            <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-emerald-500/10 rounded-full blur-3xl"></div>
        </div>
        
        <div class="bg-white dark:bg-slate-900 p-8 sm:p-10 rounded-2xl shadow-lg border border-slate-200 dark:border-slate-800 max-w-md w-full fade-in relative z-10 mx-4 glass-card">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-700/10 rounded-2xl mb-4">
                    <span class="material-symbols-outlined text-emerald-700 text-4xl">lock_person</span>
                </div>
                <h2 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Acesso Restrito</h2>
                <p class="text-slate-500 dark:text-slate-400 text-sm mt-2">Insira suas credenciais para continuar.</p>
            </div>
            
            <div class="space-y-6">
                <div>
                    <label class="font-bold text-xs text-slate-500 uppercase tracking-widest mb-2 block">E-mail Corporativo</label>
                    <input id="login-email" type="email" placeholder="usuario@empresa.com.br" onkeyup="if(event.key==='Enter') document.getElementById('login-senha').focus()" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-emerald-700/20 focus:border-emerald-700 outline-none transition-all dark:text-white"/>
                </div>
                <div>
                    <label class="font-bold text-xs text-slate-500 uppercase tracking-widest mb-2 block">Senha de Segurança</label>
                    <div class="relative">
                        <input id="login-senha" type="password" placeholder="••••••••" onkeyup="if(event.key==='Enter') fazerLogin()" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-emerald-700/20 focus:border-emerald-700 outline-none transition-all dark:text-white"/>
                        <button type="button" onclick="togglePasswordVisibility('login-senha', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 p-1 hover:text-slate-600 dark:hover:text-white transition-colors">
                            <span class="material-symbols-outlined text-xl">visibility</span>
                        </button>
                    </div>
                </div>
                <button id="btn-login" onclick="fazerLogin()" class="w-full bg-emerald-700 text-white font-bold py-4 rounded-xl hover:bg-emerald-800 transition-all shadow-lg shadow-emerald-700/20">
                    Autenticar Acesso
                </button>
            </div>
        </div>
    </div>
    <!--🟥🟥🟥🟥🟥🟥🟥🟥 FIM DA TELA DE LOGIN 🟥🟥🟥🟥🟥🟥🟥🟥-->


    <!--🟥🟥🟥🟥🟥🟥🟥🟥 SISTEMA PRINCIPAL 🟥🟥🟥🟥🟥🟥🟥🟥-->
    <div id="tela-sistema" class="min-h-screen hidden">
        <div class="fixed inset-0 bg-black/50 z-50 hidden lg:hidden transition-opacity" id="mobile-overlay" onclick="toggleMobileSidebar()"></div>

        <!-- MENU LATERAL (SIDEBAR) -->
        <aside class="fixed h-full w-[260px] left-0 top-0 bg-white dark:bg-slate-900 border-r border-[#E2E8F0] dark:border-slate-800 flex flex-col py-8 z-[60] -translate-x-full lg:translate-x-0 transition-transform" id="sidebar">
            <div class="px-6 mb-8 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-emerald-700 rounded-lg flex items-center justify-center">
                        <span class="material-symbols-outlined text-white">hub</span>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-slate-900 dark:text-white leading-none">ERP_ABP</h1>
                        <span class="text-[10px] uppercase font-bold tracking-[0.1em] text-emerald-700">Gestão</span>
                    </div>
                </div>
                <button class="lg:hidden p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" onclick="toggleMobileSidebar()">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            
            <div class="w-full mb-8 px-4 lg:hidden">
                <label for="select-aba" class="font-bold text-[10px] text-slate-500 mb-2 block uppercase">Painel Ativo</label>
                <select id="select-aba" onchange="alternarAba(this.value)" class="w-full bg-white dark:bg-slate-800 border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-700 dark:border-slate-700 dark:text-white">
                    <option value="bem_vindo">🏠 INÍCIO</option>
                    <option value="entidades">🙋 ENTIDADES</option>
                    <option value="estoque">📦 ESTOQUE</option>
                </select>
            </div>

            <nav class="hidden lg:flex flex-col px-4 space-y-2">
                <button onclick="alternarAba('bem_vindo')" class="flex items-center gap-3 p-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition text-left">
                    <span class="material-symbols-outlined">home</span> Início
                </button>
                <button onclick="alternarAba('entidades')" class="flex items-center gap-3 p-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition text-left">
                    <span class="material-symbols-outlined">groups</span> Entidades
                </button>
                <button onclick="alternarAba('estoque')" class="flex items-center gap-3 p-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition text-left">
                    <span class="material-symbols-outlined">inventory_2</span> Estoque
                </button>
            </nav>

            <div class="mt-auto px-4">
                <button onclick="sairDaConta()" class="w-full flex items-center justify-center gap-2 p-3 rounded-xl text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 transition font-bold text-sm">
                    <span class="material-symbols-outlined text-base">logout</span> Sair do Sistema
                </button>
            </div>
        </aside>

        <!-- CABEÇALHO (HEADER) -->
        <header class="fixed top-0 right-0 w-full lg:w-[calc(100%-260px)] z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-[#E2E8F0] dark:border-slate-800 flex justify-between items-center h-20 px-4 sm:px-8">
            <div class="flex items-center gap-4">
                <button class="lg:hidden p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-all" onclick="toggleMobileSidebar()">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <h2 class="text-lg sm:text-xl font-bold text-slate-900 dark:text-white">Meu Painel</h2>
            </div>
            <div class="flex items-center gap-2 sm:gap-6">
                <button class="w-10 h-10 rounded-xl flex items-center justify-center text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all" id="theme-toggle" onclick="toggleDarkMode()">
                    <span class="material-symbols-outlined" id="dark-icon">dark_mode</span>
                    <span class="material-symbols-outlined hidden" id="light-icon">light_mode</span>
                </button>
            </div>
        </header>

        <!-- ÁREA DE TRABALHO -->
        <main class="lg:ml-[260px] pt-20 min-h-screen">
            <div class="p-4 sm:p-8 max-w-[1440px] mx-auto" id="content-panels">
                
                <div id="aba-bem_vindo" class="fade-in max-w-5xl mx-auto hidden">
                    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 sm:p-10 shadow-sm">
                        <h3 class="text-xl font-bold text-slate-900 dark:text-white">Seja Bem-vindo ao Sistema!</h3>
                        <p class="text-slate-500 dark:text-slate-400 mt-2">A conexão com o Supabase foi estabelecida com sucesso.</p>
                    </div>
                </div>

                <div id="aba-entidades" class="hidden fade-in max-w-5xl mx-auto">
                    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm">
                        <h3 class="text-xl font-bold text-slate-900 dark:text-white">Módulo de Entidades (Em breve)</h3>
                    </div>
                </div>

                <div id="aba-estoque" class="hidden fade-in max-w-5xl mx-auto">
                    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm">
                        <h3 class="text-xl font-bold text-slate-900 dark:text-white">Módulo de Estoque (Em breve)</h3>
                    </div>
                </div>

            </div>
        </main>
    </div>
    <!--🟥🟥🟥🟥🟥🟥🟥🟥 FIM DO SISTEMA PRINCIPAL 🟥🟥🟥🟥🟥🟥🟥🟥-->

    <script>
        /*🟥🟥🟥🟥🟥🟥🟥🟥🟥 CONFIGURAÇÃO TAILWIND 🟥🟥🟥🟥🟥🟥🟥🟥🟥*/
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        };
        /*🟥🟥🟥🟥🟥🟥🟥🟥🟥 FIM CONFIGURAÇÃO TAILWIND 🟥🟥🟥🟥🟥🟥🟥🟥🟥*/

        /*🟥🟥🟥🟥🟥🟥🟥🟥🟥 CONEXÃO SUPABASE (Credenciais Reais) 🟥🟥🟥🟥🟥🟥🟥🟥🟥*/
        const supabaseUrl = 'https://ctdkeqltveymtqmtspyu.supabase.co/';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0ZGtlcWx0dmV5bXRxbXRzcHl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMjk1NTUsImV4cCI6MjEwMzkwNTU1NX0.ka_jrnDtrOhfPr7_TAl63Z7nyRZeocy2rrkHSLQBOe4';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);
        
        let usuarioLogadoId = null;
        /*🟥🟥🟥🟥🟥🟥🟥🟥🟥 FIM CONEXÃO SUPABASE 🟥🟥🟥🟥🟥🟥🟥🟥🟥*/

        /*🟥🟥🟥🟥🟥🟥🟥🟥🟥 MÓDULO DE AUTENTICAÇÃO E SESSÃO 🟥🟥🟥🟥🟥🟥🟥🟥🟥*/
        function togglePasswordVisibility(inputId, btnElement) {
            const input = document.getElementById(inputId);
            const icon = btnElement.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        async function verificarSessao() {
            const telaLogin = document.getElementById('tela-login');
            const telaSistema = document.getElementById('tela-sistema');
            
            try {
                const { data: { session }, error } = await _supabase.auth.getSession();
                
                if (session) {
                    telaLogin.classList.add('hidden');
                    telaSistema.classList.remove('hidden');
                    usuarioLogadoId = session.user.id;
                    alternarAba('bem_vindo');
                } else {
                    telaLogin.classList.remove('hidden');
                    telaSistema.classList.add('hidden');
                    usuarioLogadoId = null;
                }
            } catch (err) {
                console.error("Erro ao verificar sessão: ", err);
                telaLogin.classList.remove('hidden');
            }
        }

        async function fazerLogin() {
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;
            const btn = document.getElementById('btn-login');
            
            if (!email || !senha) return alert("Por favor, preencha e-mail e senha.");
            
            btn.innerText = 'Autenticando...';
            btn.disabled = true;
            
            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: senha
            });
            
            btn.innerText = 'Autenticar Acesso';
            btn.disabled = false;

            if (error) {
                alert("Falha na autenticação: " + error.message);
            } else {
                verificarSessao();
            }
        }

        async function sairDaConta() {
            await _supabase.auth.signOut();
            verificarSessao();
        }
        /*🟥🟥🟥🟥🟥🟥🟥🟥🟥 FIM MÓDULO DE AUTENTICAÇÃO 🟥🟥🟥🟥🟥🟥🟥🟥🟥*/

        /*🟥🟥🟥🟥🟥🟥🟥🟥🟥 NAVEGAÇÃO E INTERFACE 🟥🟥🟥🟥🟥🟥🟥🟥🟥*/
        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            const isVisible = sidebar.classList.contains('translate-x-0');
            
            if (isVisible) {
                sidebar.classList.replace('translate-x-0', '-translate-x-full');
                overlay.classList.add('hidden');
                document.body.style.overflow = '';
            } else {
                sidebar.classList.replace('-translate-x-full', 'translate-x-0');
                overlay.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            document.getElementById('dark-icon').classList.toggle('hidden', isDark);
            document.getElementById('light-icon').classList.toggle('hidden', !isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function alternarAba(abaAtiva) {
            const selectAba = document.getElementById('select-aba');
            if (selectAba) selectAba.value = abaAtiva;

            document.querySelectorAll('[id^="aba-"]').forEach(painel => {
                painel.classList.toggle('hidden', painel.id !== `aba-${abaAtiva}`);
            });
        }
        /*🟥🟥🟥🟥🟥🟥🟥🟥🟥 FIM NAVEGAÇÃO E INTERFACE 🟥🟥🟥🟥🟥🟥🟥🟥🟥*/

        /*🟥🟥🟥🟥🟥🟥🟥🟥🟥 INICIALIZAÇÃO 🟥🟥🟥🟥🟥🟥🟥🟥🟥*/
        document.addEventListener('DOMContentLoaded', () => {
            // Verificação de Dark Mode
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('dark-icon')?.classList.add('hidden');
                document.getElementById('light-icon')?.classList.remove('hidden');
            }
            
            // Inicia o processo de login
            verificarSessao();
        });
        /*🟥🟥🟥🟥🟥🟥🟥🟥🟥 FIM INICIALIZAÇÃO 🟥🟥🟥🟥🟥🟥🟥🟥🟥*/
    </script>
</body>
</html>
