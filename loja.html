<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja Virtual</title>
    
    <!-- 1º CARREGA A BIBLIOTECA DO SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 2º CARREGA AS SUAS CHAVES -->
    <script src="supabase_config.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; }
        header { background-color: #343a40; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2);}
        header h1 { margin: 0; font-size: 1.5em; }
        
        .btn-carrinho { background-color: #ffc107; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 1em; position: relative;}
        .btn-carrinho:hover { background-color: #e0a800; }
        .badge { background: #dc3545; color: white; border-radius: 50%; padding: 3px 8px; font-size: 0.8em; position: absolute; top: -5px; right: -10px; }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .grade-produtos { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        
        .cartao-produto { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s; display: flex; flex-direction: column;}
        .cartao-produto:hover { transform: translateY(-5px); }
        .produto-img { width: 100%; height: 200px; object-fit: cover; background-color: #eee; }
        .produto-info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1;}
        .produto-nome { font-size: 1.1em; font-weight: bold; margin: 0 0 10px 0; color: #333; }
        .produto-categoria { font-size: 0.8em; color: #6c757d; margin-bottom: 10px; }
        .produto-preco { font-size: 1.3em; color: #28a745; font-weight: bold; margin-bottom: 15px; }
        
        .btn-comprar { background-color: #007bff; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; margin-top: auto;}
        .btn-comprar:hover { background-color: #0056b3; }

        #modal-carrinho { position: fixed; top: 0; right: -400px; width: 380px; max-width: 100%; height: 100vh; background: white; box-shadow: -2px 0 10px rgba(0,0,0,0.2); transition: right 0.3s ease; z-index: 2000; display: flex; flex-direction: column;}
        #modal-carrinho.aberto { right: 0; }
        .carrinho-header { background: #343a40; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .btn-fechar { background: none; border: none; color: white; font-size: 1.5em; cursor: pointer; }
        
        .carrinho-itens { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px;}
        .item-carrinho { display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .item-topo { display: flex; justify-content: space-between; align-items: flex-start; }
        .item-nome { font-weight: bold; font-size: 0.9em; margin: 0; color: #333;}
        .item-preco { color: #28a745; font-size: 0.9em; font-weight: bold; margin-top: 5px; display: block;}
        
        .controle-qtd { display: flex; align-items: center; gap: 10px; background: #f8f9fa; padding: 5px; border-radius: 5px; width: fit-content;}
        .btn-qtd { background: #6c757d; color: white; border: none; border-radius: 3px; width: 25px; height: 25px; cursor: pointer; font-weight: bold; display: flex; justify-content: center; align-items: center;}
        .btn-qtd:hover { background: #5a6268; }
        .btn-qtd.remover { background: #dc3545; }
        .btn-qtd.remover:hover { background: #c82333; }
        .qtd-valor { font-weight: bold; min-width: 20px; text-align: center; }
        
        .carrinho-footer { padding: 20px; border-top: 1px solid #ddd; background: #f8f9fa; }
        .total-carrinho { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between;}
        
        .form-entrega { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed #ccc;}
        .form-entrega input, .form-entrega select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9em; width: 100%; box-sizing: border-box;}
        .form-entrega h4 { margin: 0 0 5px 0; font-size: 1em; color: #333; }

        .btn-checkout { background-color: #25D366; color: white; border: none; padding: 15px; width: 100%; font-size: 1.1em; font-weight: bold; border-radius: 5px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px;}
        .btn-checkout:hover { background-color: #128C7E; }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1500; display: none; }
        #overlay.ativo { display: block; }
    </style>
</head>

<body>
    <header>
        <h1>🛍️ Minha Loja Virtual</h1>
        <button class="btn-carrinho" onclick="abrirCarrinho()">
            🛒 Carrinho <span id="contador-carrinho" class="badge">0</span>
        </button>
    </header>

    <div class="container">
        <h2 style="color: #333;">Nossos Produtos</h2>
        <div id="mensagem-status">Carregando vitrine...</div>
        <div id="grade-vitrine" class="grade-produtos"></div>
    </div>

    <div id="overlay" onclick="fecharCarrinho()"></div>

    <div id="modal-carrinho">
        <div class="carrinho-header">
            <h2 style="margin: 0; font-size: 1.2em;">Seu Carrinho</h2>
            <button class="btn-fechar" onclick="fecharCarrinho()">✖</button>
        </div>
        
        <div id="lista-carrinho" class="carrinho-itens">
            <p style="text-align: center; color: #666; margin-top: 50px;">O seu carrinho está vazio.</p>
        </div>
        
        <div class="carrinho-footer">
            <div class="form-entrega" id="area-entrega" style="display: none;">
                <h4>🚚 Dados de Entrega</h4>
                <input type="text" id="input-cliente-nome" placeholder="Seu Nome Completo">
                <input type="text" id="input-cliente-endereco" placeholder="Endereço (Rua, Nº, Bairro)">
                <select id="input-cliente-pagamento">
                    <option value="">Forma de Pagamento...</option>
                    <option value="Pix">Pix</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                </select>
            </div>

            <div class="total-carrinho">
                <span>Total:</span>
                <span id="valor-total-carrinho">R$ 0,00</span>
            </div>
            
            <button class="btn-checkout" onclick="finalizarPedidoWhatsApp()">
                📱 Enviar Pedido (WhatsApp)
            </button>
        </div>
    </div>

    <script>
        let produtosDaLoja = []; 
        let itensNoCarrinho = []; 

        async function carregarVitrine() {
            const statusDiv = document.getElementById('mensagem-status');
            const gradeDiv = document.getElementById('grade-vitrine');
            
            try {
                // Acesso ao clienteSupabase importado do supabase_config.js
                const { data, error } = await clienteSupabase
                    .from('produtos')
                    .select('id, nome, preco, foto_url, categoria, quantidade')
                    .eq('esta_ativo', true)
                    .gt('quantidade', 0) 
                    .order('nome', { ascending: true });

                if (error) throw error;
                produtosDaLoja = data;
                statusDiv.style.display = 'none'; 

                if (produtosDaLoja.length === 0) {
                    gradeDiv.innerHTML = "<p>Nenhum produto disponível no momento.</p>";
                    return;
                }

                gradeDiv.innerHTML = "";
                produtosDaLoja.forEach(produto => {
                    const imagem = produto.foto_url ? produto.foto_url : 'https://via.placeholder.com/250x200?text=Sem+Foto';
                    const cartao = document.createElement('div');
                    cartao.className = 'cartao-produto';
                    cartao.innerHTML = `
                        <img src="${imagem}" class="produto-img" alt="${produto.nome}">
                        <div class="produto-info">
                            <span class="produto-categoria">${produto.categoria || 'Geral'}</span>
                            <h3 class="produto-nome">${produto.nome}</h3>
                            <div class="produto-preco">R$ ${parseFloat(produto.preco).toFixed(2).replace('.', ',')}</div>
                            <button class="btn-comprar" onclick="adicionarAoCarrinho('${produto.id}')">Adicionar ao Carrinho</button>
                        </div>
                    `;
                    gradeDiv.appendChild(cartao);
                });
            } catch (erro) {
                console.error(erro);
                statusDiv.textContent = "Erro ao carregar a loja. Tente novamente.";
                statusDiv.style.color = "red";
            }
        }

        function aumentarQtd(idProduto) {
            const itemCarrinho = itensNoCarrinho.find(i => i.id === idProduto);
            const produtoBanco = produtosDaLoja.find(p => p.id === idProduto);

            if (itemCarrinho && produtoBanco) {
                if (itemCarrinho.qtd_carrinho < produtoBanco.quantidade) {
                    itemCarrinho.qtd_carrinho++;
                    atualizarInterfaceCarrinho();
                } else {
                    alert("Desculpe, atingiu o limite máximo em estoque deste produto!");
                }
            }
        }

        function diminuirQtd(idProduto) {
            const itemCarrinho = itensNoCarrinho.find(i => i.id === idProduto);
            if (itemCarrinho) {
                if (itemCarrinho.qtd_carrinho > 1) {
                    itemCarrinho.qtd_carrinho--;
                    atualizarInterfaceCarrinho();
                } else {
                    removerDoCarrinho(idProduto);
                }
            }
        }

        function adicionarAoCarrinho(idProduto) {
            const produto = produtosDaLoja.find(p => p.id === idProduto);
            if (!produto) return;
            const itemExistente = itensNoCarrinho.find(item => item.id === idProduto);
            
            if (itemExistente) {
                aumentarQtd(idProduto);
            } else {
                itensNoCarrinho.push({
                    id: produto.id,
                    nome: produto.nome,
                    preco: parseFloat(produto.preco),
                    qtd_carrinho: 1
                });
                atualizarInterfaceCarrinho();
            }
            abrirCarrinho(); 
        }

        function removerDoCarrinho(idProduto) {
            itensNoCarrinho = itensNoCarrinho.filter(item => item.id !== idProduto);
            atualizarInterfaceCarrinho();
        }

        function atualizarInterfaceCarrinho() {
            const listaDiv = document.getElementById('lista-carrinho');
            const totalDiv = document.getElementById('valor-total-carrinho');
            const contador = document.getElementById('contador-carrinho');
            const areaEntrega = document.getElementById('area-entrega');

            if (itensNoCarrinho.length === 0) {
                listaDiv.innerHTML = '<p style="text-align: center; color: #666; margin-top: 50px;">O seu carrinho está vazio.</p>';
                totalDiv.textContent = 'R$ 0,00';
                contador.textContent = '0';
                areaEntrega.style.display = 'none'; 
                return;
            }

            areaEntrega.style.display = 'flex'; 
            listaDiv.innerHTML = '';
            let valorTotal = 0;
            let totalItens = 0;

            itensNoCarrinho.forEach(item => {
                const subtotalItem = item.preco * item.qtd_carrinho;
                valorTotal += subtotalItem;
                totalItens += item.qtd_carrinho;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'item-carrinho';
                itemDiv.innerHTML = `
                    <div class="item-topo">
                        <span class="item-nome">${item.nome}</span>
                        <button class="btn-qtd remover" onclick="removerDoCarrinho('${item.id}')" title="Remover tudo">🗑️</button>
                    </div>
                    
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div class="controle-qtd">
                            <button class="btn-qtd" onclick="diminuirQtd('${item.id}')">-</button>
                            <span class="qtd-valor">${item.qtd_carrinho}</span>
                            <button class="btn-qtd" onclick="aumentarQtd('${item.id}')">+</button>
                        </div>
                        <span class="item-preco">R$ ${subtotalItem.toFixed(2).replace('.', ',')}</span>
                    </div>
                `;
                listaDiv.appendChild(itemDiv);
            });

            totalDiv.textContent = `R$ ${valorTotal.toFixed(2).replace('.', ',')}`;
            contador.textContent = totalItens;
        }

        function finalizarPedidoWhatsApp() {
            if (itensNoCarrinho.length === 0) {
                alert("Adicione produtos ao carrinho antes de finalizar!");
                return;
            }

            const nomeCliente = document.getElementById('input-cliente-nome').value.trim();
            const enderecoCliente = document.getElementById('input-cliente-endereco').value.trim();
            const pagamentoCliente = document.getElementById('input-cliente-pagamento').value;

            if (nomeCliente === "" || enderecoCliente === "" || pagamentoCliente === "") {
                alert("Por favor, preencha o seu Nome, Endereço e Forma de Pagamento para a entrega.");
                return;
            }

            let textoPedido = `*NOVO PEDIDO DA LOJA VIRTUAL*\n`;
            textoPedido += `👤 Cliente: ${nomeCliente}\n`;
            textoPedido += `📍 Entrega: ${enderecoCliente}\n`;
            textoPedido += `💳 Pagamento: ${pagamentoCliente}\n\n`;
            textoPedido += `*RESUMO DOS PRODUTOS:*\n`;
            
            let valorTotal = 0;

            itensNoCarrinho.forEach(item => {
                const subtotal = item.preco * item.qtd_carrinho;
                valorTotal += subtotal;
                textoPedido += `▪️ ${item.qtd_carrinho}x ${item.nome} - R$ ${subtotal.toFixed(2)}\n`;
            });

            textoPedido += `\n*TOTAL A PAGAR: R$ ${valorTotal.toFixed(2)}*`;

            const textoCodificado = encodeURIComponent(textoPedido);
            // NUMERO_WHATSAPP vem do supabase_config.js
            const urlWhatsApp = `https://wa.me/${NUMERO_WHATSAPP}?text=${textoCodificado}`;
            window.open(urlWhatsApp, '_blank');
        }

        function abrirCarrinho() {
            document.getElementById('modal-carrinho').classList.add('aberto');
            document.getElementById('overlay').classList.add('ativo');
        }

        function fecharCarrinho() {
            document.getElementById('modal-carrinho').classList.remove('aberto');
            document.getElementById('overlay').classList.remove('ativo');
        }

        window.onload = () => { carregarVitrine(); };
    </script>
</body>
</html>
