<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <title>Tetris Humano VR - Calistenia</title>
    <!-- Importa o A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    
    <!-- CSS para a Tela Inicial sobreposta ao 3D -->
    <style>
      #tela-inicial {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(10, 10, 10, 0.9);
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        z-index: 999; /* Garante que fique por cima do jogo */
        color: white; font-family: sans-serif;
      }
      h1 { color: #00FFFF; text-shadow: 0 0 10px #00FFFF; font-size: 3rem; text-align: center; }
      p { font-size: 1.2rem; margin-bottom: 30px; text-align: center; }
      button {
        padding: 15px 40px; font-size: 1.5rem; cursor: pointer;
        background-color: #EF2D5E; color: white;
        border: none; border-radius: 8px; font-weight: bold;
        transition: transform 0.2s;
      }
      button:active { transform: scale(0.95); }
    </style>
  </head>
  <body>
    
    <!-- INTERFACE DE USUÁRIO (TELA INICIAL) -->
    <div id="tela-inicial">
      <h1>TETRIS HUMANO VR</h1>
      <p>Prepare-se para o treino de calistenia.<br>Coloque o headset e clique em Iniciar!</p>
      <button id="btn-iniciar">INICIAR TREINO</button>
    </div>

    <!-- CENA VR -->
    <a-scene>
      <!-- GERENCIADOR DE RECURSOS -->
      <a-assets>
        <!-- Dica: Coloque um hit bem animado da Marina Sena aqui (ex: musica.mp3 na mesma pasta) para dar um ritmo perfeito ao treino! -->
        <audio id="musicaTreino" src="https://cdn.aframe.io/basic-guide/audio/backgroundnoise.wav" preload="auto"></audio>
      </a-assets>

      <!-- REPRODUTOR DE SOM (Controlado via JavaScript agora) -->
      <a-entity id="caixaDeSom" sound="src: #musicaTreino; loop: true; volume: 0.8"></a-entity>

      <!-- AMBIENTE -->
      <a-plane position="0 0 -10" rotation="-90 0 0" width="10" height="40" color="#111111"></a-plane>
      <a-sky color="#050505"></a-sky>

      <!-- A PAREDE (Obstáculo) - Velocidade reduzida de 4s para 8s -->
      <!-- Adicionamos um ID para controlar ela no futuro -->
      <a-box id="paredeAnimada" position="0 1.5 -20" width="5" height="3" depth="0.2" color="#00FFFF" opacity="0.7"
             animation="property: position; to: 0 1.5 5; dur: 8000; easing: linear; loop: true">
      </a-box>

      <!-- O JOGADOR -->
      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>

    <!-- LÓGICA DE PROGRAMAÇÃO (JavaScript) -->
    <script>
      // Aguarda o usuário clicar no botão Iniciar
      document.getElementById('btn-iniciar').addEventListener('click', function() {
        
        // 1. Esconde a tela inicial preta
        document.getElementById('tela-inicial').style.display = 'none';
        
        // 2. Dá o Play na música (agora o navegador permite, pois houve clique)
        var som = document.getElementById('caixaDeSom').components.sound;
        som.playSound();
        
      });
    </script>
  </body>
</html>
