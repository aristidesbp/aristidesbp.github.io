/* --- 2. ESCUDO DE SEGURANÇA BANCÁRIA (ANTI-XSS) E TOASTS --- */

/**
 * Limpa textos vindos do utilizador ou do banco para impedir ataques de código malicioso (XSS).
 */
function escaparHTML(texto) {
    if (texto === null || texto === undefined) return '';
    return String(texto)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

/**
 * Mostra uma notificação flutuante bonita no canto superior direito.
 * @param {string} mensagem - O texto a exibir.
 * @param {string} tipo - 'sucesso', 'erro', 'info' ou 'aviso'.
 */
function mostrarToast(mensagem, tipo = 'sucesso') {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    toast.className = `toast toast-${tipo}`;
    
    let icone = '✅';
    if (tipo === 'erro') icone = '❌';
    if (tipo === 'info') icone = 'ℹ️';
    if (tipo === 'aviso') icone = '⚠️';

    toast.innerHTML = `<span>${icone}</span> <span>${escaparHTML(mensagem)}</span>`;
    container.appendChild(toast);

    // Remove o aviso automaticamente após 4 segundos
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(120%)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
    }, 4000);
}

function tratarErroSupabase(erro, contexto = 'Operação') {
    console.error(`[Erro em ${contexto}]:`, erro);
    const msg = (erro && erro.message) ? erro.message.toLowerCase() : String(erro).toLowerCase();

    if (msg.includes('foreign key constraint')) {
        mostrarToast('Não é possível apagar este registo porque ele está vinculado a vendas, produtos ou lançamentos financeiros. Use a opção de enviar para a Lixeira!', 'aviso');
    } else if (msg.includes('duplicate key') || msg.includes('unique constraint')) {
        mostrarToast('Já existe um registo cadastrado com este Código, Documento ou E-mail.', 'aviso');
    } else if (msg.includes('invalid login credentials')) {
        mostrarToast('E-mail ou palavra-passe incorretos. Tente novamente.', 'erro');

/* --- 4. COMPRESSOR DE IMAGENS WEBP E NOMES SEGUROS --- */
function comprimirParaWebP(file, maxWidthHeight = 800) {
    return new Promise((resolve, reject) => {
        if (!file) return reject(new Error("Nenhum ficheiro fornecido."));
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                let width = img.width;
                let height = img.height;
                if (width > height) {
                    if (width > maxWidthHeight) { height = Math.round(height * (maxWidthHeight / width)); width = maxWidthHeight; }
                } else {
                    if (height > maxWidthHeight) { width = Math.round(width * (maxWidthHeight / height)); height = maxWidthHeight; }
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                canvas.toBlob((blob) => {
                    if (blob) {
                        const novoNome = file.name.replace(/\.[^/.]+$/, ".webp");
                        resolve(new File([blob], novoNome, { type: 'image/webp' }));
                    } else {
                        reject(new Error("Falha ao converter imagem para WebP."));
                    }
                }, 'image/webp', 0.8);
            };
            img.onerror = () => reject(new Error("Formato de imagem inválido."));
        };
        reader.onerror = () => reject(new Error("Erro ao ler ficheiro."));
    });
}

function gerarNomeSeguroArquivo(prefixo) {
    let nomeLimpo = (prefixo || 'arq').normalize('NFD').replace(/[\u0300-\u036f]/g, "").toLowerCase();
    nomeLimpo = nomeLimpo.replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
    return `${nomeLimpo}-${Date.now()}.webp`;
}

/* --- 6. CARREGAMENTO AUTOMÁTICO DOS DADOS DA EMPRESA --- */
async function carregarConfiguracoesEmpresa() {
    try {
        // Carrega preferências locais complementares (Margem XML e PIX)
        const configLocal = localStorage.getItem('erp_config_complementar');
        if (configLocal) {
            const parsed = JSON.parse(configLocal);
            dadosEmpresaGlobal.margem_padrao_xml = parseFloat(parsed.margem_padrao_xml) || 30;
            dadosEmpresaGlobal.chave_pix = parsed.chave_pix || '';
        }

        // Busca os dados oficiais da empresa na tabela 'entidades' (tipo = 'empresa')
        const { data, error } = await clienteSupabase
            .from('entidades')
            .select('*')
            .eq('tipo', 'empresa')
            .neq('status', 'lixeira')
            .limit(1)
            .maybeSingle();

        if (data && !error) {
            dadosEmpresaGlobal.id = data.id;
            dadosEmpresaGlobal.nome_completo = data.nome_completo || 'Minha Loja ERP';
            dadosEmpresaGlobal.numero_documento = data.numero_documento || '';
            dadosEmpresaGlobal.telefone = data.telefone || '5591999999999';
            dadosEmpresaGlobal.email = data.email || '';
            dadosEmpresaGlobal.endereco_completo = data.endereco_completo || '';
            dadosEmpresaGlobal.foto_url = data.foto_url || '';
        }
    } catch (e) {
        console.log("Aviso: Dados da empresa ainda não configurados.");
    }
}

<script>

function desenharModuloClientes() {

    appRoot.innerHTML = `

async function carregarListaEntidadesAtivas() {
    const container = document.getElementById('ent-lista-container');
    if (!container) return;

    const termo = document.getElementById('ent-busca').value.trim();
    const tipo = document.getElementById('ent-filtro-tipo').value;
    const limite = parseInt(document.getElementById('ent-itens-por-pagina').value) || 15;

    container.innerHTML = "<p style='text-align:center; color: var(--text-muted);'>⏳ A consultar Supabase...</p>";
    
    const inicio = paginaAtualEnt * limite;
    const fim = inicio + limite - 1;

    try {
        let query = clienteSupabase
            .from('entidades')
            .select('*', { count: 'exact' })
            .neq('status', 'lixeira')
            .order('nome_completo', { ascending: true })
            .range(inicio, fim);

        if (tipo) query = query.eq('tipo', tipo);
        if (termo) query = query.or(`nome_completo.ilike.%${termo}%,numero_documento.ilike.%${termo}%`);

        const { data, count, error } = await query;
        if (error) throw error;

        atualizarPaginacaoEntidades(count, limite);
        container.innerHTML = "";

        if (!data || data.length === 0) {
            container.innerHTML = "<p style='text-align:center; color: var(--text-muted);'>Nenhuma entidade encontrada.</p>";
            return;
        }

        data.forEach(ent => renderizarCartaoEntidade(ent, container, false));
    } catch (erro) {
        tratarErroSupabase(erro, "Listar Entidades");
        container.innerHTML = "<p style='text-align:center; color: var(--danger-color);'>❌ Erro ao carregar dados.</p>";
    }
}

async function carregarListaEntidadesLixeira() {
    const container = document.getElementById('ent-lista-container');
    if (!container) return;

    const termo = document.getElementById('ent-busca').value.trim();
    const tipo = document.getElementById('ent-filtro-tipo').value;
    const limite = parseInt(document.getElementById('ent-itens-por-pagina').value) || 15;

    container.innerHTML = "<p style='text-align:center; color: var(--text-muted);'>⏳ A abrir lixeira...</p>";
    
    const inicio = paginaAtualEnt * limite;
    const fim = inicio + limite - 1;

    try {
        let query = clienteSupabase
            .from('entidades')
            .select('*', { count: 'exact' })
            .eq('status', 'lixeira')
            .order('nome_completo', { ascending: true })
            .range(inicio, fim);

        if (tipo) query = query.eq('tipo', tipo);
        if (termo) query = query.or(`nome_completo.ilike.%${termo}%,numero_documento.ilike.%${termo}%`);

        const { data, count, error } = await query;
        if (error) throw error;

        atualizarPaginacaoEntidades(count, limite);
        container.innerHTML = "";

        if (!data || data.length === 0) {
            container.innerHTML = "<p style='text-align:center; color: var(--text-muted);'>A lixeira está vazia.</p>";
            return;
        }

        data.forEach(ent => renderizarCartaoEntidade(ent, container, true));
    } catch (erro) {
        tratarErroSupabase(erro, "Lixeira Entidades");
        container.innerHTML = "<p style='text-align:center; color: var(--danger-color);'>❌ Erro ao consultar lixeira.</p>";
    }
}

function renderizarCartaoEntidade(ent, container, isLixeira) {
    const card = document.createElement('div');
    card.style.cssText = `background: var(--input-bg); border: 1px solid var(--border-color); padding: 14px; border-radius: 10px; display:flex; align-items:center; gap: 14px; flex-wrap: wrap;`;

function atualizarPaginacaoEntidades(total, limite) {
    const paginas = Math.ceil(total / limite) || 1;
    document.getElementById('texto-ent-paginacao').textContent = `Página ${paginaAtualEnt + 1} de ${paginas}`;
    document.getElementById('btn-ent-ant').disabled = paginaAtualEnt === 0;
    document.getElementById('btn-ent-prox').disabled = (paginaAtualEnt + 1) >= paginas;
    document.getElementById('ent-paginacao').style.display = total > 0 ? "flex" : "none";
}

async function enviarEntidadeParaLixeira(id, nome) {
    if (!confirm(`Deseja enviar '${nome}' para a lixeira?`)) return;
    try {
        const { error } = await clienteSupabase.from('entidades').update({ status: 'lixeira' }).eq('id', id);
        if (error) throw error;
        mostrarToast("Entidade enviada para a lixeira.", "sucesso");
        carregarListaEntidadesAtivas();
    } catch (e) {
        tratarErroSupabase(e, "Ocultar Entidade");
    }
}

async function restaurarEntidade(id) {
    try {
        const { error } = await clienteSupabase.from('entidades').update({ status: 'ativo' }).eq('id', id);
        if (error) throw error;
        mostrarToast("Entidade restaurada com sucesso!", "sucesso");
        carregarListaEntidadesLixeira();
    } catch (e) {
        tratarErroSupabase(e, "Restaurar Entidade");
    }
}

async function esvaziarLixeiraEntidadesDefinitivo() {
    if (!confirm("AVISO: Esta ação irá apagar definitivamente todas as entidades na lixeira e as respetivas fotos. Deseja continuar?")) return;
    try {
        const { data: itensLixeira } = await clienteSupabase.from('entidades').select('foto_url').eq('status', 'lixeira');
        
        const { error } = await clienteSupabase.from('entidades').delete().eq('status', 'lixeira');
        if (error) throw error;

        if (itensLixeira && itensLixeira.length > 0) {
            const fotosParaRemover = itensLixeira
                .filter(i => i.foto_url)
                .map(i => decodeURIComponent(i.foto_url.split('/').pop().split('?')[0]));
            if (fotosParaRemover.length > 0) {
                await clienteSupabase.storage.from('foto_entidades').remove(fotosParaRemover);
            }
        }

        mostrarToast("Lixeira de entidades purgada definitivamente.", "sucesso");
        carregarListaEntidadesLixeira();
    } catch (e) {
        tratarErroSupabase(e, "Purgar Lixeira");
    }
}

                        <input type="text" id="ent-documento" placeholder="000.000.000-00">

        const btn = document.getElementById('btn-salvar-ent');
        btn.textContent = "⏳ A gravar...";
        btn.disabled = true;

        let urlFinalFoto = urlFotoAntiga;
        let novoNomeArq = null;

        try {
            if (ficheiroNovo) {
                const imgComp = await comprimirParaWebP(ficheiroNovo, 600);
                novoNomeArq = gerarNomeSeguroArquivo(document.getElementById('ent-nome').value);
                const { error: upErr } = await clienteSupabase.storage.from('foto_entidades').upload(novoNomeArq, imgComp);
                if (upErr) throw upErr;
                urlFinalFoto = clienteSupabase.storage.from('foto_entidades').getPublicUrl(novoNomeArq).data.publicUrl;
            }

            const payload = {
                tipo: document.getElementById('ent-tipo').value,
                nome_completo: document.getElementById('ent-nome').value.trim(),
                tipo_documento: document.getElementById('ent-tipo-doc').value,
                numero_documento: document.getElementById('ent-documento').value.trim(),
                telefone: document.getElementById('ent-telefone').value.trim(),
                email: document.getElementById('ent-email').value.trim(),
                endereco_completo: document.getElementById('ent-endereco').value.trim(),
                foto_url: urlFinalFoto,
                status: 'ativo'
            };

            if (idEdicao) {
                const { error } = await clienteSupabase.from('entidades').update(payload).eq('id', idEdicao);
                if (error) throw error;
                if (urlFotoAntiga && novoNomeArq && urlFotoAntiga !== urlFinalFoto) {
                    const velho = decodeURIComponent(urlFotoAntiga.split('/').pop().split('?')[0]);
                    await clienteSupabase.storage.from('foto_entidades').remove([velho]);
                }
            } else {
                const { error } = await clienteSupabase.from('entidades').insert([payload]);
                if (error) throw error;
            }

            mostrarToast("Entidade gravada com sucesso!", "sucesso");
            desenharModuloClientes();
        } catch (erro) {
            if (novoNomeArq) await clienteSupabase.storage.from('foto_entidades').remove([novoNomeArq]);
            tratarErroSupabase(erro, "Salvar Entidade");
            btn.textContent = "💾 Salvar Entidade";
            btn.disabled = false;
        }
    });
}

<script>

let paginaAtualFin = 0;
const ITENS_PAG_FIN = 15;

function desenharModuloFinanceiro() {
    paginaAtualFin = 0;
    appRoot.innerHTML = `
        <div class="card" style="margin-top: 4vh; max-width: 850px;">

async function carregarListaFinanceiro() {
    const container = document.getElementById('fin-lista-container');
    if (!container) return;

    const tipo = document.getElementById('fin-tipo').value;
    const status = document.getElementById('fin-status').value;
    const termo = document.getElementById('fin-busca').value.trim();

    container.innerHTML = "<p style='text-align:center; color: var(--text-muted);'>⏳ A consultar Supabase...</p>";
    const inicio = paginaAtualFin * ITENS_PAG_FIN;
    const fim = inicio + ITENS_PAG_FIN - 1;

    try {
        let query = clienteSupabase
            .from('fin_contas')
            .select('*, entidades(nome_completo)', { count: 'exact' })
            .order('data_vencimento', { ascending: true })
            .range(inicio, fim);

        if (tipo) query = query.eq('tipo_conta', tipo);
        if (status) query = query.eq('status_conta', status);
        if (termo) query = query.ilike('descricao', `%${termo}%`);

        const { data, count, error } = await query;
        if (error) throw error;

        const paginas = Math.ceil(count / ITENS_PAG_FIN) || 1;
        document.getElementById('texto-fin-paginacao').textContent = `Página ${paginaAtualFin + 1} de ${paginas}`;
        document.getElementById('btn-fin-ant').disabled = paginaAtualFin === 0;
        document.getElementById('btn-fin-prox').disabled = (paginaAtualFin + 1) >= paginas;
        document.getElementById('fin-paginacao').style.display = count > 0 ? "flex" : "none";

        container.innerHTML = "";
        if (!data || data.length === 0) {
            container.innerHTML = "<p style='text-align:center; color: var(--text-muted);'>Nenhum registo financeiro encontrado.</p>";
            return;
        }

        data.forEach(fin => {
            const isEntrada = fin.tipo_conta === 'entrada' || fin.tipo_conta === 'receita';
            const cor = isEntrada ? 'var(--success-color)' : 'var(--danger-color)';
            const sinal = isEntrada ? '+' : '-';
            const valor = parseFloat(fin.valor_nominal || 0).toFixed(2);
            const nomeEntidade = fin.entidades ? fin.entidades.nome_completo : 'Geral';

            const card = document.createElement('div');
            card.style.cssText = `background: var(--input-bg); border-left: 5px solid ${cor}; padding: 14px; border-radius: 8px; display:flex; align-items:center; gap: 14px; flex-wrap:wrap;`;
            card.innerHTML = `
                <div style="flex-grow: 1; min-width: 200px;">
                    <strong style="color: var(--text-main); font-size: 1.05em;">${escaparHTML(fin.descricao)}</strong> <span style="font-size:0.8em; color:var(--text-muted);">(${fin.numero_parcela || 1}/${fin.total_parcelas || 1})</span><br>
                    <span style="color: var(--text-muted); font-size: 0.85em;">Entidade: ${escaparHTML(nomeEntidade)}</span><br>
                    <div style="margin-top: 6px; display:flex; gap: 10px; align-items:center; flex-wrap:wrap;">
                        <span style="color: ${cor}; font-weight:bold; font-size: 1.1em;">${sinal} R$ ${valor}</span>
                        <span class="badge-status" style="background: ${fin.status_conta === 'quitada' ? 'var(--success-color)' : 'var(--warning-color)'}; color:#fff;">${fin.status_conta}</span>
                        <span style="color: var(--text-muted); font-size: 0.82em;">📅 Venc: ${fin.data_vencimento ? fin.data_vencimento.split('-').reverse().join('/') : '-'}</span>
                    </div>

                <label>Entidade Vinculada</label>
                <select id="fin-entidade"><option value="">Selecione...</option></select>

                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 120px;">
                        <label>Valor Nominal (R$) *</label>
                        <input type="number" id="fin-valor" step="0.01" required placeholder="0.00">
                    </div>
                    <div style="flex: 1; min-width: 120px;">
                        <label>Qtd. Parcelas *</label>
                        <input type="number" id="fin-parcelas" min="1" max="60" value="1" required ${idEdicao ? 'disabled' : ''}>
                    </div>
                    <div style="flex: 1; min-width: 140px;">
                        <label>Data Vencimento *</label>
                        <input type="date" id="fin-vencimento" required>
                    </div>
                </div>

                <button type="submit" id="btn-salvar-fin" class="btn-neon" style="margin-top: 15px;">💾 Salvar Lançamento</button>
                <button type="button" class="btn-secundario" onclick="desenharModuloFinanceiro()">❌ Cancelar</button>
            </form>
        </div>
    `;

    try {
        const { data: ents } = await clienteSupabase.from('entidades').select('id, nome_completo, tipo').neq('status', 'lixeira').order('nome_completo');
        const sel = document.getElementById('fin-entidade');
        if (ents) ents.forEach(e => sel.innerHTML += `<option value="${e.id}">${escaparHTML(e.nome_completo)} (${e.tipo})</option>`);
    } catch(e) {}

    if (idEdicao) {
        document.getElementById('btn-salvar-fin').textContent = "⏳ A carregar...";
        const { data, error } = await clienteSupabase.from('fin_contas').select('*').eq('id', idEdicao).single();
        if (data && !error) {
            document.getElementById('fin-tipo-conta').value = data.tipo_conta || 'saida';
            document.getElementById('fin-status-conta').value = data.status_conta || 'pendente';
            document.getElementById('fin-desc').value = data.descricao || '';
            document.getElementById('fin-entidade').value = data.entidade_id || '';
            document.getElementById('fin-valor').value = data.valor_nominal || '';
            document.getElementById('fin-parcelas').value = data.total_parcelas || 1;
            document.getElementById('fin-vencimento').value = data.data_vencimento || '';
        }
        document.getElementById('btn-salvar-fin').textContent = "💾 Atualizar Lançamento";
    }

    document.getElementById('form-financeiro').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-salvar-fin');
        btn.textContent = "⏳ A gravar...";
        btn.disabled = true;

        try {
            const tipo = document.getElementById('fin-tipo-conta').value;
            const status = document.getElementById('fin-status-conta').value;
            const desc = document.getElementById('fin-desc').value.trim();
            const entidadeId = document.getElementById('fin-entidade').value || null;
            const valorTotal = parseFloat(document.getElementById('fin-valor').value) || 0;
            const qtdParcelas = parseInt(document.getElementById('fin-parcelas').value) || 1;
            let dataBase = document.getElementById('fin-vencimento').value;

            if (idEdicao) {
                const { error } = await clienteSupabase.from('fin_contas').update({
                    tipo_conta: tipo,
                    status_conta: status,
                    descricao: desc,
                    entidade_id: entidadeId,
                    valor_nominal: valorTotal,
                    data_vencimento: dataBase
                }).eq('id', idEdicao);
                if (error) throw error;
            } else {
                let arrayLancamentos = [];
                const valorParcela = valorTotal / qtdParcelas;
                for (let i = 1; i <= qtdParcelas; i++) {
                    let d = new Date(dataBase + 'T12:00:00');
                    d.setMonth(d.getMonth() + (i - 1));
                    arrayLancamentos.push({
                        tipo_conta: tipo,
                        status_conta: status,
                        descricao: qtdParcelas > 1 ? `${desc} (${i}/${qtdParcelas})` : desc,
                        entidade_id: entidadeId,
                        valor_nominal: valorParcela,
                        data_emissao: new Date().toISOString().split('T')[0],
                        data_vencimento: d.toISOString().split('T')[0],
                        numero_parcela: i,
                        total_parcelas: qtdParcelas
                    });
                }
                const { error } = await clienteSupabase.from('fin_contas').insert(arrayLancamentos);
                if (error) throw error;
            }

            mostrarToast("Lançamento financeiro gravado com sucesso!", "sucesso");
            desenharModuloFinanceiro();
        } catch (erro) {
            tratarErroSupabase(erro, "Salvar Financeiro");
            btn.textContent = "💾 Salvar Lançamento";
            btn.disabled = false;
        }
    });
}

async function adicionarProdutoCarrinhoPdv(termo) {
    try {
        const { data, error } = await clienteSupabase
            .from('produtos')
            .select('*')
            .eq('esta_ativo', true)
            .or(`codigo_barras.eq.${termo},sku.eq.${termo},nome.ilike.%${termo}%`)
            .limit(1)
            .maybeSingle();

        if (error || !data) {
            mostrarToast("Produto não encontrado no catálogo.", "aviso");
            return;
        }

        const existente = carrinhoPdv.find(p => p.id === data.id);
        if (existente) {
            existente.quantidade += 1;
            existente.subtotal = existente.quantidade * existente.preco_venda;
        } else {
            carrinhoPdv.push({
                id: data.id,
                nome: data.nome,
                preco_venda: parseFloat(data.preco_venda || 0),
                quantidade: 1,
                subtotal: parseFloat(data.preco_venda || 0),
                estoque_atual: parseFloat(data.estoque_atual || 0)
            });
        }

        renderizarCarrinhoPdv();
        mostrarToast(`${data.nome} adicionado.`, "sucesso");
    } catch (e) {
        tratarErroSupabase(e, "Adicionar ao Carrinho");
    }
}

function renderizarCarrinhoPdv() {
    const container = document.getElementById('pdv-carrinho-itens');
    if (!container) return;

    if (carrinhoPdv.length === 0) {
        container.innerHTML = `<p style='text-align:center; color: var(--text-muted); margin-top: 40px;'>Carrinho vazio. Bipe um produto ou pesquise acima.</p>`;
        document.getElementById('pdv-total-geral').textContent = "R$ 0,00";
        return;
    }

    let html = '';
    let totalGeral = 0;

    carrinhoPdv.forEach((item, index) => {
        totalGeral += item.subtotal;
        html += `
            <div style="background: var(--input-bg); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <strong style="font-size: 0.95em; color: var(--text-main);">${escaparHTML(item.nome)}</strong><br>
                    <span style="font-size: 0.82em; color: var(--text-muted);">${item.quantidade}x R$ ${item.preco_venda.toFixed(2)} = <strong>R$ ${item.subtotal.toFixed(2)}</strong></span>
                </div>
                <div style="display:flex; gap:5px;">
                    <button onclick="alterarQtdCarrinho(${index}, 1)" style="background:var(--info-color); color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">➕</button>
                    <button onclick="alterarQtdCarrinho(${index}, -1)" style="background:var(--warning-color); color:#000; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">➖</button>
                </div>
            </div>
        `;
    });

    container.innerHTML = html;
    document.getElementById('pdv-total-geral').textContent = `R$ ${totalGeral.toFixed(2)}`;
    calcularTrocoPdv();
}

window.alterarQtdCarrinho = function(index, delta) {
    carrinhoPdv[index].quantidade += delta;
    if (carrinhoPdv[index].quantidade <= 0) {
        carrinhoPdv.splice(index, 1);
    } else {
        carrinhoPdv[index].subtotal = carrinhoPdv[index].quantidade * carrinhoPdv[index].preco_venda;
    }
    renderizarCarrinhoPdv();
};

function calcularTrocoPdv() {
    const total = carrinhoPdv.reduce((acc, item) => acc + item.subtotal, 0);
    const recebido = parseFloat(document.getElementById('pdv-valor-recebido')?.value) || 0;
    const troco = recebido - total;
    const elTroco = document.getElementById('pdv-troco-calc');
    if (elTroco) {
        elTroco.textContent = troco >= 0 ? `R$ ${troco.toFixed(2)}` : "R$ 0,00 (Falta Dinheiro)";
    }
}

async function finalizarVendaPdv() {
    if (carrinhoPdv.length === 0) return mostrarToast("O carrinho está vazio.", "aviso");

    const totalGeral = carrinhoPdv.reduce((acc, item) => acc + item.subtotal, 0);
    const formaPgto = document.getElementById('pdv-forma-pgto').value;
    const valorRecebido = parseFloat(document.getElementById('pdv-valor-recebido').value) || totalGeral;


    // NOVO CÓDIGO (Adicionar imediatamente ABAIXO das linhas superiores e ACIMA das linhas inferiores)
    const clienteId = document.getElementById('pdv-cliente').value || null;
    const isEntrega = document.getElementById('pdv-is-entrega').checked;
    const enderecoEntrega = document.getElementById('pdv-endereco-entrega').value.trim();

    // Validação de segurança: Obriga a digitar a morada se pedir entrega
    if (isEntrega && !enderecoEntrega) {
        return mostrarToast("Por favor, digite a morada completa para a entrega.", "aviso");
    }


    if (valorRecebido < totalGeral) {
        return mostrarToast("O valor recebido é inferior ao total da compra.", "aviso");
    }

    const btn = document.getElementById('btn-finalizar-venda');
    btn.textContent = "⏳ A processar venda...";
    btn.disabled = true;

    try {
        // 1. Cria o registo da venda



      // NOVO CÓDIGO
        const { data: venda, error: errVenda } = await clienteSupabase
            .from('pdv_vendas')
            .insert([{
                turno_id: turnoAtivoGlobal.id,
                cliente_id: clienteId, // Injeta o ID do cliente selecionado
                total_bruto: totalGeral,
                total_desconto: 0,
                total_liquido: totalGeral,
                status: 'concluida',
                forma_pagamento: formaPgto
            }])
            .select('id, numero_pedido')
            .single();





        if (errVenda) throw errVenda;

        // 2. Insere os itens da venda e dá baixa no stock
        for (const item of carrinhoPdv) {
            await clienteSupabase.from('pdv_itens_venda').insert([{
                venda_id: venda.id,
                produto_id: item.id,
                quantidade: item.quantidade,
                preco_unitario: item.preco_venda,
                subtotal: item.subtotal
            }]);

            // Atualiza stock do produto
            const novoEstoque = item.estoque_atual - item.quantidade;
            await clienteSupabase.from('produtos').update({ estoque_atual: novoEstoque }).eq('id', item.id);
        }

        // 3. Regista o pagamento no financeiro de vendas
        const troco = valorRecebido - totalGeral;
        await clienteSupabase.from('fin_pagamentos_venda').insert([{
            venda_id: venda.id,
            turno_id: turnoAtivoGlobal.id,
            metodo: formaPgto,
            valor_pago: valorRecebido,
            troco: troco
        }]);

        // 4. Cria título no Contas a Receber (fin_contas)
        await clienteSupabase.from('fin_contas').insert([{
            tipo_conta: 'entrada',
            status_conta: 'quitada',
            descricao: `Venda PDV #${venda.id.split('-')[0].toUpperCase()}`,
            valor_nominal: totalGeral,
            valor_pago: totalGeral,
            data_emissao: new Date().toISOString().split('T')[0],
            data_vencimento: new Date().toISOString().split('T')[0],
            data_pagamento: new Date().toISOString().split('T')[0],
            numero_parcela: 1,
            total_parcelas: 1
        }]);

// NOVO CÓDIGO (Adicionar imediatamente ABAIXO das linhas superiores e ACIMA das linhas inferiores)
        // 5. Automação de Delivery: Se a opção de entrega foi marcada, cria o log
        if (isEntrega) {
            await clienteSupabase.from('log_entregas').insert([{
                venda_id: venda.id,
                endereco_entrega: enderecoEntrega,
                status_entrega: 'pendente'
            }]);
        }


        mostrarToast("Venda finalizada com sucesso!", "sucesso");
        imprimirCupomTermico(venda.id, totalGeral, valorRecebido, troco, formaPgto);
        desenharTelaCaixaOperacao();
    } catch (e) {
        tratarErroSupabase(e, "Finalizar Venda");
        btn.textContent = "✅ Finalizar Venda";
        btn.disabled = false;
    }
}

<script>

/* =========================================================

let paginaAtualProd = 0;
let exibindoLixeiraProd = false;

function desenharModuloProdutos() {
    paginaAtualProd = 0;
    exibindoLixeiraProd = false;
    
    appRoot.innerHTML = `
        <div class="card" style="margin-top: 4vh; max-width: 850px;">

    document.getElementById('btn-novo-produto').addEventListener('click', () => desenharModuloCadastrarProduto());

    document.getElementById('btn-ver-lixeira-prod').addEventListener('click', () => {
        exibindoLixeiraProd = !exibindoLixeiraProd;
        paginaAtualProd = 0;

        const btnVer = document.getElementById('btn-ver-lixeira-prod');
        const btnNovo = document.getElementById('btn-novo-produto');
        const btnXml = document.getElementById('btn-importar-xml');
        const btnEsvaziar = document.getElementById('btn-esvaziar-lixeira-prod');
        const titulo = document.getElementById('prod-titulo-painel');

        if (exibindoLixeiraProd) {
            btnVer.textContent = "📦 Ver Catálogo";
            btnVer.className = "btn-neon";
            titulo.textContent = "🗑️ Lixeira de Produtos";

    let timerBusca;
    const dispararBuscaProd = () => {
        clearTimeout(timerBusca);
        paginaAtualProd = 0;
        timerBusca = setTimeout(() => {
            exibindoLixeiraProd ? carregarListaProdutosLixeira() : carregarListaProdutosAtivos();
        }, 400);
    };

    document.getElementById('prod-busca').addEventListener('input', dispararBuscaProd);
    document.getElementById('prod-itens-por-pagina').addEventListener('change', dispararBuscaProd);

    document.getElementById('btn-scan-busca-prod').addEventListener('click', () => {

        });
    });

async function carregarListaProdutosAtivos() {
    const container = document.getElementById('prod-lista-container');
    if (!container) return;

    const termo = document.getElementById('prod-busca').value.trim();
    const limite = parseInt(document.getElementById('prod-itens-por-pagina').value) || 15;

    container.innerHTML = "<p style='text-align:center; color: var(--text-muted);'>⏳ A consultar Supabase...</p>";
    const inicio = paginaAtualProd * limite;
    const fim = inicio + limite - 1;

    try {
        let query = clienteSupabase
            .from('produtos')
            .select('*', { count: 'exact' })
            .eq('esta_ativo', true)
            .order('nome', { ascending: true })
            .range(inicio, fim);

        if (termo) {
            query = query.or(`nome.ilike.%${termo}%,codigo_barras.ilike.%${termo}%,sku.ilike.%${termo}%`);
        }

        const { data, count, error } = await query;
        if (error) throw error;

        atualizarPaginacaoProdutos(count, limite);
        container.innerHTML = "";

        if (!data || data.length === 0) {
            container.innerHTML = "<p style='text-align:center; color: var(--text-muted);'>Nenhum produto encontrado no catálogo.</p>";
            return;
        }

        data.forEach(prod => renderizarCartaoProduto(prod, container, false));
    } catch (e) {
        tratarErroSupabase(e, "Listar Produtos");
        container.innerHTML = "<p style='text-align:center; color: var(--danger-color);'>❌ Erro ao carregar produtos.</p>";
    }
}

async function carregarListaProdutosLixeira() {
    const container = document.getElementById('prod-lista-container');
    if (!container) return;

    const termo = document.getElementById('prod-busca').value.trim();
    const limite = parseInt(document.getElementById('prod-itens-por-pagina').value) || 15;

    container.innerHTML = "<p style='text-align:center; color: var(--text-muted);'>⏳ A abrir lixeira...</p>";
    const inicio = paginaAtualProd * limite;
    const fim = inicio + limite - 1;

    try {
        let query = clienteSupabase
            .from('produtos')
            .select('*', { count: 'exact' })
            .eq('esta_ativo', false)
            .order('nome', { ascending: true })
            .range(inicio, fim);

        if (termo) query = query.ilike('nome', `%${termo}%`);

        const { data, count, error } = await query;
        if (error) throw error;

        atualizarPaginacaoProdutos(count, limite);
        container.innerHTML = "";

        if (!data || data.length === 0) {
            container.innerHTML = "<p style='text-align:center; color: var(--text-muted);'>A lixeira de produtos está vazia.</p>";
            return;
        }

        data.forEach(prod => renderizarCartaoProduto(prod, container, true));
    } catch (e) {
        tratarErroSupabase(e, "Lixeira Produtos");
        container.innerHTML = "<p style='text-align:center; color: var(--danger-color);'>❌ Erro ao consultar lixeira.</p>";
    }
}

function renderizarCartaoProduto(prod, container, isLixeira) {
    const card = document.createElement('div');
    card.style.cssText = `background: var(--input-bg); border: 1px solid var(--border-color); padding: 14px; border-radius: 10px; display:flex; align-items:center; gap: 14px; flex-wrap: wrap;`;
    
    const foto = prod.foto_url || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>';
    const preco = parseFloat(prod.preco_venda || 0).toFixed(2);
    
    const info = document.createElement('div');
    info.style.flexGrow = '1';
    info.style.minWidth = '200px';
    info.innerHTML = `
        <strong style="font-size: 1.05em; color: var(--text-main);">${escaparHTML(prod.nome)}</strong><br>
        <span class="badge-status" style="background: var(--success-color); color: #fff;">R$ ${preco}</span>
        <span class="badge-status" style="background: var(--info-color); color: #fff; margin-left: 5px;">Qtd: ${prod.estoque_atual || 0}</span>
        <span style="color: var(--text-muted); font-size: 0.82em; display:block; margin-top:4px;">EAN: ${escaparHTML(prod.codigo_barras || 'S/N')} | Cat: ${escaparHTML(prod.categoria || 'Geral')}</span>
    `;

    const acoes = document.createElement('div');
    acoes.style.display = 'flex';
    acoes.style.gap = '6px';
    acoes.style.flexWrap = 'wrap';

    if (isLixeira) {
        const btnRest = document.createElement('button');
        btnRest.textContent = "♻️ Restaurar";
        btnRest.style.cssText = "width: auto; padding: 8px 12px; font-size: 0.85em; background: var(--success-color); color: #fff; border:none; border-radius:6px; cursor:pointer;";
        btnRest.onclick = () => restaurarProduto(prod.id);
        acoes.appendChild(btnRest);
    } else {
        const btnEdit = document.createElement('button');
        btnEdit.textContent = "✏️ Editar";
        btnEdit.className = "btn-secundario";
        btnEdit.style.cssText = "width: auto; padding: 8px 10px; font-size: 0.85em;";
        btnEdit.onclick = () => desenharModuloCadastrarProduto(prod.id);

        const btnOcultar = document.createElement('button');
        btnOcultar.textContent = "🗑️ Ocultar";
        btnOcultar.className = "btn-perigo";
        btnOcultar.style.cssText = "width: auto; padding: 8px 10px; font-size: 0.85em;";
        btnOcultar.onclick = () => enviarProdutoParaLixeira(prod.id, prod.nome);

        acoes.appendChild(btnEdit);
        acoes.appendChild(btnOcultar);
    }

    card.innerHTML = `<img src="${escaparHTML(foto)}" style="width: 55px; height: 55px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-color);">`;
    card.appendChild(info);
    card.appendChild(acoes);
    container.appendChild(card);
}

function atualizarPaginacaoProdutos(total, limite) {
    const paginas = Math.ceil(total / limite) || 1;
    document.getElementById('texto-prod-paginacao').textContent = `Página ${paginaAtualProd + 1} de ${paginas}`;
    document.getElementById('btn-prod-ant').disabled = paginaAtualProd === 0;
    document.getElementById('btn-prod-prox').disabled = (paginaAtualProd + 1) >= paginas;
    document.getElementById('prod-paginacao').style.display = total > 0 ? "flex" : "none";
}

async function enviarProdutoParaLixeira(id, nome) {
    if (!confirm(`Deseja enviar '${nome}' para a lixeira?`)) return;
    try {
        const { error } = await clienteSupabase.from('produtos').update({ esta_ativo: false }).eq('id', id);
        if (error) throw error;
        mostrarToast("Produto enviado para a lixeira.", "sucesso");
        carregarListaProdutosAtivos();
    } catch (e) {
        tratarErroSupabase(e, "Ocultar Produto");
    }
}

async function restaurarProduto(id) {
    try {
        const { error } = await clienteSupabase.from('produtos').update({ esta_ativo: true }).eq('id', id);
        if (error) throw error;
        mostrarToast("Produto restaurado para o catálogo!", "sucesso");
        carregarListaProdutosLixeira();
    } catch (e) {
        tratarErroSupabase(e, "Restaurar Produto");
    }
}

async function esvaziarLixeiraProdutosDefinitivo() {
    if (!confirm("AVISO: Esta ação irá apagar definitivamente os produtos inativos e as respetivas fotos do servidor. Deseja continuar?")) return;
    try {
        const { data: fotos } = await clienteSupabase.from('produtos').select('foto_url').eq('esta_ativo', false);
        const { error } = await clienteSupabase.from('produtos').delete().eq('esta_ativo', false);
        if (error) throw error;

        if (fotos && fotos.length > 0) {
            const arr = fotos.filter(f => f.foto_url).map(f => decodeURIComponent(f.foto_url.split('/').pop().split('?')[0]));
            if (arr.length > 0) await clienteSupabase.storage.from('foto_produtos').remove(arr);
        }

        mostrarToast("Lixeira de produtos purgada com sucesso.", "sucesso");
        carregarListaProdutosLixeira();
    } catch (e) {
        tratarErroSupabase(e, "Purgar Lixeira Produtos");
    }
}

                p_quantidade: parseFloat(document.getElementById('prod-estoque').value) || 0,
                p_preco_custo: parseFloat(document.getElementById('prod-custo').value) || 0,
                p_categoria: document.getElementById('prod-categoria').value.trim() || null,
                p_fornecedor: document.getElementById('prod-fornecedor').value || null
            };

            // ✅ Truque Monolítico: Como a função RPC não foi criada para receber o "visivel_vitrine", 
            // fazemos um update imediato à tabela após a criação/edição.
            if (idEdicao) {
                payload.p_id = idEdicao;
                const { error } = await clienteSupabase.rpc('atualizar_produto_seguro', payload);
                if (error) throw error;
                
                await clienteSupabase.from('produtos').update({ visivel_vitrine: isVisivel }).eq('id', idEdicao);
            } else {
                // Recupera o ID gerado pelo novo produto
                const { data: novoId, error } = await clienteSupabase.rpc('adicionar_produto_seguro', payload);
                if (error) throw error;
                
                await clienteSupabase.from('produtos').update({ visivel_vitrine: isVisivel }).eq('id', novoId);
            }

            mostrarToast("Produto guardado com sucesso!", "sucesso");
            desenharModuloProdutos();
        } catch (erro) {
            if (novoArq) await clienteSupabase.storage.from('foto_produtos').remove([novoArq]);
            tratarErroSupabase(erro, "Salvar Produto");
            btn.textContent = "💾 Salvar Produto";
            btn.disabled = false;
        }
    });
    
}


    
/* --- MÓDULO INTELIGENTE DE IMPORTAÇÃO DE XML (NF-e) --- */
function desenharModuloImportarXml() {
    appRoot.innerHTML = `
        <div class="card" style="margin-top: 5vh; max-width: 650px;">
            <div class="titulo">📥 Importar Nota Fiscal (XML)</div>
            <p style="color: var(--text-muted); font-size: 0.9em; text-align: center; margin-top: -10px; margin-bottom: 20px;">
                Carrega o ficheiro <strong>.xml</strong> da NF-e para dar entrada automática no stock, atualizar custos e cadastrar o fornecedor.
            </p>

            <div style="border: 2px dashed var(--accent-neon); padding: 30px; border-radius: 12px; text-align: center; background: rgba(0,0,0,0.15); margin-bottom: 20px;">
                <input type="file" id="input-arquivo-xml" accept=".xml" style="display: none;">
                <label for="input-arquivo-xml" class="btn-neon" style="display: inline-block; width: auto; padding: 12px 25px; cursor: pointer; margin: 0;">📂 Selecionar Ficheiro XML</label>
                <p id="xml-nome-arquivo" style="margin-top: 15px; color: var(--text-muted); font-size: 0.9em;">Nenhum ficheiro selecionado</p>
            </div>

            <div id="xml-preview-container" style="display: none; margin-bottom: 20px;">
                <h4 style="color: var(--accent-neon); border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">Resumo da Nota Detetada</h4>
                <p><strong>Emitente / Fornecedor:</strong> <span id="xml-resumo-forn">-</span></p>
                <p><strong>CNPJ:</strong> <span id="xml-resumo-cnpj">-</span></p>
                <p><strong>Chave da Nota:</strong> <span id="xml-resumo-chave" style="font-size: 0.85em; word-break: break-all;">-</span></p>
                <p><strong>Itens Encontrados:</strong> <span id="xml-resumo-qtd">0</span> produtos</p>
                
                <button id="btn-processar-xml" class="btn-sucesso" style="margin-top: 15px;">🚀 Confirmar e Importar Produtos para o Stock</button>
            </div>

            <button type="button" class="btn-secundario" onclick="desenharModuloProdutos()">⬅️ Voltar ao Catálogo</button>
        </div>
    `;

    let dadosXmlProcessados = null;

    document.getElementById('input-arquivo-xml').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('xml-nome-arquivo').textContent = file.name;
        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(event.target.result, "text/xml");

                // 1. Ler dados do Emitente (Fornecedor)
                const emit = xmlDoc.getElementsByTagName("emit")[0] || xmlDoc.getElementsByTagName("TNFE.emit")[0];
                if (!emit) throw new Error("Estrutura de emitente não encontrada no XML.");

                const nomeForn = emit.getElementsByTagName("xNome")[0]?.textContent || "Fornecedor Desconhecido";
                const cnpjForn = emit.getElementsByTagName("CNPJ")[0]?.textContent || "";

                // 2. Ler Chave da NFe
                const infNFe = xmlDoc.getElementsByTagName("infNFe")[0];
                const chaveNFe = infNFe ? infNFe.getAttribute("Id") : "";

                // 3. Ler Itens (Produtos)
                const dets = xmlDoc.getElementsByTagName("det");
                if (dets.length === 0) throw new Error("Nenhum item detetado na nota fiscal.");

                let itensArray = [];
                for (let i = 0; i < dets.length; i++) {
                    const prod = dets[i].getElementsByTagName("prod")[0];
                    const cProd = prod.getElementsByTagName("cProd")[0]?.textContent || '';
                    const cEAN = prod.getElementsByTagName("cEAN")[0]?.textContent || '';
                    const xProd = prod.getElementsByTagName("xProd")[0]?.textContent || 'Produto sem nome';
                    const NCM = prod.getElementsByTagName("NCM")[0]?.textContent || '';
                    const CFOP = prod.getElementsByTagName("CFOP")[0]?.textContent || '';
                    const uCom = prod.getElementsByTagName("uCom")[0]?.textContent || 'UN';
                    const qCom = parseFloat(prod.getElementsByTagName("qCom")[0]?.textContent || 1);
                    const vUnCom = parseFloat(prod.getElementsByTagName("vUnCom")[0]?.textContent || 0);

                    // Calcula preço de venda aplicando a margem cadastrada nas configurações da empresa
                    const margem = (dadosEmpresaGlobal.margem_padrao_xml || 30) / 100;
                    const precoVendaSugerido = vUnCom * (1 + margem);

                    itensArray.push({
                        sku: cProd,
                        ean: (cEAN && cEAN !== 'SEM GTIN') ? cEAN : null,
                        nome: xProd,
                        ncm: NCM,
                        cfop: CFOP,
                        unidade: uCom,
                        quantidade: qCom,
                        preco_custo: vUnCom,
                        preco_venda: parseFloat(precoVendaSugerido.toFixed(2))
                    });
                }

                dadosXmlProcessados = {
                    fornecedor: { nome: nomeForn, cnpj: cnpjForn },
                    chave: chaveNFe,
                    itens: itensArray
                };

                document.getElementById('xml-resumo-forn').textContent = nomeForn;
                document.getElementById('xml-resumo-cnpj').textContent = cnpjForn;
                document.getElementById('xml-resumo-chave').textContent = chaveNFe;
                document.getElementById('xml-resumo-qtd').textContent = itensArray.length;
                document.getElementById('xml-preview-container').style.display = 'block';

                mostrarToast("XML lido com sucesso! Verifique o resumo.", "sucesso");
            } catch (err) {
                tratarErroSupabase(err, "Leitura do XML");
            }
        };
        reader.readAsText(file);
    });

    document.getElementById('btn-processar-xml')?.addEventListener('click', async () => {
        if (!dadosXmlProcessados) return;
        const btn = document.getElementById('btn-processar-xml');
        btn.textContent = "⏳ A importar para o stock...";
        btn.disabled = true;

        try {
            // 1. Verifica ou cadastra o fornecedor automaticamente
            let fornecedorId = null;
            if (dadosXmlProcessados.fornecedor.cnpj) {
                const { data: fornExistente } = await clienteSupabase
                    .from('entidades')
                    .select('id')
                    .eq('numero_documento', dadosXmlProcessados.fornecedor.cnpj)
                    .maybeSingle();

                if (fornExistente) {
                    fornecedorId = fornExistente.id;
                } else {
                    const { data: novoForn, error: errForn } = await clienteSupabase
                        .from('entidades')
                        .insert([{
                            tipo: 'fornecedor',
                            nome_completo: dadosXmlProcessados.fornecedor.nome,
                            tipo_documento: 'CNPJ',
                            numero_documento: dadosXmlProcessados.fornecedor.cnpj,
                            status: 'ativo'
                        }])
                        .select('id')
                        .single();
                    if (!errForn && novoForn) fornecedorId = novoForn.id;
                }
            }

            // 2. Processa cada item do XML usando a função RPC existente no Supabase
            let itensImportados = 0;
            for (const item of dadosXmlProcessados.itens) {
                // Tenta encontrar produto existente por EAN ou SKU
                let produtoExistente = null;
                if (item.ean) {
                    const { data } = await clienteSupabase.from('produtos').select('*').eq('codigo_barras', item.ean).maybeSingle();
                    produtoExistente = data;
                }
                if (!produtoExistente && item.sku) {
                    const { data } = await clienteSupabase.from('produtos').select('*').eq('sku', item.sku).maybeSingle();
                    produtoExistente = data;
                }

                if (produtoExistente) {
                    // Produto existe: atualiza stock somando a quantidade e atualiza custos
                    const novoEstoque = parseFloat(produtoExistente.estoque_atual || 0) + item.quantidade;
                    await clienteSupabase.rpc('atualizar_produto_seguro', {
                        p_id: produtoExistente.id,
                        p_nome: produtoExistente.nome,
                        p_preco: produtoExistente.preco_venda,
                        p_codigo_produto: produtoExistente.sku,
                        p_ean: produtoExistente.codigo_barras,
                        p_ncm: produtoExistente.ncm,
                        p_unidade_comercial: produtoExistente.unidade_comercial,
                        p_quantidade: novoEstoque,
                        p_preco_custo: item.preco_custo,
                        p_fornecedor: fornecedorId
                    });
                } else {
                    // Produto novo: insere utilizando a função RPC segura
                    await clienteSupabase.rpc('adicionar_produto_seguro', {
                        p_nome: item.nome,
                        p_preco: item.preco_venda,
                        p_codigo_produto: item.sku,
                        p_ean: item.ean,
                        p_ncm: item.ncm,
                        p_unidade_comercial: item.unidade,
                        p_quantidade: item.quantidade,
                        p_preco_custo: item.preco_custo,
                        p_fornecedor: fornecedorId
                    });
                }
                itensImportados++;
            }

            mostrarToast(`Importação concluída! ${itensImportados} produtos processados com sucesso.`, "sucesso");
            desenharModuloProdutos();
        } catch (erro) {
            tratarErroSupabase(erro, "Processar XML");
            btn.textContent = "🚀 Confirmar e Importar Produtos para o Stock";
            btn.disabled = false;
        }
    });
}

  
</script>

/**
 * Consulta a base de dados e cria os cartões das entregas
 */
async function carregarListaEntregas() {
    const container = document.getElementById('lista-entregas-container');
    if (!container) return;

    const statusFiltro = document.getElementById('filtro-status-entrega').value;

    container.innerHTML = "<p style='text-align:center; color: var(--text-muted);'>⏳ A consultar Supabase...</p>";

    try {
        // Faz um JOIN para buscar os dados da venda e o nome do entregador
        let query = clienteSupabase
            .from('log_entregas')
            .select(`
                *,
                pdv_vendas ( numero_pedido, total_liquido ),
                entidades ( nome_completo )
            `)
            .order('created_at', { ascending: false })
            .limit(50); // Limite de 50 para simplificar, mas podes paginar depois

        if (statusFiltro) {
            query = query.eq('status_entrega', statusFiltro);
        }

        const { data, error } = await query;
        if (error) throw error;

        container.innerHTML = "";
        
        if (!data || data.length === 0) {
            container.innerHTML = "<p style='text-align:center; color: var(--text-muted);'>Nenhuma entrega encontrada.</p>";
            return;
        }

        // Para cada entrega, vamos criar um "cartão" visual
        data.forEach(entrega => {
            const card = document.createElement('div');
            // Estilização baseada nas cores do teu sistema
            let corBorda = 'var(--border-color)';
            if (entrega.status_entrega === 'pendente') corBorda = 'var(--warning-color)';
            if (entrega.status_entrega === 'em_rota') corBorda = 'var(--info-color)';
            if (entrega.status_entrega === 'entregue') corBorda = 'var(--success-color)';

            card.style.cssText = `background: var(--input-bg); border-left: 5px solid ${corBorda}; padding: 14px; border-radius: 8px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;`;
            
            const pedidoNumero = entrega.pdv_vendas ? entrega.pdv_vendas.numero_pedido : 'N/D';
            const nomeEntregador = entrega.entidades ? entrega.entidades.nome_completo : 'Sem Entregador';
            const morada = entrega.endereco_entrega || 'Morada não informada';

            // HTML interno do cartão
            card.innerHTML = `
                <div style="flex-grow: 1; min-width: 200px;">
                    <strong style="color: var(--text-main); font-size: 1.1em;">Pedido #${pedidoNumero}</strong>
                    <span class="badge-status" style="background: ${corBorda}; color:#fff; margin-left: 8px;">${entrega.status_entrega.toUpperCase()}</span>
                    <br>
                    <span style="color: var(--text-muted); font-size: 0.85em;">🛵 Entregador: ${escaparHTML(nomeEntregador)}</span><br>
                    <span style="color: var(--text-muted); font-size: 0.85em;">📍 Morada: ${escaparHTML(morada)}</span>
                </div>
            `;

            // Lógica dos Botões de Ação (Avançar o status da entrega)
            const areaBotoes = document.createElement('div');
            areaBotoes.style.display = 'flex';
            areaBotoes.style.gap = '8px';

            if (entrega.status_entrega === 'pendente') {
                const btnRota = document.createElement('button');
                btnRota.textContent = "🚀 Enviar p/ Rota";
                btnRota.className = "btn-secundario";
                btnRota.style.cssText = "width: auto; padding: 8px 12px; margin: 0; color: var(--info-color); border-color: var(--info-color);";
                btnRota.onclick = () => atualizarStatusEntrega(entrega.id, 'em_rota');
                areaBotoes.appendChild(btnRota);
            } 
            else if (entrega.status_entrega === 'em_rota') {
                const btnConcluir = document.createElement('button');
                btnConcluir.textContent = "✅ Confirmar Entrega";
                btnConcluir.className = "btn-sucesso";
                btnConcluir.style.cssText = "width: auto; padding: 8px 12px; margin: 0;";
                btnConcluir.onclick = () => atualizarStatusEntrega(entrega.id, 'entregue');
                areaBotoes.appendChild(btnConcluir);
            }

            card.appendChild(areaBotoes);
            container.appendChild(card);
        });

    } catch (e) {
        tratarErroSupabase(e, "Carregar Entregas");
    }
}

/**
 * Função responsável por mudar o status da entrega na base de dados
 */
async function atualizarStatusEntrega(entregaId, novoStatus) {
    try {
        const payload = { status_entrega: novoStatus };
        
        // Se mudou para em rota, regista a hora de saída
        if (novoStatus === 'em_rota') {
            payload.data_hora_saida = new Date().toISOString();
        }
        // Se mudou para entregue, regista a hora de chegada
        if (novoStatus === 'entregue') {
            payload.data_hora_entrega = new Date().toISOString();
        }

        const { error } = await clienteSupabase
            .from('log_entregas')
            .update(payload)
            .eq('id', entregaId);

        if (error) throw error;
        
        mostrarToast("Status da entrega atualizado!", "sucesso");
        carregarListaEntregas(); // Recarrega a lista para mostrar a alteração

    } catch (e) {
        tratarErroSupabase(e, "Atualizar Status da Entrega");
    }
}

/**
 * Desenha o formulário para registar uma nova entrega
 */
async function desenharModuloNovaEntrega() {
    appRoot.innerHTML = `
        <div class="card" style="margin-top: 5vh; max-width: 500px;">
            <div class="titulo">🛵 Registar Nova Entrega</div>
            
            <form id="form-nova-entrega">
                <label>Selecionar Pedido (Venda) *</label>
                <select id="entrega-venda-id" required>
                    <option value="">A carregar pedidos recentes...</option>
                </select>

                <label>Selecionar Entregador *</label>
                <select id="entrega-entregador-id" required>
                    <option value="">A carregar entregadores...</option>
                </select>

                <label>Morada de Entrega Completa *</label>
                <textarea id="entrega-endereco" rows="3" required placeholder="Rua, Número, Bairro, Ponto de Referência..."></textarea>

                <button type="submit" id="btn-salvar-entrega" class="btn-neon" style="margin-top: 15px;">💾 Salvar Entrega</button>
                <button type="button" class="btn-secundario" onclick="desenharModuloEntregas()">❌ Cancelar</button>
            </form>
        </div>
    `;

    try {
        // 1. Preenche o select de Vendas (Trazemos as 30 últimas vendas concluídas)
        const { data: vendas } = await clienteSupabase
            .from('pdv_vendas')
            .select('id, numero_pedido')
            .eq('status', 'concluida')
            .order('created_at', { ascending: false })
            .limit(30);
            
        const selectVenda = document.getElementById('entrega-venda-id');
        selectVenda.innerHTML = '<option value="">Escolha um Pedido...</option>';
        if (vendas) {
            vendas.forEach(v => {
                selectVenda.innerHTML += `<option value="${v.id}">Pedido #${v.numero_pedido}</option>`;
            });
        }

        // 2. Preenche o select de Entregadores (Busca na tabela 'entidades' onde tipo = 'entregador')
        const { data: entregadores } = await clienteSupabase
            .from('entidades')
            .select('id, nome_completo')
            .eq('tipo', 'entregador')
            .neq('status', 'lixeira');
            
        const selectEntregador = document.getElementById('entrega-entregador-id');
        selectEntregador.innerHTML = '<option value="">Escolha um Entregador...</option>';
        if (entregadores) {
            entregadores.forEach(e => {
                selectEntregador.innerHTML += `<option value="${e.id}">${escaparHTML(e.nome_completo)}</option>`;
            });
        }

    } catch (e) {
        console.error("Erro ao carregar dados do formulário:", e);
    }

    // 3. O que acontece quando clicas no botão de Salvar
    document.getElementById('form-nova-entrega').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('btn-salvar-entrega');
        btn.textContent = "⏳ A gravar...";
        btn.disabled = true;

        const payload = {
            venda_id: document.getElementById('entrega-venda-id').value,
            entregador_id: document.getElementById('entrega-entregador-id').value,
            endereco_entrega: document.getElementById('entrega-endereco').value.trim(),
            status_entrega: 'pendente' // Status inicial padrão
        };

        try {
            const { error } = await clienteSupabase.from('log_entregas').insert([payload]);
            if (error) throw error;
            
            mostrarToast("Entrega registada com sucesso!", "sucesso");
            desenharModuloEntregas(); // Volta para a lista principal
            
        } catch (erro) {
            tratarErroSupabase(erro, "Registar Entrega");
            btn.textContent = "💾 Salvar Entrega";
            btn.disabled = false;
        }
    });
}
</script>

  <!-- 🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥🟥 -->
  
<script>
   src="vitrine.js"
  /* =========================================================
   🛍️ MÓDULO VITRINE (LOJA ONLINE COM SEGURANÇA VIA VIEW)
   ========================================================= */

let carrinhoVitrine = [];

/**
 * Desenha o ecrã principal da loja para o cliente
 */
function desenharModuloVitrinePublica() {
    // Esconde os botões flutuantes de administração quando estamos na loja
    const containerFerramentas = document.querySelector('div[style*="z-index: 10000"]');
    if (containerFerramentas) containerFerramentas.style.display = 'none';

    const logoHTML = dadosEmpresaGlobal.foto_url 
        ? `<img src="${escaparHTML(dadosEmpresaGlobal.foto_url)}" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-neon);">`
        : `🛍️`;

    appRoot.innerHTML = `
        <div style="max-width: 900px; margin: 0 auto; padding-top: 2vh;">
            
            <!-- Cabeçalho da Loja -->
            <div class="card" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 15px 22px; max-width: 100%;">
                <div style="display: flex; align-items: center; gap: 15px;">
                    ${logoHTML}
                    <div>
                        <h2 style="margin: 0; color: var(--accent-neon);">${escaparHTML(dadosEmpresaGlobal.nome_completo || 'Nossa Loja')}</h2>
                        <span style="font-size: 0.85em; color: var(--text-muted);">Faça o seu pedido online</span>
                    </div>
                </div>
                
                <!-- Resumo do Carrinho no Cabeçalho -->
                <button id="btn-ver-carrinho" class="btn-neon" style="width: auto; margin: 0; position: relative;">
                    🛒 Carrinho (<span id="vitrine-qtd-carrinho">0</span>)
                </button>
            </div>

            <!-- Filtros e Pesquisa -->
            <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
                <input type="text" id="vitrine-busca" placeholder="🔍 Pesquisar produtos..." style="flex: 2; min-width: 200px; margin-bottom: 0;">
                <select id="vitrine-categoria" style="flex: 1; min-width: 150px; margin-bottom: 0;">
                    <option value="">Todas as Categorias</option>
                </select>
                <button class="btn-secundario" style="width: auto; margin: 0; padding: 0 15px;" onclick="voltarAoERP()">⬅️ Voltar ao ERP</button>
            </div>

            <!-- Grelha de Produtos -->
            <div id="vitrine-lista-produtos" class="vitrine-grid">
                <p style="text-align:center; color: var(--text-muted); width: 100%; grid-column: 1 / -1;">⏳ A carregar catálogo seguro...</p>
            </div>
        </div>

        <!-- MODAL DO CARRINHO (Escondido por padrão) -->
        <div id="modal-carrinho" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 99999; justify-content: center; align-items: center; padding: 15px;">
            <div class="card" style="width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative;">
                <h3 style="color: var(--accent-neon); margin-top: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">🛒 O seu Carrinho</h3>
                
                <div id="vitrine-itens-carrinho" style="min-height: 100px; margin-bottom: 20px;">
                    <!-- Itens entram aqui -->
                </div>

                <div style="border-top: 1px solid var(--border-color); padding-top: 15px; margin-bottom: 15px;">
                    <label>Como deseja receber?</label>
                    <select id="vitrine-tipo-entrega" style="margin-bottom: 10px;">
                        <option value="recolha">🏪 Levantar na Loja</option>
                        <option value="entrega">🛵 Entrega ao Domicílio</option>
                    </select>
                    
                    <textarea id="vitrine-morada" placeholder="Digite a sua morada completa com ponto de referência..." style="display: none; margin-bottom: 10px;" rows="2"></textarea>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <strong style="font-size: 1.2em;">Total:</strong>
                    <strong style="font-size: 1.5em; color: var(--success-color);" id="vitrine-total-carrinho">R$ 0,00</strong>
                </div>

                <button id="btn-enviar-pedido" class="btn-sucesso" style="font-size: 1.1em; padding: 14px;">📱 Enviar Pedido por WhatsApp</button>
                <button class="btn-secundario" onclick="document.getElementById('modal-carrinho').style.display='none'">Continuar a Comprar</button>
            </div>
        </div>
    `;

    // Eventos
    document.getElementById('vitrine-busca').addEventListener('input', dispararBuscaVitrine);
    document.getElementById('vitrine-categoria').addEventListener('change', dispararBuscaVitrine);
    document.getElementById('btn-ver-carrinho').addEventListener('click', () => {
        document.getElementById('modal-carrinho').style.display = 'flex';
        renderizarItensCarrinho();
    });
    document.getElementById('vitrine-tipo-entrega').addEventListener('change', (e) => {
        document.getElementById('vitrine-morada').style.display = e.target.value === 'entrega' ? 'block' : 'none';
    });
    document.getElementById('btn-enviar-pedido').addEventListener('click', finalizarPedidoWhatsApp);

    carregarFiltrosVitrine();
    carregarProdutosVitrine();
    atualizarBadgeCarrinho();
}

/**
 * Função utilitária para repor o botão flutuante ao sair da vitrine e voltar ao ERP logado
 */
function voltarAoERP() {
    const containerFerramentas = document.querySelector('div[style*="z-index: 10000"]');
    if (containerFerramentas) containerFerramentas.style.display = 'flex';
    iniciarApp();
}

/**
 * Procura as categorias únicas na View para preencher o filtro
 */
async function carregarFiltrosVitrine() {
    try {
        const { data } = await clienteSupabase.from('vitrine').select('categoria');
        if (data) {
            // Extrai categorias únicas que não sejam nulas
            const categorias = [...new Set(data.map(i => i.categoria).filter(c => c))];
            const select = document.getElementById('vitrine-categoria');
            categorias.forEach(c => select.innerHTML += `<option value="${c}">${escaparHTML(c)}</option>`);
        }
    } catch (e) { console.error("Erro ao carregar categorias", e); }
}

let timerBuscaVitrine;
function dispararBuscaVitrine() {
    clearTimeout(timerBuscaVitrine);
    timerBuscaVitrine = setTimeout(carregarProdutosVitrine, 400);
}

/**
 * Carrega os produtos exclusivamente a partir da VIEW 'vitrine'
 */
async function carregarProdutosVitrine() {
    const container = document.getElementById('vitrine-lista-produtos');
    const termo = document.getElementById('vitrine-busca').value.trim();
    const categoria = document.getElementById('vitrine-categoria').value;

    container.innerHTML = "<p style='text-align:center; color: var(--text-muted); width: 100%; grid-column: 1 / -1;'>⏳ A consultar catálogo seguro...</p>";

    try {
        let query = clienteSupabase.from('vitrine').select('*').order('nome', { ascending: true });

        if (termo) query = query.ilike('nome', `%${termo}%`);
        if (categoria) query = query.eq('categoria', categoria);

        const { data, error } = await query;
        if (error) throw error;

        container.innerHTML = "";
        
        if (!data || data.length === 0) {
            container.innerHTML = "<p style='text-align:center; color: var(--text-muted); width: 100%; grid-column: 1 / -1;'>Nenhum produto encontrado na loja.</p>";
            return;
        }

        data.forEach(prod => {
            const foto = prod.foto_url || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23666"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>';
            const preco = parseFloat(prod.preco_venda || 0).toFixed(2);
            
            // Usa as classes CSS da tua style.css
            const card = document.createElement('div');
            card.className = "vitrine-card";
            card.innerHTML = `
                <div>
                    <img src="${escaparHTML(foto)}" style="width: 100%; height: 140px; object-fit: cover; border-radius: 8px; margin-bottom: 10px;">
                    <div style="font-weight: bold; color: var(--text-main); font-size: 1.05em; margin-bottom: 5px; line-height: 1.2;">${escaparHTML(prod.nome)}</div>
                    <div style="color: var(--text-muted); font-size: 0.85em; margin-bottom: 10px;">${escaparHTML(prod.unidade_comercial || 'UN')}</div>
                </div>
                <div>
                    <div style="font-size: 1.3em; font-weight: bold; color: var(--success-color); margin-bottom: 10px;">R$ ${preco}</div>
                    <button class="btn-neon" style="padding: 8px;" onclick="adicionarProdutoVitrine('${prod.id}', '${escaparHTML(prod.nome)}', ${prod.preco_venda})">🛒 Adicionar</button>
                </div>
            `;
            container.appendChild(card);
        });

    } catch (e) {
        console.error(e);
        container.innerHTML = "<p style='text-align:center; color: var(--danger-color); width: 100%; grid-column: 1 / -1;'>❌ Erro ao carregar vitrine.</p>";
    }
}

/**
 * Lógica do Carrinho de Compras da Vitrine
 */
window.adicionarProdutoVitrine = function(id, nome, preco) {
    const existente = carrinhoVitrine.find(p => p.id === id);
    if (existente) {
        existente.quantidade += 1;
        existente.subtotal = existente.quantidade * existente.preco;
    } else {
        carrinhoVitrine.push({ id, nome, preco, quantidade: 1, subtotal: preco });
    }
    atualizarBadgeCarrinho();
    mostrarToast(`${nome} adicionado ao carrinho!`, 'sucesso');
};

function atualizarBadgeCarrinho() {
    const totalItens = carrinhoVitrine.reduce((acc, item) => acc + item.quantidade, 0);
    const badge = document.getElementById('vitrine-qtd-carrinho');
    if (badge) badge.textContent = totalItens;
}

function renderizarItensCarrinho() {
    const container = document.getElementById('vitrine-itens-carrinho');
    if (carrinhoVitrine.length === 0) {
        container.innerHTML = "<p style='text-align:center; color: var(--text-muted);'>O seu carrinho está vazio.</p>";
        document.getElementById('vitrine-total-carrinho').textContent = "R$ 0,00";
        document.getElementById('btn-enviar-pedido').disabled = true;
        return;
    }

    document.getElementById('btn-enviar-pedido').disabled = false;
    let html = '';
    let totalGeral = 0;

    carrinhoVitrine.forEach((item, index) => {
        totalGeral += item.subtotal;
        html += `
            <div style="background: var(--input-bg); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; margin-bottom: 8px; display:flex; justify-content:space-between; align-items:center;">
                <div style="flex-grow: 1;">
                    <strong style="font-size: 0.95em; color: var(--text-main);">${item.nome}</strong><br>
                    <span style="font-size: 0.85em; color: var(--text-muted);">R$ ${item.preco.toFixed(2)}</span>
                </div>
                <div style="display:flex; align-items: center; gap:10px;">
                    <div style="display:flex; gap:5px; background: rgba(0,0,0,0.2); padding: 4px; border-radius: 6px;">
                        <button onclick="alterarQtdVitrine(${index}, -1)" style="background:var(--warning-color); color:#000; border:none; width: 25px; height: 25px; border-radius:4px; font-weight:bold; cursor:pointer;">-</button>
                        <span style="width: 20px; text-align: center; font-weight: bold; line-height: 25px;">${item.quantidade}</span>
                        <button onclick="alterarQtdVitrine(${index}, 1)" style="background:var(--info-color); color:#fff; border:none; width: 25px; height: 25px; border-radius:4px; font-weight:bold; cursor:pointer;">+</button>
                    </div>
                    <strong style="min-width: 70px; text-align: right;">R$ ${item.subtotal.toFixed(2)}</strong>
                </div>
            </div>
        `;
    });

    container.innerHTML = html;
    document.getElementById('vitrine-total-carrinho').textContent = `R$ ${totalGeral.toFixed(2)}`;
}

window.alterarQtdVitrine = function(index, delta) {
    carrinhoVitrine[index].quantidade += delta;
    if (carrinhoVitrine[index].quantidade <= 0) {
        carrinhoVitrine.splice(index, 1);
    } else {
        carrinhoVitrine[index].subtotal = carrinhoVitrine[index].quantidade * carrinhoVitrine[index].preco;
    }
    renderizarItensCarrinho();
    atualizarBadgeCarrinho();
};

/**
 * Compila o pedido num texto formatado e envia para o WhatsApp da Empresa
 */
function finalizarPedidoWhatsApp() {
    const telefoneEmpresa = dadosEmpresaGlobal.telefone;
    if (!telefoneEmpresa) {
        return mostrarToast("Erro: O telefone da empresa não está configurado no sistema.", "erro");
    }

    const tipoEntrega = document.getElementById('vitrine-tipo-entrega').value;
    const morada = document.getElementById('vitrine-morada').value.trim();

    if (tipoEntrega === 'entrega' && !morada) {
        return mostrarToast("Por favor, digite a sua morada para a entrega.", "aviso");
    }

    let texto = `*NOVO PEDIDO ONLINE* 🛍️\n\n`;
    let total = 0;

    carrinhoVitrine.forEach(item => {
        texto += `▪️ ${item.quantidade}x ${item.nome} - R$ ${item.subtotal.toFixed(2)}\n`;
        total += item.subtotal;
    });

    texto += `\n*Total a pagar:* R$ ${total.toFixed(2)}\n`;
    texto += `*Modo:* ${tipoEntrega === 'recolha' ? '🏪 Levantar na Loja' : '🛵 Entrega ao Domicílio'}\n`;
    
    if (tipoEntrega === 'entrega') {
        texto += `*Morada:* ${morada}\n`;
    }

    // Se tiver chave PIX cadastrada, manda junto
    if (dadosEmpresaGlobal.chave_pix) {
        texto += `\n*Chave PIX para pagamento:* ${dadosEmpresaGlobal.chave_pix}`;
    }

    const url = `https://wa.me/${telefoneEmpresa}?text=${encodeURIComponent(texto)}`;
    
    // Limpa o carrinho e envia
    carrinhoVitrine = [];
    document.getElementById('modal-carrinho').style.display = 'none';
    atualizarBadgeCarrinho();
    
    window.open(url, '_blank');
}
</script>

</script>
