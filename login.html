<!DOCTYPE html>
<!-- Define o tipo do documento como HTML5 para garantir a renderização moderna no navegador -->
<html lang="pt-BR">
<!-- Inicia o documento HTML configurando o idioma principal para Português do Brasil -->
<head>
    <!-- Abre o cabeçalho da página, onde ficam metadados, estilos e scripts -->
    <meta charset="UTF-8">
    <!-- Define a codificação de caracteres como UTF-8 para suportar acentuação correta -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Torna a página responsiva ajustando a escala de acordo com a largura da tela do dispositivo -->
    <title>Acesso - Sistema</title>
    <!-- Define o título que aparece na aba do navegador -->
    
    <style>
        /* [INÍCIO: ESTILOS CSS] Define o design visual da página e o comportamento do botão de ver senha */
        :root {
            /* Variáveis globais de cores e temas usadas em todo o projeto */
            --bg-color: #0b1320; 
            --card-bg: #151f2b;  
            --text-main: #ffffff;
            --text-muted: #8b9eb3;
            --accent-neon: #a4e320; 
            --accent-hover: #8cc21a;
            --border-color: #2a3645;
            --danger-color: #ff4d4d;
            --info-color: #17a2b8;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box;}
        /* Estiliza o corpo da página centralizando o conteúdo vertical e horizontalmente com fundo escuro */
        .card { background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 100%; max-width: 400px; border: 1px solid var(--border-color); box-sizing: border-box; }
        /* Cria o design de cartão centralizado onde ficam os formulários */
        .titulo { text-align: center; margin-bottom: 20px; color: var(--text-main); display: flex; flex-direction: column; align-items: center; gap: 10px;}
        /* Estiliza o bloco do título principal do formulário */
        .logo-icon { color: var(--accent-neon); font-size: 1.5em; }
        /* Estiliza o ícone de raio decorativo no topo */
        .info { padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-weight: bold; border: 1px solid transparent;}
        /* Caixa padrão para exibição de mensagens de status */
        .erro { background-color: rgba(255, 77, 77, 0.1); color: var(--danger-color); border-color: var(--danger-color); }
        /* Estilo visual para mensagens de erro */
        .sucesso { background-color: rgba(164, 227, 32, 0.1); color: var(--accent-neon); border-color: var(--accent-neon); }
        /* Estilo visual para mensagens de sucesso */
        .info-msg { background-color: rgba(23, 162, 184, 0.1); color: var(--info-color); border-color: var(--info-color); }
        /* Estilo visual para mensagens informativas */
        label { font-size: 0.9em; font-weight: bold; color: var(--text-muted); display: block; margin-bottom: 5px; }
        /* Estiliza os rótulos dos campos de texto */
        input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--bg-color); color: var(--text-main); font-size: 1em; outline: none; }
        /* Estiliza os campos de entrada de dados (inputs) */
        input:focus { border-color: var(--accent-neon); }
        /* Altera a cor da borda do input quando ele está selecionado */
        
        .input-group { position: relative; margin-bottom: 20px; }
        /* Agrupa o input de senha e o botão do olhinho em um container relativo */
        .input-group input { margin-bottom: 0; padding-right: 45px; }
        /* Ajusta o espaçamento interno à direita do input de senha para não cobrir o texto */
        .btn-senha { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.2em; padding: 0; }
        /* Posiciona o botão do olhinho dentro do campo de senha de forma absoluta */
        .btn-senha:hover { color: var(--accent-neon); }
        /* Muda a cor do ícone do olhinho ao passar o rato por cima */

        .btn-neon { width: 100%; padding: 14px; background: var(--accent-neon); color: #000; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1em; font-weight: bold; }
        /* Estiliza o botão principal de ação com a cor de destaque neon */
        .btn-neon:hover { background: var(--accent-hover); }
        /* Efeito de alteração de cor ao passar o rato no botão */
        .link-alternar { display: block; text-align: center; margin-top: 20px; color: var(--text-muted); font-size: 0.9em; cursor: pointer; text-decoration: none; }
        /* Estiliza o link para alternar entre login e registo */
        .link-alternar:hover { color: var(--accent-neon); text-decoration: underline; }
        /* Efeito visual ao passar o rato no link de alternância */
        /* [FIM: ESTILOS CSS] */
    </style>

    <!-- Importação do motor oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Carrega a biblioteca externa do Supabase via CDN para permitir a comunicação com o backend -->
</head>
<body>
    <!-- Inicia o corpo visual da página web -->
    
    <div class="card">
        <!-- Cria o bloco visual principal em formato de cartão -->
        <h2 class="titulo">
            <!-- Inicia o cabeçalho do título com ícone e texto -->
            <span class="logo-icon">⚡</span> 
            <!-- Exibe o ícone de raio decorativo -->
            <span id="texto-titulo">Acesso ao Sistema</span>
            <!-- Elemento de texto do título que muda dinamicamente conforme a tela ativa -->
        </h2>
        
        <!-- Caixa de Status para mensagens dinâmicas -->
        <div id="status" class="info info-msg" style="display: none;"></div>
        <!-- Div oculta inicialmente usada para exibir avisos de erro, sucesso ou carregamento ao utilizador -->

        <!-- ========================================== -->
        <!-- FORMULÁRIO 1: LOGIN NATIVO                 -->
        <!-- ========================================== -->
        <div id="area-login">
            <!-- Bloco contenedor da interface de login -->
            <label for="input-email-login">E-mail:</label>
            <!-- Rótulo descritivo para o campo de e-mail de login -->
            <input type="email" id="input-email-login" placeholder="seu@email.com" required style="margin-bottom: 20px;">
            <!-- Campo de entrada para o e-mail do utilizador -->
            
            <label for="input-senha-login">Senha:</label>
            <!-- Rótulo descritivo para o campo de senha de login -->
            <div class="input-group">
                <!-- Contenedor agrupado para o input de senha e o botão de mostrar/ocultar -->
                <input type="password" id="input-senha-login" placeholder="••••••••" required>
                <!-- Campo de senha oculto por padrão -->
                <button type="button" class="btn-senha" onclick="toggleSenha('input-senha-login', this)">👁️</button>
                <!-- Botão interativo do "olhinho" que chama a função para alternar a visibilidade da senha -->
            </div>
            
            <button id="btn-entrar" class="btn-neon">Entrar</button>
            <!-- Botão de submissão para executar o login no sistema -->

            <a class="link-alternar" onclick="alternarTelas('registo')">Não tem conta? <strong>Criar conta</strong></a>
            <!-- Link clicável para mudar a visualização para o formulário de registo -->
        </div>

        <!-- ========================================== -->
        <!-- FORMULÁRIO 2: REGISTO NATIVO               -->
        <!-- ========================================== -->
        <div id="area-registo" style="display: none;">
            <!-- Bloco contenedor da interface de registo, oculto por padrão -->
            <label for="input-nome-empresa">Nome da Empresa / Projeto:</label>
            <!-- Rótulo para o campo do nome do projeto -->
            <input type="text" id="input-nome-empresa" placeholder="Ex: Minha Empresa" required style="margin-bottom: 20px;">
            <!-- Campo de texto para receber o nome da empresa/projeto -->

            <label for="input-email-registo">E-mail:</label>
            <!-- Rótulo para o e-mail de cadastro -->
            <input type="email" id="input-email-registo" placeholder="seu@email.com" required style="margin-bottom: 20px;">
            <!-- Campo de e-mail para o novo registo -->
            
            <label for="input-senha-registo">Senha:</label>
            <!-- Rótulo para a senha de cadastro -->
            <div class="input-group">
                <!-- Contenedor agrupado para o input de senha de registo e o botão do olhinho -->
                <input type="password" id="input-senha-registo" placeholder="Mínimo 6 caracteres" required>
                <!-- Campo de senha para o novo registo -->
                <button type="button" class="btn-senha" onclick="toggleSenha('input-senha-registo', this)">👁️</button>
                <!-- Botão do olhinho para revelar ou ocultar a senha digitada no registo -->
            </div>
            
            <button id="btn-registar" class="btn-neon">Registar</button>
            <!-- Botão para enviar os dados de criação de conta -->

            <a class="link-alternar" onclick="alternarTelas('login')">Já tem conta? <strong>Fazer Login</strong></a>
            <!-- Link para retornar ao formulário de login -->
        </div>
    </div>

    <!-- Importação das credenciais do Supabase -->
    <script src="supabase_config.js"></script>
    <!-- Carrega o ficheiro local com as chaves e a inicialização do cliente Supabase -->
    
    <script>
        // [INÍCIO: LÓGICA DE INTERFACE]
        const statusDiv = document.getElementById('status');
        // Seleciona o elemento de aviso de status na DOM
        const areaLogin = document.getElementById('area-login');
        // Seleciona a seção do formulário de login
        const areaRegisto = document.getElementById('area-registo');
        // Seleciona a seção do formulário de registo
        const textoTitulo = document.getElementById('texto-titulo');
        // Seleciona o texto do cabeçalho principal

        // Função para exibir alertas visuais formatados
        function mostrarStatus(mensagem, tipo) {
            statusDiv.textContent = mensagem;
            // Define o texto interno da caixa de status
            statusDiv.className = `info ${tipo}`;
            // Aplica as classes CSS correspondentes ao tipo de mensagem (erro, sucesso ou info)
            statusDiv.style.display = "block";
            // Torna o elemento visível na tela
        }

        // Função para alternar entre as telas de login e registo
        function alternarTelas(tela) {
            statusDiv.style.display = "none";
            // Oculta eventuais mensagens anteriores ao mudar de ecrã
            if (tela === 'registo') {
                // Verifica se o ecrã solicitado é o de registo
                areaLogin.style.display = "none";
                // Esconde o painel de login
                areaRegisto.style.display = "block";
                // Mostra o painel de registo
                textoTitulo.textContent = "Criar Nova Conta";
                // Altera o título superior da página
            } else {
                // Caso contrário, assume que deve mostrar o login
                areaRegisto.style.display = "none";
                // Esconde o painel de registo
                areaLogin.style.display = "block";
                // Mostra o painel de login
                textoTitulo.textContent = "Acesso ao Sistema";
                // Restaura o título padrão
            }
        }

        // Função Didática: Alterna a visibilidade da senha (o "olhinho")
        function toggleSenha(idInput, botao) {
            const input = document.getElementById(idInput);
            // Obtém o elemento de input de senha através do ID fornecido
            if (input.type === "password") {
                // Verifica se o campo está atualmente mascarado como senha
                input.type = "text";
                // Altera o tipo do input para texto comum, revelando os caracteres
                botao.textContent = "🙈"; 
                // Altera o ícone do botão para indicar que a senha está visível
            } else {
                // Caso contrário (se já estiver visível)
                input.type = "password";
                // Retorna o tipo do input para password, mascarando os caracteres
                botao.textContent = "👁️"; 
                // Restaura o ícone padrão do olhinho
            }
        }
        // [FIM: LÓGICA DE INTERFACE]

        // [INÍCIO: VERIFICAÇÃO DE SESSÃO]
        window.addEventListener('DOMContentLoaded', async () => {
            // Executa a função assíncrona assim que a página termina de carregar
            if (typeof clienteSupabase === 'undefined') {
                // Valida se o script de configuração do Supabase foi carregado corretamente
                mostrarStatus("❌ Erro: Arquivo supabase_config.js não carregado.", "erro"); 
                // Exibe mensagem crítica de erro caso o objeto não exista
                return;
                // Interrompe a execução
            }
            try {
                // Bloco de tentativa para consultar a sessão ativa no servidor
                const { data: { session } } = await clienteSupabase.auth.getSession();
                // Consulta o Supabase para verificar se o utilizador já possui uma sessão válida ativa
                if (session) {
                    // Se houver uma sessão ativa
                    mostrarStatus("Sessão ativa encontrada! Redirecionando...", "sucesso");
                    // Informa o sucesso na interface
                    setTimeout(() => { window.location.href = 'index.html'; }, 800);
                    // Redireciona o utilizador para a página principal do sistema após um breve atraso
                }
            } catch (error) {
                // Captura qualquer erro de rede ou de API
                console.error("Erro ao verificar sessão:", error);
                // Regista o erro detalhado na consola do navegador para fins de depuração
            }
        });
        // [FIM: VERIFICAÇÃO DE SESSÃO]

        // [INÍCIO: AUTENTICAÇÃO - LOGIN NATIVO]
        document.getElementById('btn-entrar').addEventListener('click', async () => {
            // Adiciona um ouvinte de clique ao botão de entrada no ERP
            const email = document.getElementById('input-email-login').value.trim();
            // Recolhe o valor do campo de e-mail removendo espaços em branco extras
            const senha = document.getElementById('input-senha-login').value;
            // Recolhe a senha digitada pelo utilizador
            const btn = document.getElementById('btn-entrar');
            // Armazena a referência do botão de login

            if (!email || !senha) {
                // Valida se os campos obrigatórios estão preenchidos
                alert("Preencha o e-mail e a senha.");
                // Emite um alerta nativo se faltar algum dado
                return;
                // Interrompe o fluxo
            }

            btn.textContent = "A entrar...";
            // Altera o texto do botão para indicar processamento
            btn.disabled = true;
            // Desativa o botão para evitar múltiplos cliques seguidos

            const { error } = await clienteSupabase.auth.signInWithPassword({ 
                // Chama a função nativa do Supabase para autenticar com e-mail e senha
                email: email, 
                password: senha 
            });

            if (error) {
                // Verifica se ocorreu algum erro retornado pelo servidor de autenticação
                mostrarStatus("❌ Erro no login: " + error.message, "erro");
                // Mostra a mensagem de erro formatada na tela
                btn.textContent = "Entrar";
                // Restaura o texto original do botão
                btn.disabled = false;
                // Reativa o botão para nova tentativa
            } else {
                // Se a autenticação for bem-sucedida
                mostrarStatus("✅ Login efetuado com sucesso! Redirecionando...", "sucesso");
                // Mostra mensagem positiva
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                // Redireciona para o painel principal após 1 segundo
            }
        });
        // [FIM: AUTENTICAÇÃO - LOGIN NATIVO]

        // [INÍCIO: AUTENTICAÇÃO - REGISTO NATIVO COM NOME DO PROJETO]
        document.getElementById('btn-registar').addEventListener('click', async () => {
            // Adiciona um ouvinte de evento de clique ao botão de criar conta
            const empresa = document.getElementById('input-nome-empresa').value.trim();
            // Recolhe o nome da empresa/projeto preenchido pelo utilizador
            const email = document.getElementById('input-email-registo').value.trim();
            // Recolhe o e-mail inserido para o registo
            const senha = document.getElementById('input-senha-registo').value;
            // Recolhe a senha definida pelo novo utilizador
            const btn = document.getElementById('btn-registar');
            // Guarda a referência do botão de registo

            if (!empresa || !email || !senha) {
                // Valida se todos os campos necessários contêm valores
                alert("Preencha todos os campos obrigatórios.");
                // Alerta o utilizador se houver campos em branco
                return;
                // Interrompe a execução
            }

            if (senha.length < 6) {
                // Verifica a regra de segurança de comprimento mínimo de senha
                alert("A senha precisa ter pelo menos 6 caracteres.");
                // Emite aviso se a senha for demasiado curta
                return;
                // Interrompe o fluxo
            }

            btn.textContent = "A criar conta...";
            // Modifica o texto do botão para indicar carregamento
            btn.disabled = true;
            // Bloqueia o botão temporariamente
            mostrarStatus("⏳ A registar utilizador...", "info-msg");
            // Mostra um aviso informativo de processamento em curso

            // Utiliza o signUp nativo salvando o nome da empresa nos metadados do utilizador
            const { error } = await clienteSupabase.auth.signUp({ 
                // Executa a função nativa de registo do Supabase Auth
                email: email, 
                password: senha,
                options: {
                    data: {
                        nome_empresa: empresa 
                        // Armazena o nome da empresa nos metadados nativos do utilizador (user_metadata) sem precisar de tabelas extras
                    }
                }
            });

            if (error) {
                // Verifica se houve falha no processo de registo remoto
                mostrarStatus("❌ Erro no registo: " + error.message, "erro");
                // Exibe o erro detalhado na interface
                btn.textContent = "Registar";
                // Restaura o rótulo do botão
                btn.disabled = false;
                // Reativa o botão de submissão
            } else {
                // Caso o registo seja concluído com sucesso
                mostrarStatus("✅ Conta criada com sucesso! Verifique seu e-mail se necessário.", "sucesso");
                // Apresenta mensagem de êxito
                setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                // Redireciona o novo utilizador para o painel principal após 1.5 segundos
            }
        });
        // [FIM: AUTENTICAÇÃO - REGISTO NATIVO]
    </script>
</body>
</html>
