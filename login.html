<!DOCTYPE html>
<html lang="pt-BR">
<!--head_configuracoes-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Seguro - BevDistro</title>
    
    <style>
        /* ================= DESIGN SYSTEM & THEMES ================= */
        :root {
            --bg-color: #0b1320; 
            --card-bg: #151f2b;  
            --text-main: #ffffff;
            --text-muted: #8b9eb3;
            --accent-neon: #a4e320; 
            --accent-hover: #8cc21a;
            --purple-pill: #8273f6;
            --border-color: #2a3645;
            --danger-color: #ff4d4d;
            --info-color: #17a2b8;
        }

        .light-theme {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #6c757d;
            --accent-neon: #28a745;
            --accent-hover: #218838;
            --purple-pill: #6f42c1;
            --border-color: #e0e0e0;
            --danger-color: #dc3545;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; height: 100vh; transition: background-color 0.3s, color 0.3s; }
        
        .card { background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 100%; max-width: 400px; border: 1px solid var(--border-color); box-sizing: border-box; margin: 20px;}
        
        .btn-voltar { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-main); margin-bottom: 20px; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background-color 0.2s;}
        .btn-voltar:hover { background-color: rgba(255,255,255,0.05); }
        
        .titulo { text-align: center; margin-bottom: 20px; color: var(--text-main); display: flex; flex-direction: column; align-items: center; gap: 10px;}
        .logo-icon { color: var(--accent-neon); font-size: 1.5em; }

        .info { background-color: rgba(23, 162, 184, 0.1); color: var(--info-color); padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-weight: bold; border: 1px solid var(--info-color);}
        .erro { background-color: rgba(255, 77, 77, 0.1); color: var(--danger-color); border-color: var(--danger-color); }
        .sucesso { background-color: rgba(164, 227, 32, 0.1); color: var(--accent-neon); border-color: var(--accent-neon); }

        label { font-size: 0.9em; font-weight: bold; color: var(--text-muted); display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; box-sizing: border-box; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--bg-color); color: var(--text-main); font-size: 1em; outline: none; transition: border-color 0.2s;}
        input:focus { border-color: var(--accent-neon); }
        
        .btn-neon { width: 100%; padding: 14px; background: var(--accent-neon); color: #000; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1em; font-weight: bold; transition: transform 0.1s, background-color 0.2s; }
        .btn-neon:hover { background: var(--accent-hover); }
        .btn-neon:active { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<!--/head_configuracoes-->

<body>
    
    <!--interface_geral_cartao-->
    <div class="card">
        
        <!--botao_voltar-->
        <button class="btn-voltar" onclick="window.location.href='index.html'">⬅️ Voltar para a Loja</button>
        <!--/botao_voltar-->
        
        <h2 class="titulo">
            <span class="logo-icon">⚡</span> 
            Acesso Restrito
        </h2>
        
        <div id="status" class="info">Verificando segurança...</div>

        <!--formulario_login_senha-->
        <div id="area-login" style="display: none;">
            <p style="font-size: 0.9em; color: var(--text-muted); margin-top: 0; text-align: center; margin-bottom: 20px;">Insira suas credenciais de administrador.</p>
            
            <label for="input-email">E-mail Administrativo:</label>
            <input type="email" id="input-email" placeholder="admin@bevdistro.com" required>
            
            <label for="input-senha">Senha:</label>
            <input type="password" id="input-senha" placeholder="••••••••" required>
            
            <button id="btn-entrar" class="btn-neon">Entrar no ERP</button>
        </div>
        <!--/formulario_login_senha-->

        <!--area_bloqueio_biometrico-->
        <div id="area-biometria" style="display: none; text-align: center;">
            <div style="font-size: 4em; margin-bottom: 10px;">🛡️</div>
            <h3 style="margin-top: 0;">Sessão Bloqueada</h3>
            <p style="font-size: 0.9em; color: var(--text-muted); margin-bottom: 20px;">Este dispositivo possui uma sessão salva. Confirme sua identidade para acessar o ERP.</p>
            <button id="btn-desbloquear" class="btn-neon" style="background-color: var(--purple-pill); color: white;">👁️ Desbloquear com FaceID / Biometria</button>
            <button class="btn-voltar" style="margin-top: 15px; border: none;" onclick="sairESenha()">Sair e usar senha</button>
        </div>
        <!--/area_bloqueio_biometrico-->

    </div>
    <!--/interface_geral_cartao-->

    <!--logica_auth_segura_e_biometria-->
    <script src="supabase_config.js"></script>
    <script>
        // 1. HERANÇA DE TEMA DA LOJA
        if(localStorage.getItem('temaBevDistro') === 'light') {
            document.body.classList.add('light-theme');
        }

        const statusDiv = document.getElementById('status');
        const areaLogin = document.getElementById('area-login');
        const areaBiometria = document.getElementById('area-biometria');

        // 2. FUNÇÃO DE LOGIN VIA SENHA NO SUPABASE
        document.getElementById('btn-entrar').addEventListener('click', async () => {
            const email = document.getElementById('input-email').value.trim();
            const senha = document.getElementById('input-senha').value;
            const btnEntrar = document.getElementById('btn-entrar');

            if (!email || !senha) { alert("Preencha e-mail e senha!"); return; }

            btnEntrar.textContent = "Autenticando..."; btnEntrar.disabled = true;

            try {
                const { error } = await clienteSupabase.auth.signInWithPassword({ email, password: senha });
                if (error) throw error; 

                // Salva uma flag indicando que a biometria deve ser ativada na próxima vez
                localStorage.setItem('biometriaAtiva', 'true');
                
                statusDiv.textContent = "✅ Autenticado! Entrando...";
                statusDiv.className = "info sucesso";
                setTimeout(() => { window.location.href = 'listar.html'; }, 1000);
            } catch (erro) {
                console.error(erro);
                statusDiv.textContent = "❌ Erro no login: Credenciais incorretas.";
                statusDiv.className = "info erro";
                btnEntrar.textContent = "Entrar no ERP"; btnEntrar.disabled = false;
            }
        });

        // 3. FUNÇÃO WEBAUTHN CORRIGIDA (CÂMERA/DIGITAL NATIVA DO APARELHO)
        document.getElementById('btn-desbloquear').addEventListener('click', async () => {
            if (!window.PublicKeyCredential) {
                alert("O seu aparelho ou navegador não suporta biometria. Use a senha.");
                return sairESenha();
            }

            statusDiv.style.display = "block";
            statusDiv.textContent = "Aguardando leitura do rosto/digital...";
            statusDiv.className = "info";

            try {
                // Criação do Desafio de Segurança Criptográfico
                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);
                
                const userId = new Uint8Array(16);
                window.crypto.getRandomValues(userId);

                // Invoca a API de hardware do dispositivo (WebAuthn)
                const credential = await navigator.credentials.create({
                    publicKey: {
                        challenge: challenge,
                        rp: { 
                            // Omitimos o parâmetro 'id' para evitar o erro "invalid domain".
                            // O navegador assumirá automaticamente o domínio atual seguro (localhost).
                            name: "ERP BevDistro"
                        },
                        user: {
                            id: userId,
                            name: "admin",
                            displayName: "Administrador"
                        },
                        pubKeyCredParams: [
                            { type: "public-key", alg: -7 },   // ES256
                            { type: "public-key", alg: -257 }  // RS256
                        ],
                        authenticatorSelection: { 
                            authenticatorAttachment: "platform", 
                            userVerification: "required" 
                        },
                        timeout: 60000,
                        attestation: "none"
                    }
                });

                if (credential) {
                    statusDiv.textContent = "✅ Identidade Confirmada!";
                    statusDiv.className = "info sucesso";
                    setTimeout(() => { window.location.href = 'listar.html'; }, 800);
                }
            } catch (error) {
                console.error(error);
                statusDiv.textContent = "❌ Leitura biométrica falhou ou foi cancelada.";
                statusDiv.className = "info erro";
                alert("Aviso do Sistema: " + error.message);
            }
        });

        // 4. FUNÇÃO PARA DESTRUIR SESSÃO E VOLTAR PARA SENHA
        async function sairESenha() {
            await clienteSupabase.auth.signOut();
            localStorage.removeItem('biometriaAtiva');
            areaBiometria.style.display = "none";
            statusDiv.style.display = "none";
            areaLogin.style.display = "block";
        }

        // 5. INICIALIZADOR ZERO TRUST (VERIFICA SESSÃO AO ABRIR PÁGINA)
        window.addEventListener('DOMContentLoaded', async () => {
            if (typeof clienteSupabase === 'undefined') {
                statusDiv.style.display = "block";
                statusDiv.textContent = "❌ Erro Crítico: supabase_config.js não encontrado.";
                statusDiv.className = "info erro"; 
                return;
            }

            try {
                const { data: { session }, error } = await clienteSupabase.auth.getSession();

                // Regra de Negócio: Tem sessão E tem a flag da biometria ativa? Trava a tela.
                if (session && localStorage.getItem('biometriaAtiva') === 'true') {
                    statusDiv.style.display = "none";
                    areaBiometria.style.display = "block";
                } 
                // Regra de Negócio: Tem sessão, mas sem biometria? Entra direto.
                else if (session) {
                    statusDiv.style.display = "block";
                    statusDiv.textContent = "Sessão válida! Redirecionando...";
                    statusDiv.className = "info sucesso";
                    setTimeout(() => { window.location.href = 'listar.html'; }, 800);
                } 
                // Regra de Negócio: Nenhuma sessão encontrada. Mostra formulário normal.
                else {
                    statusDiv.style.display = "none";
                    areaLogin.style.display = "block";
                }
            } catch (error) {
                console.error("Erro na validação de sessão:", error);
                statusDiv.style.display = "block";
                statusDiv.textContent = "❌ Erro grave de conexão.";
                statusDiv.className = "info erro";
            }
        });
    </script>
    <!--/logica_auth_segura_e_biometria-->
</body>
</html>
