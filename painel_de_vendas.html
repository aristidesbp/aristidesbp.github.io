<!DOCTYPE html>
<html lang="pt-BR">
<!--head_configuracoes-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Vendas - ERP</title>
    
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; margin: 0; }
        .info { background-color: #d1ecf1; color: #0c5460; padding: 10px; border-radius: 5px; font-weight: bold; margin-bottom: 20px;}
        .erro { background-color: #f8d7da; color: #721c24; }
        
        .cabecalho-painel { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 20px auto; flex-wrap: wrap; gap: 10px;}
        .btn-voltar { background: #6c757d; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none;}
        
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        
        .card-pedido { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid #ccc; display: flex; flex-direction: column; justify-content: space-between;}
        
        /* Status Cores */
        .status-Pendente { border-left-color: #f39c12; }
        .status-Entregue { border-left-color: #28a745; opacity: 0.8; }
        .status-Cancelado { border-left-color: #dc3545; opacity: 0.6; }

        .pedido-topo { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px;}
        .pedido-numero { font-size: 1.3em; font-weight: bold; color: #007bff; }
        .pedido-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; color: white;}
        .badge-Pendente { background: #f39c12; }
        .badge-Entregue { background: #28a745; }
        .badge-Cancelado { background: #dc3545; }
        
        .pedido-dados p { margin: 5px 0; font-size: 0.95em; color: #333; }
        .pedido-itens { background: #f8f9fa; padding: 10px; border-radius: 4px; margin: 10px 0; font-size: 0.9em; max-height: 150px; overflow-y: auto;}
        
        .pedido-total { font-size: 1.3em; font-weight: bold; color: #28a745; text-align: right; margin-bottom: 15px;}

        .botoes-acao { display: flex; gap: 8px; flex-wrap: wrap; }
        .botoes-acao button { flex-grow: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; font-size: 0.9em;}
        .btn-entregar { background: #28a745; }
        .btn-cancelar { background: #dc3545; }
        .btn-imprimir { background: #343a40; }
        
        button:disabled { background: #ccc !important; cursor: not-allowed; }
    </style>
    
    <!-- Bibliotecas Necessárias -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<!--/head_configuracoes-->

<body>

    <!--cabecalho-->
    <div class="cabecalho-painel">
        <h2 style="margin: 0;">📦 Controle de Vendas</h2>
        <a href="listar.html" class="btn-voltar">⬅️ Voltar ao Estoque</a>
    </div>
    
    <div style="max-width: 1200px; margin: 0 auto;">
        <div id="status-bar" class="info">Verificando segurança da sessão...</div>
    </div>
    <!--/cabecalho-->

    <!--painel_listagem_pedidos-->
    <div class="container" id="grid-pedidos">
        <!-- Os cartões de pedidos serão injetados aqui -->
    </div>
    <!--/painel_listagem_pedidos-->

    <!--scripts_logica_negocio-->
    <script src="supabase_config.js"></script>
    <script>
        /* ================= 1. PROTEÇÃO XSS (NÍVEL BANCÁRIO) ================= */
        // Qualquer texto que venha do cliente passa por aqui antes de ser injetado no HTML
        const sanitizar = (texto) => {
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        };

        /* ================= 2. VERIFICAÇÃO DE SESSÃO ZERO TRUST ================= */
        document.addEventListener('DOMContentLoaded', async () => {
            const statusBar = document.getElementById('status-bar');
            
            if (typeof clienteSupabase === 'undefined') {
                statusBar.textContent = "❌ Erro Crítico: supabase_config.js não encontrado.";
                statusBar.className = "info erro";
                return;
            }

            try {
                const { data: { session }, error } = await clienteSupabase.auth.getSession();
                
                if (error || !session) {
                    statusBar.textContent = "Acesso negado. Redirecionando...";
                    return window.location.href = 'login.html';
                }
                
                statusBar.style.display = "none";
                carregarPedidos(); // Inicia o fetch apenas após validar auth

            } catch (error) {
                console.error(error);
                window.location.href = 'login.html';
            }
        });

        /* ================= 3. BUSCAR E RENDERIZAR PEDIDOS ================= */
        async function carregarPedidos() {
            const grid = document.getElementById('grid-pedidos');
            grid.innerHTML = "<p>⏳ A carregar pedidos do sistema...</p>";

            try {
                // Fetch de dados (Seguro graças às políticas RLS no backend)
                const { data: vendas, error } = await clienteSupabase
                    .from('vendas')
                    .select('*')
                    .order('criado_em', { ascending: false });

                if (error) throw error;

                if (vendas.length === 0) {
                    grid.innerHTML = "<p>Nenhuma venda registrada até o momento.</p>";
                    return;
                }

                grid.innerHTML = "";

                vendas.forEach(venda => {
                    const dataFormatada = new Date(venda.criado_em).toLocaleString('pt-BR');
                    
                    // Monta a lista de itens comprados
                    let itensHTML = '';
                    venda.itens.forEach(item => {
                        itensHTML += `<div>${item.quantidade}x ${sanitizar(item.nome)} - R$ ${(item.quantidade * item.preco).toFixed(2).replace('.', ',')}</div>`;
                    });

                    // Define se os botões de ação estarão ativos
                    const botoesBloqueados = venda.status !== 'Pendente' ? 'disabled' : '';

                    const card = document.createElement('div');
                    card.className = `card-pedido status-${venda.status}`;
                    
                    // Injeção de HTML utilizando o sanitizador
                    card.innerHTML = `
                        <div>
                            <div class="pedido-topo">
                                <span class="pedido-numero">#${String(venda.numero_pedido).padStart(5, '0')}</span>
                                <span class="pedido-badge badge-${venda.status}">${venda.status}</span>
                            </div>
                            
                            <div class="pedido-dados">
                                <p><strong>Cliente:</strong> ${sanitizar(venda.cliente_nome)}</p>
                                <p><strong>Endereço:</strong> ${sanitizar(venda.cliente_endereco)}</p>
                                <p><strong>Pagamento:</strong> ${sanitizar(venda.forma_pagamento)}</p>
                                <p><strong>Data:</strong> ${dataFormatada}</p>
                            </div>
                            
                            <div class="pedido-itens">
                                ${itensHTML}
                            </div>
                            
                            <div class="pedido-total">R$ ${parseFloat(venda.valor_total).toFixed(2).replace('.', ',')}</div>
                        </div>

                        <div class="botoes-acao">
                            <button class="btn-entregar" ${botoesBloqueados} onclick="marcarEntregue('${venda.id}')">✅ Entregar</button>
                            <button class="btn-cancelar" ${botoesBloqueados} onclick="cancelarPedido('${venda.id}')">❌ Cancelar (Estorna)</button>
                            <button class="btn-imprimir" onclick="imprimirCupom('${encodeURIComponent(JSON.stringify(venda))}')">🖨️ Cupom</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (erro) {
                console.error(erro);
                grid.innerHTML = "<p class='erro' style='padding: 10px;'>Erro ao carregar os pedidos.</p>";
            }
        }

        /* ================= 4. AÇÕES DE BACKEND VIA RPC ================= */
        
        async function marcarEntregue(idPedido) {
            if(!confirm("Confirmar entrega deste pedido?")) return;
            try {
                const { error } = await clienteSupabase.rpc('marcar_pedido_entregue_seguro', { p_pedido_id: idPedido });
                if (error) throw error;
                alert("Pedido atualizado para Entregue!");
                carregarPedidos(); // Recarrega a tela
            } catch (erro) {
                console.error(erro);
                alert("Erro ao atualizar pedido.");
            }
        }

        async function cancelarPedido(idPedido) {
            if(!confirm("ATENÇÃO: Cancelar este pedido e devolver os itens automaticamente para o estoque?")) return;
            try {
                // A RPC do backend fará a matemática do estoque. O frontend só obedece.
                const { error } = await clienteSupabase.rpc('cancelar_pedido_seguro', { p_pedido_id: idPedido });
                if (error) throw error;
                alert("Pedido cancelado e produtos devolvidos ao estoque com sucesso!");
                carregarPedidos(); 
            } catch (erro) {
                console.error(erro);
                alert("Erro ao cancelar. O pedido já pode ter sido estornado.");
            }
        }

        /* ================= 5. GERADOR DE CUPOM FISCAL TÉRMICO ================= */
        
        function imprimirCupom(vendaEncoded) {
            const venda = JSON.parse(decodeURIComponent(vendaEncoded));
            const dataVenda = new Date(venda.criado_em).toLocaleString('pt-BR');
            
            let itensCupom = '';
            venda.itens.forEach(item => {
                const sub = (item.quantidade * item.preco).toFixed(2);
                itensCupom += `
                    <tr>
                        <td style="text-align: left;">${item.quantidade}x ${sanitizar(item.nome)}</td>
                        <td style="text-align: right;">${sub}</td>
                    </tr>
                `;
            });

            // Cria uma janela pronta para impressora térmica (largura reduzida)
            const janela = window.open('', '_blank', 'width=350,height=600');
            janela.document.write(`
                <html>
                <head>
                    <title>Cupom #${venda.numero_pedido}</title>
                    <style>
                        body { font-family: monospace; font-size: 12px; margin: 0; padding: 10px; width: 300px; color: #000; }
                        .text-center { text-align: center; }
                        h2 { margin: 5px 0; font-size: 16px; }
                        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
                        td { border-bottom: 1px dashed #000; padding: 4px 0; }
                        .total { font-weight: bold; font-size: 14px; text-align: right; margin-top: 10px; }
                    </style>
                </head>
                <body>
                    <div class="text-center">
                        <h2>DEPÓSITO DE BEBIDAS</h2>
                        <p>Documento Auxiliar de Venda<br>Não é documento fiscal</p>
                        <p>---------------------------------</p>
                    </div>
                    <p><strong>Pedido:</strong> #${String(venda.numero_pedido).padStart(5, '0')}<br>
                    <strong>Data:</strong> ${dataVenda}</p>
                    <p>---------------------------------</p>
                    <p><strong>Cliente:</strong> ${sanitizar(venda.cliente_nome)}<br>
                    <strong>Endereço:</strong> ${sanitizar(venda.cliente_endereco)}<br>
                    <strong>Pagamento:</strong> ${sanitizar(venda.forma_pagamento)}</p>
                    <p>---------------------------------</p>
                    <table>
                        ${itensCupom}
                    </table>
                    <div class="total">TOTAL: R$ ${parseFloat(venda.valor_total).toFixed(2).replace('.', ',')}</div>
                    <div class="text-center" style="margin-top: 20px;">
                        <p>Obrigado pela preferência!</p>
                        <p>---------------------------------</p>
                    </div>
                </body>
                </html>
            `);
            janela.document.close();
            janela.focus();
            // Dispara o diálogo de impressão automaticamente
            setTimeout(() => { janela.print(); }, 500);
        }
    </script>
    <!--/scripts_logica_negocio-->
</body>
</html>
