<!DOCTYPE html>
<html class="light" lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Gerenciamento de Entidades - ERP_ABP</title>
    
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    
    <!-- Tailwind CSS & Supabase -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase_config.js"></script>
    <script src="variavel_e_constante.js"></script>

    <!-- Configuração do Tailwind -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: { 
                extend: { 
                    colors: { 
                        primary: "#006c45" 
                    } 
                } 
            }
        }
    </script>
</head>
<body class="bg-[#F8FAFC] dark:bg-[#0f172a] text-slate-800 dark:text-slate-200 font-sans min-h-screen">

    <!-- CONTAINER ONDE A NAVBAR É INJETADA -->
    <div id="navbar-container"></div>

    <!-- CONTEÚDO PRINCIPAL DA PÁGINA -->
    <main class="pt-24 px-4 sm:px-8 max-w-7xl mx-auto pb-12">
        <!-- Cabeçalho do Módulo -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">Gerenciamento de Entidades</h1>
                <p class="text-slate-600 dark:text-slate-400 mt-1">Cadastre e gerencie clientes, fornecedores e parceiros comerciais.</p>
            </div>
            <button onclick="abrirModalNovaEntidade()" class="px-4 py-2 bg-primary hover:bg-primary/90 text-white font-semibold rounded-xl shadow-sm transition-all flex items-center gap-2 cursor-pointer">
                <span class="material-symbols-outlined">add</span> Nova Entidade
            </button>
        </div>

        <!-- TABELA DE DADOS -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-xs uppercase font-bold text-slate-500 dark:text-slate-400">
                            <th class="p-4">Nome / Razão Social</th>
                            <th class="p-4">Tipo</th>
                            <th class="p-4">Documento</th>
                            <th class="p-4">Telefone</th>
                            <th class="p-4 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-entidades" class="divide-y divide-slate-200 dark:divide-slate-700 text-sm">
                        <!-- Os dados serão injetados dinamicamente via JavaScript -->
                        <tr>
                            <td colspan="5" class="p-6 text-center text-slate-500 dark:text-slate-400">Carregando entidades...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- IMPORTAÇÃO DA NAVBAR -->
    <script src="navbar.js"></script>

    <!-- INICIALIZAÇÃO DA PÁGINA -->
    <script>
        async function initEntidades() {
            console.log("Módulo de Entidades carregado com sucesso.");
            // Adicione aqui a chamada para carregar os dados do Supabase (ex: carregarEntidadesDoBanco());
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // Renderiza a navbar padronizada (sem argumentos)
            renderizarNavbar();
            // Executa a inicialização específica da página
            await initEntidades();
        });
    </script>
</body>
</html>
